                  - sourceCategoryId
                  - targetCategoryId
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Profession "Plumber" transferred to "Home Repair" successfully
                  profession:
                    $ref: '#/components/schemas/ConfigProfession'
                  sourceCategoryId:
                    $ref: '#/components/schemas/ObjectId'
                  targetCategoryId:
                    $ref: '#/components/schemas/ObjectId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/configurations/quick-access-professions:
    post:
      tags:
        - Configurations
      operationId: updateQuickAccessProfessions
      summary: Replace the quick-access profession row (max 8, ordered)
      description: >-
        Validates `professions` is an array (400 "Professions must be an array") of at most 8 entries (400 "Maximum 8
        quick access professions allowed"). Loads EVERY category, resets every profession to isQuickAccess=false /
        quickAccessOrder=0, then marks each profession whose _id matches an entry as quick access with quickAccessOrder
        = array index + 1, and saves every category that has professions (full validation; one write per category, no
        transaction). Unknown professionIds are silently ignored; an empty array clears the row. Re-reads to count the
        result. Writes an ActivityLog audit row `quick_access_updated` with the before/after ordered name lists, only if
        the row changed (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room). Auth:
        adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an admin
        account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - professions
              properties:
                professions:
                  type: array
                  items:
                    type: object
                    required:
                      - professionId
                    properties:
                      professionId:
                        allOf:
                          - $ref: '#/components/schemas/ObjectId'
                        description: Profession _id (compared as a string).
                  maxItems: 8
                  description: Desired row in display order.
      responses:
        '200':
          description: Row replaced.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - verifiedCount
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Quick access professions updated successfully
                  verifiedCount:
                    type: integer
                    description: Number of professions flagged isQuickAccess after the save.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
