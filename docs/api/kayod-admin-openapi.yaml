  /api/admin/reported-posts/{reportId}/review:
    put:
      security:
        - sessionCookie: []
      x-access: admin
      operationId: reviewReportedPost
      tags:
        - Legacy reports
      summary: 'Review a reported post: keep the job, dismiss the report, or delete the job'
      description: >-
        Requires an admin session (adminAuth): no authenticated admin/superadmin session -> 403 `Admin access required`;
        a session whose account is no longer active or no longer an admin is destroyed -> 401. Not transactional. Side
        effects, in order: (1) if the stored comment is empty, it is overwritten with "Legacy report - original comment
        missing"; (2) action `delete`: if the job exists and is not already soft-deleted, Job.findByIdAndUpdate sets
        status `cancelled`, isDeleted true, deletedAt now, deletionReason "Deleted due to report: <reason>" (no
        escrow/refund handling, no notification); (3) the report is updated without validators: status
        (`approve`/`dismiss` -> `dismissed`, `delete` -> `action_taken`), reviewedAt now, adminNotes = "[Reviewed by:
        <session username> on <ISO>]" + " - <adminNotes>" when notes are given (replaces any previous notes). An
        `actionTaken` value (post_approved / report_dismissed / post_deleted) is also sent but is not in the
        ReportedPost schema, so strict mode drops it; reviewedBy is never set. (4) Audit row `report_reviewed`
        (targetType `report`, targetModel `ReportedPost`, targetId = report id, metadata {outcome, status, actionTaken,
        targetName: job title}) and an `activity:new` socket event to the superadmins room. adminNotes must be a string
        (a non-string -> 500); its 1000-char limit is not enforced (no validators).
      parameters:
        - name: reportId
          in: path
          required: true
          description: ReportedPost id. A malformed id yields 400 (CastError).
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  description: >-
                    `approve` = keep the job (report dismissed), `dismiss` = dismiss the report, `delete` = soft-delete
                    and cancel the job.
                  enum:
                    - approve
                    - dismiss
                    - delete
                adminNotes:
                  type: string
                  description: Optional note appended after the reviewer stamp; trimmed.
                  default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - reportedPost
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Report approved - post kept successfully
                      - Report dismissed successfully
                      - Report resolved - post deleted successfully
                  reportedPost:
                    allOf:
                      - $ref: '#/components/schemas/LegacyReportsReviewedPost'
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/reported-posts/bulk-update:
