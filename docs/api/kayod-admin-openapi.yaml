      tags:
        - Users
      summary: Soft-delete the user
      description: >-
        Rejects a missing/blank reason with 400 "Delete reason is required". Sets accountStatus "deleted", isRestricted
        true and replaces restrictionDetails with {type: "deleted", reason (trimmed), restrictedAt: now, appealAllowed:
        false, restrictedBy: session admin}. Nothing is removed and there is no expiry; PATCH /unrestrict (or /restrict
        with restricted falsy) restores the account.


        Side effects:

        - Writes the `users` document with findByIdAndUpdate (schema validators are not run).

        - Writes an ActivityLog row via logActivity: user_deleted with metadata {reason}. The audit write is non-fatal
        (a failure is logged and the request still succeeds); on success it also emits `activity:new` {logId,
        actionType} to the `/admin` namespace, room `superadmins`.

        - Emits Socket.IO `user:updated` {user: <UsersUserDetail>, updateType: "deleted"} to room `admin` on the default
        namespace.

        - No notification is sent to the user; no transaction is used.

        - There is no guard on the target: staff accounts (admin/superadmin) and the calling admin can be targeted; a
        targeted admin loses access on their next request (adminAuth requires accountStatus active).


        A malformed userId is a Mongoose CastError → 400 "Invalid _id". The response is the user re-read through
        getUserById (same shape as GET /api/users/{userId}).


        Access: `adminAuth` — the session must be authenticated with role admin or superadmin (otherwise **403** `Admin
        access required`, which is also what an unauthenticated caller gets). The admin account is re-read on every
        request; if it no longer exists, is not `accountStatus: active`, or is no longer admin/superadmin, the session
        is destroyed and **401** is returned.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's `_id`.
