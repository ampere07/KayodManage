        permissions:
          $ref: '#/components/schemas/AdminsPermissions'
        accountStatus:
          $ref: '#/components/schemas/AdminsAccountStatus'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastLogin:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Absent if the admin never signed in.
    AdminsListResponse:
      type: object
      required:
        - success
        - admins
      properties:
        success:
          type: boolean
          enum:
            - true
        admins:
          type: array
          items:
            $ref: '#/components/schemas/AdminsListItem'
          description: Every admin account, any status, in natural (unsorted) order. No paging.
    AdminsDetail:
      type: object
      required:
        - _id
        - name
        - email
        - phone
        - userType
        - location
        - accountStatus
        - permissions
        - createdAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        userType:
          $ref: '#/components/schemas/AdminsAdminUserType'
        location:
          type: string
        accountStatus:
          $ref: '#/components/schemas/AdminsAccountStatus'
        permissions:
          $ref: '#/components/schemas/AdminsPermissions'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastLogin:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Absent if the admin never signed in.
    AdminsDetailResponse:
      type: object
      required:
        - success
        - admin
      properties:
        success:
          type: boolean
          enum:
            - true
        admin:
          $ref: '#/components/schemas/AdminsDetail'
    AdminsActivityItem:
      type: object
      required:
        - _id
        - actionType
        - action
        - group
        - sensitive
        - description
        - targetType
        - targetName
        - metadata
        - ipAddress
        - createdAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        actionType:
          $ref: '#/components/schemas/AuditActionType'
        action:
          type: string
          description: Catalog label, or the raw actionType if not in the catalog.
        group:
          allOf:
            - $ref: '#/components/schemas/AuditGroupKey'
          nullable: true
        sensitive:
          type: boolean
        description:
          type: string
        targetType:
          allOf:
            - $ref: '#/components/schemas/AuditTargetType'
          nullable: true
        targetName:
          type: string
          nullable: true
          description: >-
            Populated target's name/title/subject (populate selects name email title subject), else metadata.targetName,
            else null.
