  /api/reports/bulk-status:
    patch:
      operationId: bulkUpdateReportStatus
      tags:
        - Reports
      summary: Decide many reports (either collection) at once
      description: >-
        Requires an authenticated admin session (authMiddleware + adminAuth): 401 without a session or when the admin
        account is no longer active/admin (session destroyed), 403 when the session role is not admin/superadmin.


        Validation (400): status must be under_review/action_taken/dismissed ("Invalid status"); items must be a
        non-empty array ("Select at least one report") of at most 500 ("At most 500 reports at a time"), each with a
        valid ObjectId id and source "report" or "reported_post" ("Invalid report reference").


        Per collection (set-based: one read, one conditional updateMany, one read-back): only reports whose stored
        status still awaits a decision (open/under_review, legacy pending/reviewed included) and differs from the target
        are changed; missing ids are skipped "not found", already-closed or already-at-target ones "already <status>".
        The updateMany re-checks status in its filter, so a report decided by someone else between read and write is
        skipped "changed by someone else meanwhile". Sets status, reviewedBy = caller, reviewedAt = now, adminNotes
        (when a non-blank string is given), and for Report rows with status ≠ under_review, actionTaken (given value,
        else "report_dismissed" for dismissed / "none" for action_taken). updateMany runs without validators. A database
        error in one collection marks that collection's unresolved ids as failed; the other collection still proceeds
        and the response is still 200.


        One ActivityLog row `reports_bulk_reviewed` (targetType report; metadata status, count, skipped, failed,
        reports, adminNotes) when at least one report changed.
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportsBulkStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportsBulkStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
