  /api/auth/check:
    get:
      operationId: checkAuth
      tags:
        - Auth
      summary: Report whether the session is signed in, with the admin's current role and permissions
      description: >-
        No auth middleware; always HTTP 200. Without an authenticated session → `{ success: false, isAuthenticated:
        false }`. Otherwise back-fills `session.userId` from `session.adminId` if missing, then reads the account
        (`permissions userType name email accountStatus`). If the account exists but is not `accountStatus: active` or
        is no longer admin/superadmin, the session is destroyed and `{ success: false, isAuthenticated: false }` is
        returned. If it exists and is valid, `session.role` is refreshed from `userType` and the response carries the
        current name, email, role and the nine permission flags (see AuthPermissions).


        Edge cases: if the account no longer exists the session is NOT ended here — the response still says
        `isAuthenticated: true`, with no name/email, the cached role, and the fallback permissions (all true except
        `settings: false`); the next adminAuth-protected call then returns 401. If the database lookup throws, a
        degraded `user` object without name, email or permissions is returned (still `isAuthenticated: true`). Session
        changes (userId back-fill, role refresh) are persisted by express-session; no audit-log row.
      security: []
      x-access: public
      responses:
        '200':
          description: Authentication state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCheckResponse'
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Sign in to the admin panel with email and password
      description: >-
        Looks up `User.findOne({ email: req.body.username, userType: { $in: ["admin", "superadmin"] } })` with
        `+password` — only admin and superadmin accounts can sign in (finance / customer support / support user types
        cannot). The body field is called `username` but is matched against the account email, exactly and
        case-sensitively. No input sanitisation: a JSON object (e.g. a Mongo operator) in `username` is passed into the
        filter. Unknown email, account without a password, or wrong password → 401 `Invalid credentials`; correct
        password on an account whose `accountStatus` is not `active` → 403 `Account is disabled`.


        On success: sets `lastLogin` and calls `admin.save()` (full-document save, so a stored admin document that fails
        schema validation turns the login into a 400; the pre-save hook also rewrites `isRestricted`). Then populates
        the existing session (it is NOT regenerated) with `isAuthenticated`, `role`, `username` (email), `adminId`,
        `userId`, `userAgent`, `ipAddress`, `location`, `sessionId`; express-session then sets the `admin.session.id`
        cookie. Client IP is taken from the first `X-Forwarded-For` entry, then `X-Real-IP`, then `req.ip` (headers are
        trusted regardless of `trust proxy`, so the recorded IP is client-controllable); location comes from an offline
        geoip-lite lookup (`Local Development` for loopback, `Unknown` when not found) — no outbound call.


        Writes one ActivityLog row (`actionType: admin_login`, `targetType: admin`, `targetModel: User`, `targetId` =
        the admin, description `Signed in from <location>` or `Signed in`, metadata `{ location, targetName }`) and
        emits socket.io `activity:new` `{ logId, actionType }` to room `superadmins` on namespace `/admin`; an audit-log
        failure is swallowed. The response does not include permissions — call GET /api/auth/check for those. Unexpected
        errors → 500 `Internal server error` (via asyncHandler).
      security: []
      x-access: public
      requestBody:
        required: true
        description: Parsed by `express.json()`; `application/x-www-form-urlencoded` (extended/qs syntax) is accepted too.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                `admin.session.id=s%3A<signed id>; Path=/; Expires=<now + 24 h>; HttpOnly`, `SameSite=Lax` outside
                production / `None` in production unless SESSION_COOKIE_SAME_SITE overrides it, `Secure` in production.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Destroy the current admin session
      description: >-
        No auth middleware: calls `req.session.destroy()` on whatever session the request carries (a request without a
        session cookie gets a fresh, never-saved session, so logout always succeeds). Removes the session from the
        store; the `admin.session.id` cookie is NOT cleared on the response (it simply no longer resolves to a session).
        No audit-log row and no socket event. Store failure → 500 `{ success: false, error: "Could not log out" }`. No
        request body.
      security: []
      x-access: public
      responses:
        '200':
          description: Session destroyed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '500':
          $ref: '#/components/responses/ServerError'
