              allOf:
                - $ref: '#/components/schemas/ObjectId'
              nullable: true
            heldTransaction:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
              nullable: true
        paymentStatus:
          type: string
          enum:
            - pending
