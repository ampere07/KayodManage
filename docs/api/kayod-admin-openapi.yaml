      summary: Dismiss an alert for the calling admin only
      description: >-
        Upserts a DismissedAlert {adminId: caller, alertId} (unique per admin+alert; idempotent). The socket layer hides
        an admin's dismissed alerts from their alert feed. Does not modify the Alert itself. No audit-log row, no socket
        emit. Checks, in order: no admin id on the request → 401 {success:false, message:"Admin ID not found"}
        (unreachable after adminAuth); invalid alertId → 400 "Invalid alert ID"; caller id not an ObjectId (only
        possible via adminAuth's DB-failure fallback) → 400 "Invalid admin ID"; alert missing → 404 "Alert not found".
        These bodies carry {success, message} only. Other errors are a 500 "Failed to dismiss alert". Access: adminAuth
        (session role admin/superadmin and the account must still be active with an admin role; a
        deactivated/demoted/deleted admin gets a 401 and the session is destroyed; no admin session is a 403 "Admin
        access required").
      security:
