        no event is sent. Auth: adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access
        required"}`; an admin account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.


        Same handler as `DELETE /api/configurations/professions/{professionId}` (second mount of the configurations
        router; the admin panel uses this one).
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: professionId
          in: path
          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Profession deleted successfully
