          $ref: '#/components/schemas/AuditMetadata'
        ipAddress:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
    AdminsActivityByAction:
      type: object
      required:
        - actionType
        - label
        - group
        - sensitive
        - count
      properties:
        actionType:
          $ref: '#/components/schemas/AuditActionType'
        label:
          type: string
        group:
          allOf:
            - $ref: '#/components/schemas/AuditGroupKey'
          nullable: true
        sensitive:
          type: boolean
        count:
          type: integer
    AdminsActivityResponse:
      type: object
      required:
        - success
        - activities
        - total
        - page
        - limit
        - hasMore
        - summary
      properties:
        success:
          type: boolean
          enum:
            - true
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AdminsActivityItem'
          description: This admin's entries (logins included), newest first by createdAt only.
        total:
          type: integer
          description: All entries by this admin.
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
          description: page * limit < total.
        summary:
          type: object
          required:
            - lastLogin
            - lastActionAt
            - last7d
            - last30d
            - sensitive30d
            - logins30d
            - byAction30d
          properties:
            lastLogin:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            lastActionAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
              description: Latest non-login entry ever.
            last7d:
              type: integer
              description: Non-login entries in the last 7 days.
            last30d:
              type: integer
              description: Non-login entries in the last 30 days.
            sensitive30d:
              type: integer
              description: Sensitive entries in the last 30 days.
            logins30d:
              type: integer
              description: admin_login entries in the last 30 days.
            byAction30d:
              type: array
              items:
                $ref: '#/components/schemas/AdminsActivityByAction'
              description: Non-login actions in the last 30 days, most frequent first.
    AdminsSession:
      type: object
      required:
        - _id
        - device
        - os
        - location
        - ipAddress
        - lastAccess
        - isCurrent
        - userAgent
      properties:
        _id:
          type: string
          description: The sessions-collection _id (connect-mongo stores the raw session id here).
        device:
          type: string
          description: >-
            Derived from the user agent, e.g. "Chrome on Windows", "Mobile App on Android", "Web Browser on Desktop" (no
            UA recorded).
        os:
          type: string
          description: e.g. Windows, MacOS, Linux, Android, iOS, Mobile, Desktop, Unknown.
        location:
          type: string
          description: session.location (geoip at sign-in), else the IP, else "Unknown".
        ipAddress:
          type: string
          description: session.ipAddress, or "Unknown".
        lastAccess:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: >-
            Actually the session store's `expires` (≈ sign-in + 24 h with touchAfter 24 h), or now when missing — not a
            last-activity time.
        isCurrent:
          type: boolean
          description: true when this is the caller's own session (session.sessionId === req.sessionID).
        userAgent:
          type: string
          description: session.userAgent, or "Unknown".
    AdminsSessionsResponse:
      type: object
      required:
        - success
        - sessions
      properties:
        success:
          type: boolean
          enum:
            - true
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AdminsSession'
    AdminsCreateRequest:
      type: object
      required:
        - name
        - email
        - password
        - phone
        - location
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed by the schema.
        email:
          type: string
          minLength: 1
          description: Lower-cased and trimmed by the schema; must be unique across ALL users (409). No format check.
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Stored as a bcrypt hash (10 rounds). No length/strength rule.
        phone:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        userType:
          allOf:
            - $ref: '#/components/schemas/AdminsUserTypeInput'
          default: admin
        accountStatus:
          allOf:
            - $ref: '#/components/schemas/AdminsAccountStatus'
          default: active
          description: >-
            Effectively only "active" works: any other status needs restrictionDetails.type/reason (and suspendedUntil
            for suspended), which create does not set, so save fails validation → 400.
        permissions:
          allOf:
            - $ref: '#/components/schemas/AdminsPermissions'
          description: >-
            Omitted → every key false. A PARTIAL object gets the schema defaults for the missing keys (true, except
            settings false).
    AdminsCreateResponse:
      type: object
      required:
        - success
        - message
        - admin
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          enum:
            - Admin created successfully
        admin:
          type: object
          required:
            - _id
            - uid
            - name
            - email
            - userType
            - permissions
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            uid:
              type: string
              pattern: ^KYD-[0-9A-F]{6}$
            name:
              type: string
            email:
              type: string
            userType:
              $ref: '#/components/schemas/AdminsUserTypeInput'
            permissions:
              $ref: '#/components/schemas/AdminsPermissions'
    AdminsUpdateRequest:
      type: object
      required:
        - name
        - email
        - phone
        - location
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
          description: If different from the current email, must not belong to any other user (409).
        phone:
          type: string
          minLength: 1
        location:
          type: string
          minLength: 1
        userType:
          allOf:
            - $ref: '#/components/schemas/AdminsUserTypeInput'
          description: Omitted/empty keeps the current role.
        accountStatus:
          allOf:
            - $ref: '#/components/schemas/AdminsAccountStatus'
          description: >-
            Omitted/empty keeps the current status. Changing to a non-active status writes restrictionDetails {type,
            reason "Admin access turned off by <name>", restrictedBy, restrictedAt, appealAllowed:false, and for
            suspended suspendedUntil = max Date (open-ended)}; changing to active clears restrictionDetails.
        permissions:
          allOf:
            - $ref: '#/components/schemas/AdminsPermissions'
          description: When present, REPLACES the whole permissions map (omitted keys are not kept).
        newPassword:
          type: string
          writeOnly: true
          description: Non-blank (after trim) → bcrypt-hashed and set as the password. Blank/omitted leaves it unchanged.
    AdminsUpdateResponse:
      type: object
      required:
        - success
        - message
        - admin
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          enum:
            - Admin updated successfully
        admin:
          type: object
          required:
            - _id
            - name
            - email
            - phone
            - userType
            - location
            - accountStatus
            - permissions
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            userType:
              $ref: '#/components/schemas/AdminsUserTypeInput'
            location:
              type: string
            accountStatus:
              $ref: '#/components/schemas/AdminsAccountStatus'
            permissions:
              $ref: '#/components/schemas/AdminsPermissions'
    AdminsPermissionsUpdateRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          allOf:
            - $ref: '#/components/schemas/AdminsPermissions'
          description: Replaces the whole permissions map (omitted keys are not kept). Any truthy value passes the presence check.
    AdminsPermissionsUpdateResponse:
      type: object
      required:
        - success
        - message
        - admin
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          enum:
            - Permissions updated successfully
        admin:
          type: object
          required:
            - _id
            - permissions
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            permissions:
              $ref: '#/components/schemas/AdminsPermissions'
    AuthLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: >-
            The admin account EMAIL (the field is named `username` but is matched with `User.findOne({ email: username
            })`). Matched exactly: emails are stored lowercased and trimmed, but this value is not normalised, so
            `Admin@x.com` or a value with surrounding spaces does not match. Missing → no account matches → 401.
          format: email
          example: admin@example.com
        password:
          type: string
          description: >-
            Plain-text password, compared with bcrypt against the stored hash. Missing/non-string while `username`
            matches an admin → bcrypt throws `Illegal arguments` → 500.
          format: password
    AuthLoginUser:
      type: object
      required:
        - id
        - username
        - name
        - email
        - role
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: User `_id` of the admin account.
        username:
          type: string
          description: Same value as `email` (the account email).
        name:
          type: string
          description: Account display name.
        email:
          type: string
          description: Account email.
        role:
          type: string
          description: '`User.userType` of the account.'
          enum:
            - admin
            - superadmin
    AuthLoginResponse:
      type: object
      required:
        - success
        - message
        - user
      properties:
        success:
          type: boolean
          description: Always true.
          enum:
            - true
        message:
          type: string
          description: Always `Login successful`.
          enum:
            - Login successful
        user:
          $ref: '#/components/schemas/AuthLoginUser'
    AuthLogoutResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          description: Always true.
          enum:
            - true
        message:
          type: string
          description: Always `Logged out successfully`.
          enum:
            - Logged out successfully
    AuthPermissions:
      type: object
      description: >-
        Per-page UI permission flags, exactly these nine booleans. Source: the account's `User.permissions` nested path;
        because every key has a schema default and the path is selected, Mongoose fills any key missing in the stored
        document (dashboard/users/jobs/transactions/verifications/support/activity/flagged default true, settings
        default false), so an existing account always yields all nine keys; unknown keys are stripped on write by the
        strict schema. The controller's literal fallback object (same values, `settings: userType === "superadmin"`) is
        used only when the session's account no longer exists, and then `settings` is always false (there is no user to
        be a superadmin). Note a superadmin with no stored `settings` key therefore gets `settings: false`. These flags
        only drive the admin frontend's navigation (which ignores them for role superadmin); no backend route enforces
        them.
      required:
        - dashboard
        - users
        - jobs
        - transactions
        - verifications
        - support
        - activity
        - flagged
        - settings
      properties:
        dashboard:
          type: boolean
          description: Dashboard page. Schema default true.
          default: true
        users:
          type: boolean
          description: Users pages. Schema default true.
          default: true
        jobs:
          type: boolean
          description: Jobs pages. Schema default true.
          default: true
        transactions:
          type: boolean
          description: Transactions pages (fee records, top-up, cashout, refund). Schema default true.
          default: true
        verifications:
          type: boolean
          description: Verifications page. Schema default true.
          default: true
        support:
          type: boolean
          description: Support page. Schema default true.
          default: true
        activity:
          type: boolean
          description: Audit Log page (also superadmin-only on the server). Schema default true.
          default: true
        flagged:
          type: boolean
          description: Flagged page. Schema default true.
          default: true
        settings:
          type: boolean
          description: Settings pages. Schema default false.
          default: false
    AuthCheckUser:
      type: object
      required:
        - role
        - adminId
        - userId
      properties:
        username:
          type: string
          description: '`req.session.username` — the account email captured at sign-in (not refreshed if the email later changes).'
        name:
          type: string
          description: Current `User.name`. Absent when the account no longer exists or the lookup failed.
        email:
          type: string
          description: Current `User.email`. Absent when the account no longer exists or the lookup failed.
        role:
          type: string
          description: >-
            Account role. Refreshed from the current `User.userType` (and written back to the session) when the account
            is found; otherwise the role cached at sign-in.
          enum:
            - admin
            - superadmin
        adminId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: '`req.session.adminId` (string form of the account `_id`).'
        userId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: '`req.session.userId`; back-filled from `adminId` (and saved to the session) if it was missing.'
        permissions:
          allOf:
            - $ref: '#/components/schemas/AuthPermissions'
          description: Always present on the normal path; absent only when the account lookup threw (degraded response).
    AuthCheckAuthenticated:
      type: object
      required:
        - success
        - isAuthenticated
        - user
      properties:
        success:
          type: boolean
          description: Always true.
          enum:
            - true
        isAuthenticated:
          type: boolean
          description: Always true.
          enum:
            - true
        user:
          $ref: '#/components/schemas/AuthCheckUser'
    AuthCheckUnauthenticated:
      type: object
      required:
        - success
        - isAuthenticated
      properties:
        success:
          type: boolean
          description: Always false.
          enum:
            - false
        isAuthenticated:
          type: boolean
          description: Always false.
          enum:
            - false
    AuthCheckResponse:
      description: 'Either the signed-in admin (with permissions) or `{ success: false, isAuthenticated: false }`. Always HTTP 200.'
      oneOf:
        - $ref: '#/components/schemas/AuthCheckAuthenticated'
        - $ref: '#/components/schemas/AuthCheckUnauthenticated'
    SystemHealth:
      type: object
      required:
        - status
        - timestamp
        - uptime
        - mongodb
      properties:
        status:
          type: string
          description: Always `OK` (the handler reports OK even when MongoDB is disconnected).
          enum:
            - OK
        timestamp:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Server time when the response was built.
        uptime:
          type: number
          description: Node process uptime in seconds (`process.uptime()`, fractional).
        mongodb:
          type: string
          description: >-
            `connected` when `mongoose.connection.readyState === 1`; any other state (disconnected, connecting,
            disconnecting) reports `disconnected`.
          enum:
            - connected
            - disconnected
    SystemDebugRequestUser:
      type: object
      description: '`req.user` as built by adminAuth.'
      required:
        - id
        - role
      properties:
        id:
          type: string
          description: '`session.userId || session.adminId || "admin"` — normally the account ObjectId as a string.'
        username:
          type: string
          description: '`session.username` — the account email captured at sign-in.'
        role:
          type: string
          description: Current account role (adminAuth refreshes it from the database).
          enum:
            - admin
            - superadmin
        email:
          type: string
          description: '`session.email`. Login never sets this key, so in practice it is always absent from the JSON.'
    SystemDebugSessionData:
      type: object
      description: Selected keys of `req.session`. Keys whose value is undefined are omitted from the JSON.
      properties:
        isAuthenticated:
          type: boolean
          description: Set true at login.
        userId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Account id (string).
        adminId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Account id (string).
        username:
          type: string
          description: Account email captured at sign-in.
        role:
          type: string
          description: Account role (refreshed by adminAuth on this request).
          enum:
            - admin
            - superadmin
        email:
          type: string
          description: Never set by login; in practice always absent.
    SystemDebugSession:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/SystemDebugRequestUser'
        session:
          $ref: '#/components/schemas/SystemDebugSessionData'
    DashboardStats:
      type: object
      required:
        - totalUsers
        - customers
        - providers
        - totalJobs
        - activeJobs
        - totalRevenue
        - pendingFees
        - pendingFeesCount
        - onlineUsers
        - newUsersToday
        - newProvidersToday
        - jobsCreatedToday
        - completedJobsToday
        - revenueToday
        - verifiedProviders
        - pendingVerifications
        - averageRating
      properties:
        totalUsers:
          type: integer
          description: All documents in `users` (every userType, including admins and deleted accounts).
        customers:
          type: integer
          description: 'Users with `userType: client`.'
        providers:
          type: integer
          description: 'Users with `userType: provider`.'
        totalJobs:
          type: integer
          description: All jobs (including deleted/hidden).
        activeJobs:
          type: integer
          description: Jobs with status `open` or `in_progress` (`scheduled` is not counted).
        totalRevenue:
          type: number
          description: 'Sum of `amount` over Transactions with `type: platform_fee` and `status: completed` (PHP).'
        pendingFees:
          type: number
          description: Sum of `FeeRecord.amount` with status `pending` or `overdue` (PHP).
        pendingFeesCount:
          type: integer
          description: Number of FeeRecords with status `pending` or `overdue`.
        onlineUsers:
          type: integer
          description: 'Users with `isOnline: true`.'
        newUsersToday:
          type: integer
          description: 'Clients (`userType: client`) created since server-local midnight.'
        newProvidersToday:
          type: integer
          description: Providers created since server-local midnight.
        jobsCreatedToday:
          type: integer
          description: Jobs created since server-local midnight.
        completedJobsToday:
          type: integer
          description: >-
            Jobs with `status: completed` and a top-level `completedAt` since server-local midnight. The admin Job
            schema does not declare a top-level `completedAt` (it declares `completionStatus.completedAt`); the filter
            is passed through raw, so only jobs whose stored document carries that top-level field are counted.
        revenueToday:
          type: number
          description: Sum of completed `platform_fee` Transaction amounts with `completedAt` since server-local midnight (PHP).
        verifiedProviders:
          type: integer
          description: 'Distinct `userId`s that have at least one CredentialVerification with `status: approved` (any user type).'
        pendingVerifications:
          type: integer
          description: >-
            CredentialVerifications with `status: pending` only. The schema default status is `under_review`, which is
            NOT counted.
        averageRating:
          type: string
          description: >-
            Average of `rating.stars` over completed jobs, formatted with `toFixed(1)` — a STRING. `rating` is not
            declared on the admin Job schema, so on the hydrated documents `job.rating` is always undefined and this
            value is always `"0.0"`.
          pattern: ^\d+\.\d$
          example: '0.0'
    DashboardComparisonMetric:
      type: object
      required:
        - current
        - previous
        - percentage
      properties:
        current:
          type: number
          description: Current value.
        previous:
          type: number
          description: Comparison value for last calendar month (see operation description).
        percentage:
          type: integer
          description: >-
            `Math.round((current - previous) / previous * 100)`; when `previous` is 0 it is 100 if `current > 0`, else
            0. Can be negative.
    DashboardComparisonMetricNoPrevious:
      type: object
      description: Like DashboardComparisonMetric but the previous value is computed internally and not returned.
      required:
        - current
        - percentage
      properties:
        current:
          type: integer
          description: Current count.
        percentage:
          type: integer
          description: Rounded % change versus the (unreturned) previous value; 100/0 rule when previous is 0. Can be negative.
    DashboardStatsComparison:
      type: object
      required:
        - users
        - jobs
        - revenue
        - pendingFees
        - alerts
      properties:
        users:
          allOf:
            - $ref: '#/components/schemas/DashboardComparisonMetric'
          description: '`current` = all users now; `previous` = users created on or before the end of last month.'
        jobs:
          allOf:
            - $ref: '#/components/schemas/DashboardComparisonMetric'
          description: '`current` = all jobs now; `previous` = jobs created on or before the end of last month.'
        revenue:
          allOf:
            - $ref: '#/components/schemas/DashboardComparisonMetric'
          description: >-
            Sum of completed `platform_fee` Transaction amounts this calendar month vs last calendar month, bucketed by
            `completedAt` (or `createdAt` when `completedAt` is null).
        pendingFees:
          allOf:
            - $ref: '#/components/schemas/DashboardComparisonMetricNoPrevious'
          description: >-
            `current` = COUNT (not amount) of FeeRecords with status pending/overdue. Previous is estimated as `current
            − (pending/overdue created this month) + (non-pending/overdue records whose updatedAt is this month)`; any
            later edit to a settled record therefore counts as "resolved this month".
        alerts:
          allOf:
            - $ref: '#/components/schemas/DashboardComparisonMetricNoPrevious'
          description: >-
            `current` = stored Alert documents with `isActive: true`; previous = those created on or before the end of
            last month. Synthesised alerts shown by GET /alerts are not counted, so this can be 0 while the alert list
            is non-empty.
    DashboardActivityUserRef:
      type: object
      description: User populated with `name email` (lean, so no virtuals).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: User name.
        email:
          type: string
          description: User email.
    DashboardActivityJobRef:
      type: object
      description: Job populated with `title` (lean).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          description: Job title.
    DashboardActivityItem:
      type: object
      required:
        - _id
        - type
        - description
        - timestamp
      properties:
        _id:
          type: string
          description: >-
            ObjectId (24-hex) for a stored ActivityFeed row; for synthesised items a prefixed id: `user_<userId>`,
            `job_<jobId>` or `transaction_<transactionId>`.
        type:
          type: string
          description: Activity type.
          enum:
            - user_registered
            - user_login
            - job_posted
            - job_applied
            - job_completed
            - payment_completed
            - fee_paid
        description:
          type: string
          description: 'Human-readable line, e.g. `Jane registered on the platform`, `New job posted: "Fix sink"`.'
        userId:
          allOf:
            - $ref: '#/components/schemas/DashboardActivityUserRef'
          description: >-
            Populated actor. null when the referenced user no longer exists, and ALWAYS null on synthesised job items
            (see operation). May be absent on stored rows that have no userId.
          nullable: true
        jobId:
          allOf:
            - $ref: '#/components/schemas/DashboardActivityJobRef'
          description: Populated job. null when the referenced job no longer exists; absent when the row has none.
          nullable: true
        transactionId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Unpopulated Transaction id, when present.
        metadata:
          type: object
          description: 'Free-form (Mixed). Synthesised items carry `{ generatedFromData: true }`.'
          properties:
            generatedFromData:
              type: boolean
              description: Present (true) only on synthesised items.
        timestamp:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: 'Stored rows: copy of `createdAt`. Synthesised: the user/job createdAt or transaction completedAt/createdAt.'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Stored rows only.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Stored rows only.
        __v:
          type: integer
          description: Stored rows only (Mongoose version key).
    DashboardPopulatedUserRef:
      type: object
      description: >-
        Hydrated User populated with `name email`. Serialised with the User schema's toJSON virtuals, so it also carries
        `id` and `isCurrentlyRestricted` — the latter is computed from `accountStatus`, which is not selected, and is
        therefore always true.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: User name.
        email:
          type: string
          description: User email.
        id:
          type: string
          description: 'Virtual: string form of `_id`.'
        isCurrentlyRestricted:
          type: boolean
          description: Virtual; always true here because accountStatus is not selected (meaningless).
    DashboardPopulatedJobRef:
      type: object
      description: Hydrated Job populated with `title` (toJSON virtuals add `id`).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          description: Job title.
        id:
          type: string
          description: 'Virtual: string form of `_id`.'
    DashboardReportedPostJobDetails:
      type: object
      description: Snapshot of the job taken when the report was filed.
      properties:
        title:
          type: string
          description: Job title.
        description:
          type: string
          description: Job description.
        category:
          type: string
          description: Category.
        icon:
          type: string
          description: Icon key/URL.
        media:
          type: array
          items:
            type: string
        video:
          type: object
