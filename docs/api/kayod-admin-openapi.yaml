      properties:
        adminId:
          type: string
          description: The caller's admin id.
        count:
          type: integer
        dismissed:
          type: array
          items:
            $ref: '#/components/schemas/AdminMiscDismissedAlert'
    AdminMiscAllDismissedAlerts:
      type: object
      required:
        - count
