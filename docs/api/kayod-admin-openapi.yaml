  /api/admin/alerts/cleanup:
    post:
      operationId: cleanupOldAlertFields
      tags:
        - Admin
      summary: Intended to strip the legacy dismissedBy field from alerts
      description: >-
        Runs Alert.updateMany({dismissedBy: {$exists: true}}, {$unset: {dismissedBy: ""}}). Because `dismissedBy` is not
        declared on the Alert schema, Mongoose strict mode removes the $unset and only the timestamps $set of updatedAt
        remains: matching alerts get updatedAt bumped and keep their dismissedBy, so `modifiedCount` reports the number
        of legacy alerts every time it is called. No body, no audit-log row, no socket emit. Errors are a 500 "Failed to
        cleanup old alert fields". Access: adminAuth (session role admin/superadmin and the account must still be active
        with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session is destroyed; no admin
        session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMiscAlertCleanupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/alerts/reset:
    post:
      operationId: resetAlerts
      tags:
        - Admin
      summary: Un-dismiss every alert for EVERY admin
      description: >-
        Deletes all DismissedAlert documents (all admins, not just the caller) and runs Alert.updateMany({}, {$unset:
        {dismissedBy: ""}}). `dismissedBy` is not in the Alert schema, so Mongoose strict mode strips the $unset; with
        timestamps on, the statement only bumps updatedAt on every Alert. No body, no audit-log row, no socket emit.
        Errors are a 500 "Failed to reset alerts". Access: adminAuth (session role admin/superadmin and the account must
        still be active with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session is destroyed;
