  /api/admin/configurations/professions/{professionId}/transfer:
    patch:
      tags:
        - Configurations
      operationId: transferProfessionAdminMount
      summary: Move a profession to another category
      description: >-
        Validates: targetCategoryId present (400 "Target category ID is required"); source category containing the
        profession exists (404 "Profession not found"); target differs from the source (400 "Profession is already in
        this category"); target exists (404 "Target category not found"); no case-insensitive name clash in the target
        (400 `A profession named "<name>" already exists in "<target>"`). Copies name, icon, isQuickAccess,
        quickAccessOrder and createdAt into a NEW subdocument in the target (new _id — the old professionId stops
        existing; the serviceClass override is NOT copied, so it reverts to inherit), saves the target, then pulls it
        from the source and saves (two separate writes, no transaction). Then best-effort `Job.updateMany` and raw
        `drafts.updateMany` re-point documents with this professionName and jobCategory = source to the target category
        (failures only logged). Writes an ActivityLog audit row `profession_transferred` (targetId = target category,
        changes.category from/to) (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room).
        Auth: adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an
        admin account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.


        Same handler as `PATCH /api/configurations/professions/{professionId}/transfer` (second mount of the
        configurations router; the admin panel uses this one).
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: professionId
          in: path
          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetCategoryId
              properties:
                targetCategoryId:
                  allOf:
                    - $ref: '#/components/schemas/ObjectId'
                  description: Required. Destination JobCategory _id.
      responses:
        '200':
          description: Transferred.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - profession
                  - sourceCategoryId
                  - targetCategoryId
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Profession "Plumber" transferred to "Home Repair" successfully
                  profession:
                    $ref: '#/components/schemas/ConfigProfession'
                  sourceCategoryId:
                    $ref: '#/components/schemas/ObjectId'
                  targetCategoryId:
                    $ref: '#/components/schemas/ObjectId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/configurations/quick-access-professions:
    post:
      tags:
        - Configurations
      operationId: updateQuickAccessProfessionsAdminMount
      summary: Replace the quick-access profession row (max 8, ordered)
      description: >-
        Validates `professions` is an array (400 "Professions must be an array") of at most 8 entries (400 "Maximum 8
        quick access professions allowed"). Loads EVERY category, resets every profession to isQuickAccess=false /
        quickAccessOrder=0, then marks each profession whose _id matches an entry as quick access with quickAccessOrder
        = array index + 1, and saves every category that has professions (full validation; one write per category, no
        transaction). Unknown professionIds are silently ignored; an empty array clears the row. Re-reads to count the
        result. Writes an ActivityLog audit row `quick_access_updated` with the before/after ordered name lists, only if
        the row changed (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room). Auth:
        adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an admin
        account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.


        Same handler as `POST /api/configurations/quick-access-professions` (second mount of the configurations router;
        the admin panel uses this one).
      security:
