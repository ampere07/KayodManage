        description:
          type: string
        profession:
          $ref: '#/components/schemas/ObjectId'
        professionName:
          type: string
          nullable: true
        categoryId:
          $ref: '#/components/schemas/ObjectId'
        categoryName:
          type: string
        category:
          type: string
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
        paymentReleaseHours:
          type: number
        icon:
          type: string
        media:
          type: array
          items:
            type: string
        video:
          type: string
          nullable: true
        location:
          description: Mixed (string or location object, as written by the Kayod server).
        locationDetails:
          type: string
        date:
          $ref: '#/components/schemas/DateTime'
        selectedDates:
          type: array
          items:
            $ref: '#/components/schemas/DateTime'
        timeWindows:
          type: array
          items:
            type: string
        dateDetails:
