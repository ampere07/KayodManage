        isActive:
          type: boolean
        raisedBy:
          type: string
          enum:
            - client
            - provider
            - null
          nullable: true
        raisedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        reason:
          type: string
          nullable: true
        claims:
          type: array
          items:
            $ref: '#/components/schemas/JobsDisputeClaim'
        resolvedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        resolvedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        resolution:
          type: string
          enum:
            - provider_paid
            - client_refunded
            - rebook
            - no_show_payout
            - null
          nullable: true
        finding:
          $ref: '#/components/schemas/JobsDisputeFinding'
        escalatedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        internalNotes:
          type: array
          items:
            $ref: '#/components/schemas/JobsInternalNote'
    JobsDisputeHistoryEntry:
      type: object
      description: >-
        An archived, resolved dispute. resolve-dispute writes claims + finding; force-cancel writes neither (resolution
        `client_refunded`).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        raisedBy:
          type: string
          enum:
            - client
            - provider
        raisedAt:
          $ref: '#/components/schemas/DateTime'
        reason:
          type: string
        claims:
          type: array
          items:
            $ref: '#/components/schemas/JobsDisputeClaim'
        finding:
          type: object
          properties:
            faultParty:
              type: string
              enum:
                - client
                - provider
                - both
                - none
                - uncertain
            findingReason:
              type: string
              enum:
                - no_show
                - late_cancel
                - access_failure
                - emergency
                - other
            notes:
              type: string
              nullable: true
        resolvedAt:
          $ref: '#/components/schemas/DateTime'
        resolvedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        resolution:
          type: string
          enum:
            - provider_paid
            - client_refunded
            - rebook
            - no_show_payout
    JobsRebook:
      type: object
      description: Set when a dispute is resolved as `rebook`. The escrow hold is suspended until the reporter answers the verdict.
      properties:
        orderedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        orderedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        deadlineAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: Redo deadline.
        escalatedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: Set by kayod/server once the missed-deadline escalation fired.
        reporterRole:
          type: string
          enum:
            - client
            - provider
            - null
          nullable: true
          description: The side that raised the dispute; the only side allowed to answer the verdict.
        verdict:
          type: object
          properties:
            askedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            respondedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            satisfied:
              type: boolean
              description: null = unanswered
              nullable: true
            reason:
              type: string
              nullable: true
    JobsNoShowReview:
      type: object
      description: Owned by kayod/server (NoShowReviewService); never written here.
      properties:
        openedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        autoResolveAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        reminderSentAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        resolvedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        outcome:
          type: string
          enum:
            - refunded_unclaimed
            - issue_raised
            - null
          nullable: true
    JobsCompletionStatus:
      type: object
      properties:
        clientConfirmed:
          type: boolean
        providerConfirmed:
          type: boolean
        paymentReleased:
          type: boolean
        providerConfirmedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        clientConfirmedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        paymentReleasedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        completedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        noShowReview:
          $ref: '#/components/schemas/JobsNoShowReview'
        neitherConfirmedReminderSentAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        dispute:
          $ref: '#/components/schemas/JobsDispute'
        disputeHistory:
          type: array
          items:
            $ref: '#/components/schemas/JobsDisputeHistoryEntry'
        rebook:
          $ref: '#/components/schemas/JobsRebook'
    JobsCancellation:
      type: object
      properties:
        cancelledAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        cancelledBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Admin user id for admin cancellations; null when the session id is not an ObjectId.
        reason:
          type: string
          nullable: true
        feeApplied:
          type: number
          description: 0 for force-cancel / refund_client; the provider payout for no_show_payout.
          nullable: true
        noShowLapse:
          type: boolean
        lapsedClientId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        lapsedProviderId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
    JobsJobDocument:
      type: object
      description: >-
        A raw `.lean()` Job document (collection `jobs`, shared with kayod/server). Virtuals are not included and schema
        defaults are not applied to fields missing from the stored document. `userId`/`assignedToId` are described by
        the endpoint-specific schemas that extend this one.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        profession:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Legacy; real jobs normally lack it.
        professionName:
          type: string
          nullable: true
        categoryId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Legacy JobCategory ref; real jobs normally lack it.
        categoryName:
          type: string
        category:
          type: string
          description: The category string kayod/server actually writes.
        serviceClass:
          type: string
          description: Snapshotted payment-release class.
          enum:
            - standard
            - immediate
        paymentReleaseHours:
          type: number
          description: Snapshotted escrow hold length (standard 120, immediate 0).
          minimum: 0
        icon:
          type: string
        media:
          type: array
          items:
            type: string
          description: Media URLs.
        video:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/JobsLocation'
        locationDetails:
          type: string
        date:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        selectedDates:
          type: array
          items:
            $ref: '#/components/schemas/DateTime'
        timeWindows:
          type: array
          items:
            type: string
        dateDetails:
          description: Mixed (written by kayod/server); may be null.
        paymentMethod:
          type: string
          enum:
            - wallet
            - xendit
        status:
          type: string
          enum:
            - open
            - in_progress
            - scheduled
            - completed
            - cancelled
            - expired
        softLimitBudget:
          type: number
        budget:
          type: number
          description: 0 for quoted jobs.
        budgetType:
          type: string
          enum:
            - fixed
            - flexible
        paymentDetails:
          $ref: '#/components/schemas/JobsPaymentDetails'
        paymentStatus:
          type: string
          enum:
            - pending
            - escrow_required
            - escrow_held
            - paid
            - refunded
            - failed
        escrowAmount:
          type: number
        paidAmount:
          type: number
        draftId:
          type: string
          nullable: true
        completionStatus:
          $ref: '#/components/schemas/JobsCompletionStatus'
        cancellation:
          $ref: '#/components/schemas/JobsCancellation'
        escrowReleaseAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        escrowStatus:
          type: string
          enum:
            - none
            - pending
            - releasing
            - released
            - refunded
            - failed
        escrowScheduledAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        acceptedProvider:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        agreedPrice:
          type: number
          nullable: true
        hasNewQuotes:
          type: boolean
        lastQuoteAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        startNavigation:
          description: 'Tri-state written by kayod/server: false (idle), true (en route) or the string "arrived".'
          oneOf:
            - type: boolean
            - type: string
              enum:
                - arrived
        navigationStartedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        isDeleted:
          type: boolean
        deletedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        deletionReason:
          type: string
          nullable: true
        isHidden:
          type: boolean
        hiddenAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        hiddenBy:
          type: string
          nullable: true
          description: Admin display name (not an id).
        deletedBy:
          type: string
          nullable: true
          description: Admin display name (not an id).
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    JobsJobPopulated:
      description: Job document with `userId` and `assignedToId` populated (`name email userType profileImage`).
      allOf:
        - $ref: '#/components/schemas/JobsJobDocument'
        - type: object
          properties:
            userId:
              allOf:
                - $ref: '#/components/schemas/JobsUserBrief'
              nullable: true
              description: Job owner (client); null if the account no longer exists.
            assignedToId:
              allOf:
                - $ref: '#/components/schemas/JobsUserBrief'
              nullable: true
              description: Assigned provider, or null.
    JobsJobMutationResult:
      description: >-
        Shape returned by status/assign/hide/unhide: the populated job plus `user`/`assignedTo` aliases (same objects as
        `userId`/`assignedToId`), `applicationCount` and `locationDisplay`. `icon` is NOT cleaned here.
      allOf:
        - $ref: '#/components/schemas/JobsJobPopulated'
        - type: object
          required:
            - applicationCount
            - locationDisplay
          properties:
            user:
              allOf:
                - $ref: '#/components/schemas/JobsUserBrief'
              nullable: true
              description: Alias of `userId`.
            assignedTo:
              allOf:
                - $ref: '#/components/schemas/JobsUserBrief'
              nullable: true
              description: Alias of `assignedToId`.
            applicationCount:
              type: integer
              description: Applications for this job (all statuses).
            locationDisplay:
              type: string
              description: '`location.address` || `location.city` || the location string || ''Location not specified''.'
    JobsJobListItem:
      description: >-
        A job row in the list. `userId`/`assignedToId` are populated (`name email phone phoneNumber userType
        profileImage`) and aliased as `user`/`assignedTo`; `icon` has its `ik:` random suffix stripped (`name_xxxx.webp`
        → `name.webp`).
      allOf:
        - $ref: '#/components/schemas/JobsJobDocument'
        - type: object
          required:
            - applicationCount
            - locationDisplay
          properties:
            userId:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
            assignedToId:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
            user:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
              description: Alias of `userId`.
            assignedTo:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
              description: Alias of `assignedToId`.
            applicationCount:
              type: integer
              description: Applications for this job (all statuses).
            locationDisplay:
              type: string
              description: '`location.address` || `location.city` || the location string || ''Location not specified''.'
    JobsApplicationProvider:
      type: object
      description: Populated provider (`'name email phone'`).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    JobsApplication:
      type: object
      description: A raw `.lean()` Application document (collection `applications`).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        job:
          $ref: '#/components/schemas/ObjectId'
        provider:
          allOf:
            - $ref: '#/components/schemas/JobsApplicationProvider'
          nullable: true
          description: null if the provider account no longer exists.
        quote:
          type: number
          minimum: 0
        coverLetter:
          type: string
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - cancelled
        appliedAt:
          $ref: '#/components/schemas/DateTime'
        statusHistory:
          type: array
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              status:
                type: string
                enum:
                  - pending
                  - accepted
                  - rejected
                  - cancelled
              changedAt:
                $ref: '#/components/schemas/DateTime'
              changedBy:
                $ref: '#/components/schemas/ObjectId'
              reason:
                type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    JobsJobDetail:
      description: >-
        Full job for the detail view. `icon` has its `ik:` random suffix stripped. The owner is populated with the wider
        profile select; applications are attached newest-first. No chat thread, Transaction or EscrowRelease is looked
        up — escrow state is only what the job document itself carries (`escrowAmount`, `escrowStatus`,
        `escrowReleaseAt`, `escrowScheduledAt`, `paymentDetails.heldTransaction` as a bare id, `completionStatus.*`).
      allOf:
        - $ref: '#/components/schemas/JobsJobDocument'
        - type: object
          required:
            - applications
            - applicationCount
            - locationDisplay
          properties:
            userId:
              allOf:
                - $ref: '#/components/schemas/JobsUserProfile'
              nullable: true
            assignedToId:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
            user:
              allOf:
                - $ref: '#/components/schemas/JobsUserProfile'
              nullable: true
              description: Alias of `userId`.
            assignedTo:
              allOf:
                - $ref: '#/components/schemas/JobsUserContact'
              nullable: true
              description: Alias of `assignedToId`.
            applications:
              type: array
              items:
                $ref: '#/components/schemas/JobsApplication'
              description: All applications for the job, sorted by appliedAt descending.
            applicationCount:
              type: integer
              description: '`applications.length`.'
            locationDisplay:
              type: string
              description: '`location.address` || `location.city` || the location string || ''Location not specified''.'
    JobsJobListResponse:
      type: object
      required:
        - jobs
        - pagination
        - stats
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobsJobListItem'
        pagination:
          type: object
          required:
            - page
            - limit
            - total
            - pages
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              description: Jobs matching the filters.
            pages:
              type: integer
              description: ceil(total / limit).
        stats:
          type: object
          required:
            - totalValue
          properties:
            totalValue:
              type: number
              description: >-
                Sum of `budget` over ALL jobs in the collection — ignores every filter, includes hidden/deleted jobs,
                and counts quoted jobs (budget 0) as 0.
    JobsJobStats:
      type: object
      description: Collection-wide counts (hidden and deleted jobs included).
      required:
        - totalJobs
        - openJobs
        - inProgressJobs
        - completedJobs
        - cancelledJobs
        - totalApplications
        - pendingApplications
      properties:
        totalJobs:
          type: integer
        openJobs:
          type: integer
        inProgressJobs:
          type: integer
        completedJobs:
          type: integer
        cancelledJobs:
          type: integer
        totalApplications:
          type: integer
        pendingApplications:
          type: integer
    JobsUpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: '`cancelled` is rejected — use force-cancel.'
          enum:
            - open
            - in_progress
            - completed
    JobsForceCancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: >-
            Stored as `cancellation.reason` (default 'Cancelled by admin') and on the refund transaction's metadata. Not
            trimmed or length-limited.
    JobsForceCancelResponse:
      type: object
      required:
        - success
        - job
        - refundedAmount
      properties:
        success:
          type: boolean
          enum:
            - true
        job:
          $ref: '#/components/schemas/JobsJobPopulated'
        refundedAmount:
          type: number
          description: Amount returned to the client wallet; 0 when there was no `held` escrow transaction.
    JobsResolveDisputeRequest:
      type: object
      required:
        - outcome
      properties:
        outcome:
          type: string
          description: >-
            Where the money goes. Mapped to `completionStatus.dispute.resolution`: pay_provider→provider_paid,
            refund_client→client_refunded, rebook→rebook, no_show_payout→no_show_payout.
          enum:
            - pay_provider
            - refund_client
            - rebook
            - no_show_payout
        note:
          type: string
          description: >-
            Optional admin note. Used in notification copy, refund/payout transaction metadata, the cancellation reason
            (refund_client / no_show_payout) and the escrow suspension reason (rebook). Not trimmed or length-limited.
        rebookDeadlineAt:
          type: string
          description: >-
            REQUIRED when outcome is `rebook` (400 if missing). Anything `new Date()` parses is accepted (ISO date-time
            recommended); it must be in the future (no upper bound). Ignored for other outcomes.
        faultParty:
          type: string
          description: >-
            Who the admin found at fault. Any other/missing value is silently normalised to `uncertain` (records
            nothing, sanctions nobody).
          enum:
            - client
            - provider
            - both
            - none
            - uncertain
        findingReason:
          type: string
          description: >-
            What happened. Any other/missing value is silently normalised to `other`. Only no_show, late_cancel and
            access_failure (with a named party) are sanctionable.
          enum:
            - no_show
            - late_cancel
            - access_failure
            - emergency
            - other
        findingNotes:
          type: string
          description: Admin rationale for the finding; trimmed, empty → null.
    JobsResolveDisputeEscrow:
      type: object
      description: The EscrowRelease the ruling resumed or scheduled (pay_provider, no_show_payout).
      required:
        - scheduledFor
        - releasedImmediately
        - resumed
      properties:
        scheduledFor:
          $ref: '#/components/schemas/DateTime'
        originalScheduledFor:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: >-
            The paused hold's original release date when an existing hold was resumed; null when a new hold was
            scheduled.
        releasedImmediately:
          type: boolean
          description: True when the resumed hold's original date had already passed, so it was made due now.
        resumed:
          type: boolean
          description: True when an existing hold was resumed rather than a new one scheduled.
    JobsNoShowSettlement:
      type: object
      description: How a no_show_payout split the held amount.
      required:
        - payout
        - clientRefund
        - heldAmount
      properties:
        payout:
          type: number
          description: >-
            min(heldAmount, max(round(heldAmount × noShowPayoutPercentage / 100), noShowPayoutMinimum)); paid to the
            provider after the hold.
        clientRefund:
          type: number
          description: heldAmount − payout; credited to the client immediately.
        heldAmount:
          type: number
    JobsResolveDisputeResponse:
      type: object
      required:
        - success
        - job
        - outcome
        - refundedAmount
        - draftId
        - escrow
        - rebookDeadlineAt
        - noShowSettlement
      properties:
        success:
          type: boolean
          enum:
            - true
        job:
          $ref: '#/components/schemas/JobsJobPopulated'
        outcome:
          type: string
          enum:
            - pay_provider
            - refund_client
            - rebook
            - no_show_payout
        refundedAmount:
          type: number
          description: Full held amount for refund_client; the client share for no_show_payout; 0 otherwise.
        draftId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: The Draft created from the job (refund_client only); null otherwise.
        escrow:
          allOf:
            - $ref: '#/components/schemas/JobsResolveDisputeEscrow'
          nullable: true
          description: Set for pay_provider and no_show_payout; null for refund_client and rebook.
        rebookDeadlineAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: The parsed redo deadline (rebook only).
        noShowSettlement:
          allOf:
            - $ref: '#/components/schemas/JobsNoShowSettlement'
          nullable: true
          description: Set for no_show_payout only.
    JobsRebookVerdictRequest:
      type: object
      required:
        - satisfied
        - reporterId
      properties:
        satisfied:
          type: boolean
          description: Must be a JSON boolean (strings rejected). true = the redo was delivered; false = it was not.
        reporterId:
          type: string
          description: >-
            User id of the party answering (compared as a string to job.userId / job.assignedToId). Must be the side
            recorded as `completionStatus.rebook.reporterRole` (inferred from this id for legacy rebooks without one).
            Only checked after the already-answered short-circuit.
        reason:
          type: string
          description: >-
            Optional; trimmed, empty → null. Stored on the verdict and, when satisfied is false, used as the reopened
            dispute reason.
    JobsRebookVerdictRecorded:
      type: object
      required:
        - success
        - satisfied
        - reporterRole
        - escrow
        - reopenedThreadIds
      properties:
        success:
          type: boolean
          enum:
            - true
        satisfied:
          type: boolean
        reporterRole:
          type: string
          enum:
            - client
            - provider
        escrow:
          type: object
          nullable: true
          description: >-
            Set when satisfied is true: the revived/scheduled EscrowRelease date (a fresh window from now). null when
            satisfied is false.
          required:
            - scheduledFor
          properties:
            scheduledFor:
              $ref: '#/components/schemas/DateTime'
        reopenedThreadIds:
          type: array
          items:
            type: string
            description: ChatSupport id
          description: Dispute threads reopened (satisfied false); empty when satisfied is true.
    JobsRebookVerdictAlreadyRecorded:
      type: object
      description: 'Idempotent replay: a verdict was already recorded, nothing is changed.'
      required:
        - success
        - alreadyRecorded
        - verdict
      properties:
        success:
          type: boolean
          enum:
            - true
        alreadyRecorded:
          type: boolean
          enum:
            - true
        verdict:
          type: object
          required:
            - satisfied
            - respondedAt
            - reason
          properties:
            satisfied:
              type: boolean
              nullable: true
            respondedAt:
              $ref: '#/components/schemas/DateTime'
            reason:
              type: string
              nullable: true
    JobsRebookVerdictResponse:
      oneOf:
        - $ref: '#/components/schemas/JobsRebookVerdictRecorded'
        - $ref: '#/components/schemas/JobsRebookVerdictAlreadyRecorded'
    JobsHideRequest:
      type: object
      properties:
        reason:
          type: string
          description: >-
            Optional; included in the owner's notification and the audit row (default 'No reason provided'). Not
            persisted on the job.
    JobsAssignRequest:
      type: object
      properties:
        providerId:
          $ref: '#/components/schemas/ObjectId'
      description: >-
        providerId is not validated for presence, existence, role or having applied. A malformed id fails with 400
        (CastError on assignedToId). If omitted, Mongoose drops the undefined key, so only status changes, and every
        application for the job is marked rejected.
    JobsSuccessMessage:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
    SupportDisplayStatus:
      type: string
      enum:
        - open
        - pending
        - resolved
      description: >-
        Derived, not stored: `resolved` when status is closed; `pending` when open and acceptedBy is set; otherwise
        `open`.
    SupportChatMessage:
      type: object
      description: One entry of ChatSupport.messages.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        senderId:
          $ref: '#/components/schemas/ObjectId'
        senderName:
          type: string
        senderType:
          type: string
          enum:
            - User
            - Admin
        message:
          type: string
          description: Message text (trimmed). Empty string for image-only messages.
        imageUrl:
          type: string
          nullable: true
        timestamp:
          $ref: '#/components/schemas/DateTime'
        isRead:
          type: boolean
          description: Admin-side read flag for User messages; set to true when an admin opens the thread (GET chatsupports/{id}).
        isInternal:
          type: boolean
          description: >-
            Admin-only note (POST internal-notes). kayod/server strips these from user-facing endpoints; this backend
            returns them in every admin response.
    SupportTicketHistoryEntry:
      type: object
      description: >-
        ChatSupport.ticketHistory entry. Written by kayod/server; this backend only reads it (access rule for closed
        tickets).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        ticketNumber:
          type: integer
        subject:
          type: string
        category:
          type: string
        openedAt:
          $ref: '#/components/schemas/DateTime'
        closedAt:
          $ref: '#/components/schemas/DateTime'
        resolvedBy:
          $ref: '#/components/schemas/ObjectId'
        messageCount:
          type: integer
    SupportStatusHistoryEntry:
      type: object
      description: ChatSupport.statusHistory entry pushed by close/reopen.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - resolved
            - reopened
        performedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Admin user id (null if the session id was not an ObjectId).
        performedByName:
          type: string
        timestamp:
          $ref: '#/components/schemas/DateTime'
        reason:
          type: string
          description: Close reason; "Ticket closed" when none was given. Absent on reopen entries.
    SupportPopulatedUser:
      type: object
      description: ChatSupport.userId populated with `userType profileImage`. Null when the user document no longer exists.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        userType:
          type: string
          enum:
            - client
            - provider
            - admin
            - superadmin
            - finance
            - customer support
            - support
        profileImage:
          type: string
          nullable: true
        id:
          type: string
          description: >-
            Mongoose `id` virtual. Present only when the ticket was serialized from a hydrated document (detail,
            accept), not from a lean query (close, reopen).
        isCurrentlyRestricted:
          type: boolean
          description: >-
            User schema virtual, present under the same condition as `id`. Computed from accountStatus, which this
            populate does not select, so it evaluates to true for every user.
    SupportChatSupportFields:
      type: object
      description: ChatSupport document fields other than userId (collection shared with kayod/server).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        ticketId:
          type: string
          description: >-
            Human-facing ticket id: five letters and five digits shuffled, e.g. "K3QP7A19ZM" (generated by kayod/server
            on create).
        userName:
          type: string
        userEmail:
          type: string
        subject:
          type: string
        category:
          type: string
          enum:
            - account
            - payment
            - technical
            - job
            - general
            - feedback
        priority:
          type: string
          description: Defaults to "medium" in every response that maps the ticket.
          enum:
            - low
            - medium
            - high
            - urgent
        metadata:
          type: object
          description: >-
            Free-form (Mixed). Dispute threads carry `kind: "dispute"` and `jobId`; the two party threads of one dispute
            share metadata.jobId. Replaced wholesale by notify-new-message when sent.
          properties:
            kind:
              type: string
            jobId:
              description: Job id (ObjectId or string, as written by kayod/server).
        jobDetailsSnapshot:
          type: object
          nullable: true
          description: Free-form (Mixed) snapshot of the related job, written by kayod/server or notify-new-message.
        status:
          type: string
          description: Stored status.
          enum:
            - open
            - closed
        ticketHistory:
          type: array
          items:
            $ref: '#/components/schemas/SupportTicketHistoryEntry'
        assignedTo:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Admin who owns the ticket. Set on accept (and on close if still empty).
        assignedToName:
          type: string
          nullable: true
        acceptedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Admin who accepted the ticket. Never cleared, so a reopened ticket stays accepted.
        acceptedByName:
          type: string
          nullable: true
        acceptedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        closedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/SupportStatusHistoryEntry'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SupportChatMessage'
          description: Full thread, including isInternal admin notes.
        lastMessage:
          type: object
          description: >-
            Preview of the newest message. Recomputed by the model pre-save hook whenever messages change on a save() —
            including when the newest message is an internal note.
          properties:
            text:
              type: string
            timestamp:
              $ref: '#/components/schemas/DateTime'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    SupportChatSupport:
      description: ChatSupport document with userId unpopulated.
      allOf:
        - $ref: '#/components/schemas/SupportChatSupportFields'
        - type: object
          properties:
            userId:
              $ref: '#/components/schemas/ObjectId'
    SupportChatSupportPopulated:
      description: ChatSupport document with userId populated (`userType profileImage`).
      allOf:
        - $ref: '#/components/schemas/SupportChatSupportFields'
        - type: object
          properties:
            userId:
              allOf:
                - $ref: '#/components/schemas/SupportPopulatedUser'
              nullable: true
    SupportChatSupportListItem:
      description: 'List row: the lean ticket (userId unpopulated) plus user-derived display fields.'
      allOf:
        - $ref: '#/components/schemas/SupportChatSupport'
        - type: object
          properties:
            priority:
              type: string
              description: '`priority || "medium"`.'
              enum:
                - low
                - medium
                - high
                - urgent
            userType:
              type: string
              description: The ticket user's userType, "client" when the user is missing or has none.
              enum:
                - client
                - provider
                - admin
                - superadmin
                - finance
                - customer support
                - support
            userProfileImage:
              type: string
              description: The ticket user's profileImage, or null.
              nullable: true
            displayStatus:
              $ref: '#/components/schemas/SupportDisplayStatus'
            unreadCount:
              type: integer
              description: Live count of messages with senderType "User" and isRead false.
          required:
            - priority
            - userType
            - userProfileImage
            - displayStatus
            - unreadCount
    SupportChatSupportView:
      description: Single ticket (userId populated) plus user-derived display fields.
      allOf:
        - $ref: '#/components/schemas/SupportChatSupportPopulated'
        - type: object
          properties:
            priority:
              type: string
              description: '`priority || "medium"`.'
              enum:
                - low
                - medium
                - high
                - urgent
            userType:
              type: string
              description: The ticket user's userType, "client" when the user is missing or has none.
              enum:
                - client
                - provider
                - admin
                - superadmin
                - finance
                - customer support
                - support
            userProfileImage:
              type: string
              description: The ticket user's profileImage, or null.
              nullable: true
            displayStatus:
              $ref: '#/components/schemas/SupportDisplayStatus'
          required:
            - priority
            - userType
            - userProfileImage
            - displayStatus
    SupportLinkedChatSupport:
      description: Counterpart dispute thread accepted together with the requested one (userId unpopulated).
      allOf:
        - $ref: '#/components/schemas/SupportChatSupport'
        - type: object
          properties:
            priority:
              type: string
              enum:
                - low
                - medium
                - high
                - urgent
            displayStatus:
              type: string
              enum:
                - pending
          required:
            - priority
            - displayStatus
    SupportStats:
      type: object
      properties:
        total:
          type: integer
          description: All ChatSupport documents (not scoped to the caller).
        pending:
          type: integer
          description: Tickets with status "open" (same query as inProgress).
        inProgress:
          type: integer
          description: Tickets with status "open" (same query as pending).
        resolved:
          type: integer
          description: Tickets with status "closed".
        rejected:
          type: integer
          description: Hard-coded 0.
          enum:
            - 0
        urgent:
          type: integer
          description: Hard-coded 0.
          enum:
            - 0
        recentActivity:
          type: integer
          description: Tickets with updatedAt in the last 24 hours.
      required:
        - total
        - pending
        - inProgress
        - resolved
        - rejected
        - urgent
        - recentActivity
    SupportPagination:
      type: object
      properties:
        current:
          type: integer
          description: Page actually used (>= 1).
        total:
          type: integer
          description: 'Number of pages: ceil(count / limit).'
        count:
          type: integer
          description: Number of matching tickets.
      required:
        - current
        - total
        - count
    SupportBroadcastMobileMessageRequest:
      type: object
      properties:
        chatSupportId:
          type: string
          description: ChatSupport id; used as the socket room suffix (`support:<chatSupportId>`). Not validated as an ObjectId.
        message:
          description: >-
            Message payload forwarded verbatim in the socket event (typically a ChatSupport message object: _id,
            senderId, senderName, senderType, message, imageUrl, timestamp). Any truthy value is accepted.
      required:
        - chatSupportId
        - message
    SupportNotifyNewTicketRequest:
      type: object
      properties:
        chatSupportId:
          type: string
          description: >-
            ChatSupport id created alongside the ticket. When a valid ObjectId of an existing document, that document is
            emitted as `support:new_chat`.
        ticketId:
          type: string
          description: Ticket identifier echoed in the socket events.
        priority:
          type: string
          description: Echoed in the socket events; not validated.
    SupportNotifyNewMessageRequest:
      type: object
      properties:
        chatSupportId:
          type: string
          description: ChatSupport id. When present it must be a valid ObjectId (else 400) of an existing document (else 404).
        ticketId:
          type: string
          description: Ticket identifier; the per-ticket socket room is `support:<ticketId || chatSupportId>`.
        jobDetailsSnapshot:
          type: object
          description: When truthy and chatSupportId is given, $set on the ticket.
        metadata:
          type: object
          description: When truthy and chatSupportId is given, $set on the ticket — replaces the whole metadata object.
        priority:
          type: string
          description: Written to the ticket only when one of the allowed values; anything else is ignored (no error).
          enum:
            - low
            - medium
            - high
            - urgent
    SupportAck:
      type: object
      properties:
        success:
          type: boolean
          description: Always true on success.
          enum:
            - true
      required:
        - success
    ReportsReportType:
      type: string
      enum:
        - job
        - user
        - message
        - conversation
        - review
        - payment
        - other
    ReportsStatus:
      type: string
      enum:
        - open
        - under_review
        - action_taken
        - dismissed
        - escalated
      description: >-
        Canonical report status. open = untriaged; under_review = picked up; action_taken = closed with a moderation
        action; dismissed = closed with no action; escalated = converted into a job dispute (set by the client app,
        never by admins).
    ReportsStoredStatus:
      type: string
      enum:
        - open
        - under_review
        - action_taken
        - dismissed
        - escalated
        - pending
        - reviewed
        - resolved
      description: >-
        Status as stored. Documents written before the taxonomy change can still hold the retired
        pending/reviewed/resolved (read as open/under_review/action_taken by the combined feed).
    ReportsDecisionStatus:
      type: string
      enum:
        - under_review
        - action_taken
        - dismissed
      description: Admin-driven transitions only; "escalated" is never set from the admin panel.
    ReportsReason:
      type: string
      enum:
        - spam
        - inappropriate_content
        - misleading_information
        - fake_job_posting
        - duplicate_posting
        - scam_or_fraud
        - discrimination
        - harassment
        - violence_or_threats
        - adult_content
        - copyright_violation
        - unsafe_work_conditions
        - payment_issues
        - other
        - unfinished_work
        - substandard_work
        - misconduct
        - fake_profile
        - threats
        - unsolicited_solicitation
        - inappropriate_behavior
        - fake_review
        - defamation
        - conflict_of_interest
        - unauthorized_charge
        - payment_dispute
      description: Canonical report reason (REPORT_REASONS).
    ReportsStoredReason:
      type: string
      enum:
        - spam
        - inappropriate_content
        - misleading_information
        - fake_job_posting
        - duplicate_posting
        - scam_or_fraud
        - discrimination
        - harassment
        - violence_or_threats
        - adult_content
        - copyright_violation
        - unsafe_work_conditions
        - payment_issues
        - other
        - unfinished_work
        - substandard_work
        - misconduct
        - fake_profile
        - threats
        - unsolicited_solicitation
        - inappropriate_behavior
        - fake_review
        - defamation
        - conflict_of_interest
        - unauthorized_charge
        - payment_dispute
        - scam
        - fraud
        - fake_job
      description: Reason as stored. Legacy documents can still hold scam/fraud (→ scam_or_fraud) or fake_job (→ fake_job_posting).
    ReportsActionTaken:
      type: string
      enum:
        - none
        - post_deleted
        - post_approved
        - user_warned
        - user_restricted
        - user_suspended
        - report_dismissed
        - conversation_deleted
        - message_deleted
        - escalated_to_dispute
    ReportsReportMetadata:
      type: object
      properties:
        reporterIP:
          type: string
        reporterUserAgent:
          type: string
        reportSource:
          type: string
          enum:
            - web
            - mobile
            - api
    ReportsUserRef:
      type: object
      description: User reference populated with `name email userType`. Null when the referenced user no longer exists.
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        userType:
          type: string
          enum:
            - client
            - provider
            - admin
            - superadmin
            - finance
            - customer support
            - support
        id:
          type: string
          description: >-
            Mongoose `id` virtual; present only in responses serialized from hydrated documents (create, status update,
            details), not lean ones.
        isCurrentlyRestricted:
          type: boolean
          description: >-
            User schema virtual, present under the same condition as `id`. Computed from accountStatus, which this
            populate does not select, so it evaluates to true for every user.
    ReportsJobDetailsSnapshot:
      type: object
      description: Snapshot of the job taken when the post was reported (ReportedPost.jobDetails).
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        icon:
          type: string
        media:
          type: array
          items:
