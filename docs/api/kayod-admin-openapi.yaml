        reportedUserId, not jobPosterId, so in practice only report_filed rows appear (always titled "Reported a job"
        whatever the reportType), and `reportedposts` is not read at all.
      required:
        - id
        - type
        - action
        - title
        - timestamp
        - targetType
      properties:
        id:
          type: string
          description: '"report-<reportId>".'
        type:
          type: string
          enum:
            - report
        action:
          type: string
          enum:
            - report_filed
            - report_received
        title:
          type: string
          enum:
            - Reported a job
            - A job of theirs was reported
        description:
          type: string
          description: Report reason, else comment, else "Report".
        status:
          type: string
        targetId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
