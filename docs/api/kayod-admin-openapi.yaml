  /api/configurations/professions/{professionId}:
    patch:
      tags:
        - Configurations
      operationId: updateProfession
      summary: Edit a profession (name, icon, service class, quick-access flags)
      description: >-
        Finds the category holding the profession (404 "Profession not found"). Each field is applied only when present:
        `name` non-blank (400 "Profession name is required") and not a case-insensitive duplicate within the category
        (400 "Profession name already exists in this category"); `icon` stored as given; `isQuickAccess` /
        `quickAccessOrder` assigned without validation (Mongoose casting only — this route does NOT enforce the
        8-profession quick-access cap or ordering); `serviceClass` must be a known class or null (null clears the
        override; 400 otherwise). Side effects: (1) on a rename where the stored icon is `ik:` and no new icon is sent,
        the ImageKit file is renamed to `<slug(newName)><ext>` (CDN purged) and profession.icon updated; a rename
        failure is logged and the old icon kept; if the DB save then fails the ImageKit rename is rolled back. (2) After
        saving, if the name or icon changed, `Job.updateMany` and raw `drafts.updateMany` on `professionName = oldName`
        set professionName and/or icon (non-ik icons are written as `custom:<icon>`); failures are returned in
        `warnings`. (3) For legacy on-disk icons (neither old nor new is `ik:`) the icon file is COPIED in the sibling
        kayod/client/src/assets/icons/professions folder and RENAMED in Frontend/public/assets/icons/professions on the
        server host (best-effort). Sending `icon: null` saves, then throws in the cascade (`icon.startsWith` on null) ->
        500 although the change is persisted. Writes an ActivityLog audit row `profession_updated` with from/to diffs,
        only if something changed (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room). The
        handler also tries to emit `configuration:updated` on the /admin namespace, but configurationsController
        captures `io` at module load via a circular `require("../../server")` (server.js has not set module.exports
        yet), so `io` is always undefined and no event is sent. Auth: adminAuth — no session / non-admin session -> 403
        `{success:false,error:"Admin access required"}`; an admin account that is now deactivated, demoted or deleted ->
        401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: professionId
          in: path
          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: If present must be non-blank; trimmed.
                icon:
                  type: string
                  description: >-
                    If present stored as given, e.g. `ik:/professionIconsUpload/<slug>.webp` or a legacy
                    `custom:<file>`.
                isQuickAccess:
                  type: boolean
                quickAccessOrder:
                  type: number
                serviceClass:
                  type: string
                  enum:
                    - standard
                    - immediate
                    - null
                  nullable: true
                  description: standard | immediate | null (null clears the override). Unknown string -> 400.
      responses:
        '200':
          description: Updated profession.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - profession
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  profession:
                    $ref: '#/components/schemas/ConfigProfession'
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Present only when the job/draft cascade failed, e.g. "Failed to update some jobs to the renamed
                      icon: <error>".
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Configurations
      operationId: deleteProfession
      summary: Remove a profession from its category
      description: >-
        Finds the category holding the profession (404 "Profession not found"), pulls the subdocument and saves. No
        cascade to jobs/drafts and no icon cleanup. Writes an ActivityLog audit row `profession_deleted` (non-fatal;
        logActivity also emits `activity:new` to the /admin superadmins room). The handler also tries to emit
        `configuration:updated` on the /admin namespace, but configurationsController captures `io` at module load via a
        circular `require("../../server")` (server.js has not set module.exports yet), so `io` is always undefined and
        no event is sent. Auth: adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access
        required"}`; an admin account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: professionId
          in: path
          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    example: Profession deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/configurations/professions/{professionId}/transfer:
    patch:
      tags:
        - Configurations
      operationId: transferProfession
      summary: Move a profession to another category
      description: >-
        Validates: targetCategoryId present (400 "Target category ID is required"); source category containing the
        profession exists (404 "Profession not found"); target differs from the source (400 "Profession is already in
        this category"); target exists (404 "Target category not found"); no case-insensitive name clash in the target
        (400 `A profession named "<name>" already exists in "<target>"`). Copies name, icon, isQuickAccess,
        quickAccessOrder and createdAt into a NEW subdocument in the target (new _id — the old professionId stops
        existing; the serviceClass override is NOT copied, so it reverts to inherit), saves the target, then pulls it
        from the source and saves (two separate writes, no transaction). Then best-effort `Job.updateMany` and raw
        `drafts.updateMany` re-point documents with this professionName and jobCategory = source to the target category
        (failures only logged). Writes an ActivityLog audit row `profession_transferred` (targetId = target category,
        changes.category from/to) (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room).
        Auth: adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an
        admin account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: professionId
          in: path
          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
