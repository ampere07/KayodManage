          required: true
          description: Profession subdocument _id (`professions._id`). A malformed id -> 400.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: If present must be non-blank; trimmed.
                icon:
                  type: string
                  description: >-
                    If present stored as given, e.g. `ik:/professionIconsUpload/<slug>.webp` or a legacy
                    `custom:<file>`.
                isQuickAccess:
                  type: boolean
                quickAccessOrder:
                  type: number
                serviceClass:
                  type: string
                  enum:
                    - standard
                    - immediate
                    - null
                  nullable: true
                  description: standard | immediate | null (null clears the override). Unknown string -> 400.
      responses:
        '200':
          description: Updated profession.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - profession
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  profession:
                    $ref: '#/components/schemas/ConfigProfession'
                  warnings:
                    type: array
                    items:
                      type: string
                    description: >-
                      Present only when the job/draft cascade failed, e.g. "Failed to update some jobs to the renamed
                      icon: <error>".
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
