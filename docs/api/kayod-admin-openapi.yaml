  /api/users:
    get:
      operationId: getUsers
      tags:
        - Users
      summary: List users with filters and pagination
      description: >-
        Returns a page of `users` documents (newest first) matching the filters, each enriched with its wallet summary,
        fee records and top-up/cash-out totals.


        Filter interplay:

        - `status` sets isVerified/accountStatus/isOnline shortcuts; an explicit `isVerified` or `accountStatus`
        overrides the same field set by `status`.

        - `restricted=true` applies only when `accountStatus` is absent.

        - `userType` keeps only "client"/"provider" values; when none survive (missing, or e.g. "admin"), NO userType
        filter is applied and staff accounts are listed too.


        Read-only. Queries: users (find + countDocuments), wallets, feerecords, transactions (2 aggregates), withdrawals
        (raw collection).


        Access: `adminAuth` — the session must be authenticated with role admin or superadmin (otherwise **403** `Admin
        access required`, which is also what an unauthenticated caller gets). The admin account is re-read on every
        request; if it no longer exists, is not `accountStatus: active`, or is no longer admin/superadmin, the session
        is destroyed and **401** is returned.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: page
          in: query
          required: false
          description: >-
            1-based page. parseInt; missing/0/non-numeric → 1. Negative values are not rejected (Mongo then fails with
            500).
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size. parseInt; missing/0/non-numeric → 20. No maximum is enforced.
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          required: false
          description: >-
            A leading "KYD:" prefix (case-insensitive) is stripped and the rest trimmed. Matches name OR email as a
            case-insensitive regex — the term is NOT escaped, so regex metacharacters are interpreted and an invalid
            pattern fails with 500. If the term is a valid ObjectId (24 hex, or any 12-character string) it also matches
            `_id` exactly.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >-
            Shortcut filter: verified → isVerified true; unverified → isVerified false (strict: documents without the
            flag are excluded, unlike isVerified=false); restricted → accountStatus in restricted/suspended/banned;
            online → isOnline true; banned/suspended/active → that accountStatus. Any other value is ignored.
          schema:
            type: string
            enum:
              - verified
              - unverified
              - restricted
              - online
              - banned
              - suspended
              - active
        - name: userType
          in: query
          required: false
          description: >-
            Comma-separated, e.g. "client,provider". Only client and provider are honoured; other values are silently
            dropped, and if none remain no userType filter is applied.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - client
                - provider
        - name: restricted
          in: query
          required: false
          description: >-
            Only the exact string "true" has an effect: accountStatus in restricted/suspended/banned OR isRestricted
            true (the latter also matches soft-deleted users). Ignored when accountStatus is given.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: isVerified
          in: query
          required: false
          description: >-
            "true" → isVerified true. ANY other present value (including "false" or empty) → isVerified != true
            (documents without the flag count as unverified).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: accountStatus
          in: query
          required: false
          description: >-
            Exact accountStatus, or comma-separated list (e.g. "restricted,suspended,banned") → $in. Values are not
            validated (an unknown value just matches nothing). Overrides `status` and disables `restricted`.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - restricted
                - suspended
                - banned
                - deleted
        - name: profession
          in: query
          required: false
          description: >-
            Exact, case-sensitive profession/category name. Matches users whose `categories` contains it, whose
            `jobCategories` equals or contains it, or whose `category` equals it. ANDed with `search`.
          schema:
            type: string
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/users/{userId}:
