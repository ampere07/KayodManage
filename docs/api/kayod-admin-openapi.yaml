        - $ref: '#/components/schemas/UsersActivityQuoteEvent'
        - $ref: '#/components/schemas/UsersActivityReviewEvent'
        - $ref: '#/components/schemas/UsersActivityVerificationEvent'
        - $ref: '#/components/schemas/UsersActivitySupportEvent'
        - $ref: '#/components/schemas/UsersActivityReportEvent'
        - $ref: '#/components/schemas/UsersActivityAdminEvent'
    UsersActivityResponse:
