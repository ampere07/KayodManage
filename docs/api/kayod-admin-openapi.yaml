            paymentReleased:
              type: boolean
            providerConfirmedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            clientConfirmedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            paymentReleasedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            completedAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            noShowReview:
              type: object
              properties:
                openedAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                  nullable: true
                autoResolveAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                  nullable: true
                reminderSentAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                  nullable: true
                resolvedAt:
                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                  nullable: true
                outcome:
                  type: string
                  enum:
                    - refunded_unclaimed
                    - issue_raised
                    - null
                  nullable: true
            neitherConfirmedReminderSentAt:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              nullable: true
            dispute:
              type: object
              properties:
                isActive:
                  type: boolean
