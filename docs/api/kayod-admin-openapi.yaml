      description: >-
        Server-to-server only (supportServiceAuth): the `x-api-key` header must equal SUPPORT_SERVICE_KEY (falling back
        to KAYOD_API_KEY, and outside production to a built-in development key), compared in constant time. 401 on a
        wrong/missing key; 503 when no key is configured (production with neither env var set).


        Inline handler. If body.chatSupportId is a valid ObjectId of an existing ChatSupport, emits `support:new_chat`
        `{ chatSupport, timestamp }` (the full lean ticket, messages included) to room `admin` — every connected admin,
        regardless of ticket ownership. Then emits `support:ticket_updated` `{ ticket: { ticketId, chatSupportId,
        priority }, updateType: "new_ticket", timestamp }` and `support:new_ticket` to room `admin`, plus
        `support:ticket_updated` to room `support:<ticketId>` when ticketId is given. No database writes.


        Always answers 200 once past authentication: on an internal error it still returns 200 with `{ success: false,
        message }` so the caller does not retry. All body fields are optional.
      security:
