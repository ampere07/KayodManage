        video:
          type: object
          properties:
            uri:
              type: string
            cloudinaryUrl:
              type: string
            publicId:
              type: string
            originalName:
              type: string
            duration:
              type: number
            format:
              type: string
            size:
              type: number
            type:
              type: string
        location:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
            address:
              type: string
            name:
              type: string
            city:
              type: string
            region:
              type: string
            country:
              type: string
        locationDetails:
          type: string
        date:
          $ref: '#/components/schemas/DateTime'
        isUrgent:
          type: boolean
        paymentMethod:
          type: string
        status:
          type: string
        softLimitBudget:
          type: number
        budget:
          type: number
        budgetType:
          type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    ReportsReportedByDetails:
      type: object
      description: Denormalized reporter snapshot (ReportedPost.reportedByDetails).
      properties:
        providerId:
          $ref: '#/components/schemas/ObjectId'
        providerName:
          type: string
        providerEmail:
          type: string
        providerUserType:
          type: string
        reportedAt:
          $ref: '#/components/schemas/DateTime'
    ReportsReportFields:
      type: object
      description: Report document fields other than the user references (reports collection).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        reportType:
          $ref: '#/components/schemas/ReportsReportType'
        relatedId:
          $ref: '#/components/schemas/ObjectId'
        jobId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: >-
