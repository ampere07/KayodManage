  /api/jobs:
    get:
      operationId: getJobs
      tags:
        - Jobs
      summary: List jobs (paginated, filterable)
      description: >-
        Read-only. Finds jobs matching the filters, newest first (`createdAt` desc — there is no sort parameter),
        populates owner and assignee, and adds `applicationCount` (Application aggregate), `locationDisplay` and a
        cleaned `icon` to every row.


        By default hidden (`isHidden`) and removed (`isDeleted`) jobs are excluded; `archived=true` returns only those
        (narrowed by `archiveType`). Text filters are unescaped case-insensitive regexes, so an invalid pattern fails
        with 500.


        `stats.totalValue` is computed over the whole collection, ignoring all filters.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page. Non-numeric or 0 → 1. A negative value produces a negative skip and a 500.
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size. Non-numeric or 0 → 20. No upper bound is enforced.
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive regex (not escaped) matched against title, description, professionName and categoryName
            (OR).
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >-
            Exact match on `status`; `all` or empty = no filter. Not validated (known values: open, in_progress,
            scheduled, completed, cancelled, expired).
          schema:
            type: string
        - name: category
          in: query
          required: false
          description: >-
            Case-insensitive regex on `categoryName` (not on `category`, the field kayod/server writes); `all` = no
            filter.
          schema:
            type: string
        - name: profession
          in: query
          required: false
          description: Case-insensitive regex on `professionName`; `all` = no filter.
          schema:
            type: string
        - name: paymentMethod
          in: query
          required: false
          description: Exact match on `paymentMethod` (wallet, xendit); `all` = no filter. Not validated.
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: >-
            Only the exact string `true` → only archived jobs (isHidden OR isDeleted, unless narrowed by archiveType).
            Any other value/absent → hidden and deleted jobs are excluded.
          schema:
            type: boolean
            default: false
        - name: archiveType
          in: query
          required: false
          description: >-
            Only read when archived=true: `hidden` → isHidden only, `removed` → isDeleted only; any other value → the
            union.
          schema:
            type: string
            enum:
              - hidden
              - removed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/jobs/{jobId}:
    get:
      operationId: getJobDetails
      tags:
        - Jobs
      summary: Get one job with its applications
      description: >-
        Read-only. Loads the job (any archive state) with the owner populated (name, firstName, lastName, email, phone,
        phoneNumber, userType, profileImage, location, barangay, city, isVerified) and the assignee populated (name,
        email, phone, phoneNumber, userType, profileImage), then attaches every Application for the job (provider
        populated with name/email/phone, newest first).


        No chat, Transaction or EscrowRelease data is fetched; escrow/dispute state is whatever the job document carries
        (`escrow*`, `paymentDetails`, `completionStatus.dispute`, `disputeHistory`, `rebook`, `cancellation`).


        A malformed jobId is a CastError → 400.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsJobDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteJob
      tags:
        - Jobs
      summary: Soft-delete (remove) a job
      description: >-
        Refuses with 409 when the job is `in_progress` or `scheduled`, when `paymentDetails.heldTransaction` points at a
        Transaction still `held`, or when `completionStatus.dispute.isActive` — "Cancel Job returns the payment". (A
        completed job whose payout is still in its EscrowRelease warranty window is NOT blocked.)


        Otherwise sets `isDeleted: true`, `deletedAt`, `deletedBy` (admin display name); `deletionReason` is not set and
        status is untouched. kayod/server treats a deleted job as gone for everyone.


        Side effects: Notification "Job Removed by Admin" (type admin_action, priority high) to the owner, skipped if
        the owner account no longer exists; audit row `job_deleted` (only when req.admin.id is set); `job:updated` with
        `{ job: { _id }, updateType: "deleted" }`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT
        namespace — admin sockets only join `admin` inside the `/admin` namespace, so in practice no client receives it.


        A malformed jobId is a CastError → 400.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: '`{ success: true, message: ''Job deleted successfully'' }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsSuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/jobs/{jobId}/assign:
    patch:
      operationId: assignJobToProvider
      tags:
        - Jobs
      summary: Assign a job to a provider
      description: >-
        Sets `assignedToId = providerId` and `status = in_progress` via `findByIdAndUpdate` (no transaction, no status
        precondition). Then marks that provider's Application `accepted` (if one exists) and every other Application for
        the job `rejected`.


        No escrow hold, wallet movement, booking slot or notification is created. providerId is not validated (presence,
        existence, role, or having applied); a malformed value → 400 CastError. If omitted, the undefined key is dropped
        from the update (only status changes) and every application for the job is rejected.


        Side effects: audit row `job_assigned` {providerId, providerName}; `job:updated` with `updateType: "assigned to
        provider"`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT namespace — admin sockets only join
        `admin` inside the `/admin` namespace, so in practice no client receives it.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobsAssignRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsJobMutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/jobs/{jobId}/force-cancel:
    post:
      operationId: forceCancelJob
      tags:
        - Jobs
      summary: Cancel a job and refund any held payment in full
      description: >-
        Runs in a MongoDB transaction. 404 if the job is missing; 400 if it is already `cancelled` or is `completed`.


        Money: only when `paymentDetails.heldTransaction` is a Transaction with status `held` — client Wallet
        `heldBalance -= amount` (floored at 0), `availableBalance += amount`, `statistics.totalSpent` reduced by the
        refund net of what actually left heldBalance; the held Transaction → `refunded`; a new Transaction `{type:
        job_budget_refund, status: completed, toUserId: client, amount, metadata {reason, cancelledBy: admin,
        adminId}}`. No fee is charged. A hold in any other state (e.g. a rebooked job whose escrow Transaction is
        already `completed` with a suspended EscrowRelease) refunds nothing (`refundedAmount: 0`), and EscrowRelease
        records are never touched.


        Job: `paymentDetails.isPaid=false`, `paidAt=null`, `heldTransaction=null`, `paymentStatus=pending`; an active
        dispute is archived to `disputeHistory` (no claims/finding) and cleared with resolution `client_refunded` (even
        when nothing was refunded); `status=cancelled`; `cancellation {cancelledAt, cancelledBy: admin id, reason
        (default "Cancelled by admin"), feeApplied: 0}`. The provider's ProviderBookingSlot rows for the job are
        deleted. Commit.


        After commit (best-effort): "Booking Cancelled" Notifications (admin_action, high) to client and assigned
        provider; every open dispute ChatSupport thread for the job gets a summary + "Ticket has been resolved: Client
        refunded" message, is closed with a `resolved` statusHistory entry and `metadata.disputeOutcome: refund_client`,
        and `support:chat_updated` is emitted on `/admin`; audit row `job_force_cancelled` {reason, refundedAmount};
        `job:updated` with `updateType: "force-cancelled"`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT
        namespace — admin sockets only join `admin` inside the `/admin` namespace, so in practice no client receives it.


        Errors: 400/404 use the standard envelope. Any other failure — including a malformed jobId (CastError) — is
        answered by the handler itself as 500 `{ error: "Failed to cancel job", message }`.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobsForceCancelRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsForceCancelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/jobs/{jobId}/hide:
    patch:
      operationId: hideJob
      tags:
        - Jobs
      summary: Hide a job (archive as hidden)
      description: >-
        Sets `isHidden: true`, `hiddenAt: now`, `hiddenBy` (admin display name). No status, money or booking checks;
        already-hidden or deleted jobs are accepted.


        Side effects: Notification "Job Hidden by Admin" (admin_action, high) to the owner, including the reason when
        given; audit row `job_hidden` {jobTitle, userId, userName, reason} (only when req.admin.id is set);
        `job:updated` with `updateType: "hidden"`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT
        namespace — admin sockets only join `admin` inside the `/admin` namespace, so in practice no client receives it.


        If the owner account no longer exists (populated userId is null) the notification step throws AFTER the job was
        hidden → 500 "Failed to hide job".


        A malformed jobId is a CastError → 400.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
