                  allOf:
                    - $ref: '#/components/schemas/DateTime'
                  nullable: true
                reason:
                  type: string
                  nullable: true
                claims:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        $ref: '#/components/schemas/ObjectId'
                      party:
                        type: string
