      summary: Bulk-review reported posts
      description: >-
        Requires an admin session (adminAuth): no authenticated admin/superadmin session -> 403 `Admin access required`;
        a session whose account is no longer active or no longer an admin is destroyed -> 401. Not transactional.
        ReportedPost.updateMany over `reportIds` (no validators): status (`approve`/`dismiss` -> `dismissed`, `delete`
        -> `action_taken`), reviewedAt now, adminNotes = "[Bulk review by: <session username> on <ISO>]" + " -
        <adminNotes>" (replaces previous notes). actionTaken is sent but dropped by strict mode; reviewedBy is
        deliberately not set. For `delete`, every job referenced by the listed reports (including already-deleted ones,
        whose deletedAt/reason are overwritten) gets status `cancelled`, isDeleted true, deletedAt now, deletionReason
        "Deleted due to bulk report review" — no escrow/refund handling. Then one audit row `reports_bulk_reviewed`
