        type:
          type: string
    VerificationsAttempt:
      type: object
      description: One submission attempt, written by the Kayod app (not declared in the admin schema; returned as stored).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        attemptNumber:
          type: integer
        submittedAt:
          $ref: '#/components/schemas/DateTime'
        faceVerification:
          description: Mixed; as uploaded by the app.
          nullable: true
        validId:
          description: Mixed; as uploaded by the app.
          nullable: true
        credentials:
          description: Mixed; as uploaded by the app.
          nullable: true
    VerificationsPopulatedUser:
      type: object
      description: >-
        userId populated with name, email, userType, profileImage, createdAt. On the PATCH response (hydrated document)
        the User virtuals `id` and `isCurrentlyRestricted` are also present (the latter is always true there because
        accountStatus is not selected).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        userType:
          type: string
          enum:
            - client
            - provider
            - admin
            - superadmin
            - finance
            - customer support
            - support
        profileImage:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        id:
          type: string
          description: PATCH response only.
        isCurrentlyRestricted:
          type: boolean
          description: PATCH response only; always true (accountStatus not selected).
    VerificationsReviewer:
      type: object
      description: reviewedBy populated with name, email (PATCH response also carries `id`/`isCurrentlyRestricted` virtuals).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        id:
          type: string
          description: PATCH response only.
        isCurrentlyRestricted:
          type: boolean
          description: PATCH response only; always true (accountStatus not selected).
    VerificationsVerification:
      type: object
      description: >-
        A credentialverifications document as stored (all stored fields are returned, including ones only the Kayod app
        writes), with userId and reviewedBy populated.
      required:
        - _id
        - status
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          allOf:
            - $ref: '#/components/schemas/VerificationsPopulatedUser'
          nullable: true
          description: null if the user document no longer exists.
        username:
          type: string
          description: Written by the Kayod app.
        faceVerification:
          description: >-
            Face verification image(s): Mixed — either a single document or an array of documents. Required by the admin
            schema, but the Kayod app stores documents under `attempts[]` instead, so it is often absent.
          oneOf:
            - $ref: '#/components/schemas/VerificationsDocument'
            - type: array
              items:
                $ref: '#/components/schemas/VerificationsDocument'
        validId:
          description: >-
            Valid ID image(s): Mixed — either a single document or an array of documents. Required by the admin schema,
            but the Kayod app stores documents under `attempts[]` instead, so it is often absent.
          oneOf:
            - $ref: '#/components/schemas/VerificationsDocument'
            - type: array
              items:
                $ref: '#/components/schemas/VerificationsDocument'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/VerificationsDocument'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/VerificationsAttempt'
          description: Written by the Kayod app.
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - under_review
            - resubmission_requested
            - flagged
        submittedAt:
          $ref: '#/components/schemas/DateTime'
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/VerificationsReviewer'
          nullable: true
        adminNotes:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        verificationAttempts:
          type: integer
          description: >-
            On the GET endpoints this is overwritten with a computed count (see each operation); on the PATCH response
            it is the stored value.
        isActive:
          type: boolean
          description: Written by the Kayod app.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    VerificationsStats:
      type: object
      required:
        - total
        - pending
        - approved
        - rejected
        - under_review
        - resubmission_requested
        - flagged
      properties:
        total:
          type: integer
          description: All credentialverifications documents.
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        under_review:
          type: integer
        resubmission_requested:
          type: integer
        flagged:
          type: integer
    VerificationsImageAsset:
      type: object
      nullable: true
      description: >-
        One image. Shape depends on the source: ImageKit -> {cloudinaryUrl, url, publicId (ImageKit fileId), path,
        uploadedAt, type?}; Cloudinary -> {cloudinaryUrl (secure_url), publicId (public_id), uploadedAt, type?}; DB
        fallback -> the stored document {cloudinaryUrl, publicId, uploadedAt, originalName?, type?}. Array slots can be
        null (sparse validId slots, and Cloudinary pads a single face image to [null, face, null]).
      properties:
        cloudinaryUrl:
          type: string
          description: Image URL (named cloudinaryUrl for all sources, including ImageKit).
        url:
          type: string
          description: ImageKit only; same value as cloudinaryUrl.
        publicId:
          type: string
          description: ImageKit fileId, Cloudinary public_id, or the stored publicId.
        path:
          type: string
          description: 'ImageKit only: the file path.'
        uploadedAt:
          type: string
          description: ISO timestamp from the provider (createdAt / created_at) or the stored uploadedAt.
          format: date-time
        originalName:
          type: string
          description: DB fallback only.
        type:
          type: string
          description: '`front` / `back` for validId slots filled from ImageKit/Cloudinary; as stored for the DB fallback.'
    VerificationsUserImages:
      type: object
      required:
        - userId
        - attemptNumber
        - attemptSubmittedAt
        - attemptTimestamps
        - images
      properties:
        userId:
          type: string
          description: The userId path parameter, echoed as given.
        attemptNumber:
          type: integer
          description: >-
            ImageKit/Cloudinary result: the requested `attempt` value as sent (not clamped), or the latest attempt
            number. DB fallback: the clamped attempt index + 1.
        attemptSubmittedAt:
          type: string
          format: date-time
          nullable: true
          description: submittedAt of the selected attempt (index clamped to the existing attempts).
        attemptTimestamps:
          type: array
          items:
            type: object
            required:
              - attempt
              - submittedAt
            properties:
              attempt:
                type: integer
                description: 1-based position of the verification record in submittedAt-ascending order.
              submittedAt:
                type: string
                format: date-time
                nullable: true
                description: attempts[attemptNumber == attempt].submittedAt, else the record submittedAt, else createdAt.
          description: One entry per credentialverifications record for the user, oldest first.
        images:
          type: object
          properties:
            faceVerification:
              description: >-
                Face images (classified by `face_` filename prefix). An array for ImageKit/Cloudinary; for the DB
                fallback it is the stored Mixed value (single object or array), and absent when the record keeps its
                images under attempts[] (Kayod-app records).
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/VerificationsImageAsset'
                - $ref: '#/components/schemas/VerificationsImageAsset'
            validId:
              description: >-
                ID images: [front (`frontID_`), back (`backID_`)]. An array for ImageKit/Cloudinary; for the DB fallback
                it is the stored Mixed value (single object or array), and absent when the record keeps its images under
                attempts[] (Kayod-app records).
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/VerificationsImageAsset'
                - $ref: '#/components/schemas/VerificationsImageAsset'
            credentials:
              description: >-
                Every other file in the attempt folder. An array for ImageKit/Cloudinary; for the DB fallback it is the
                stored Mixed value (single object or array), and absent when the record keeps its images under
                attempts[] (Kayod-app records).
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/VerificationsImageAsset'
                - $ref: '#/components/schemas/VerificationsImageAsset'
    VerificationsUpdateError:
      type: object
      description: Hand-rendered by updateVerificationStatus's own catch block (it is not wrapped in asyncHandler).
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
          description: error.message (or "Invalid verification ID format").
        error:
          type: string
          description: Same string as message; absent on the invalid-id 400.
        details:
          type: object
          nullable: true
          description: >-
            Mongoose `error.errors` map (path -> validator error object) for a ValidationError; null otherwise; absent
            on the invalid-id 400.
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        The session belongs to an account that is no longer an active admin (the session is destroyed), or no session
        for session-only routes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: No admin session, or the account lacks the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The record does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (e.g. duplicate, already decided)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Service authentication is not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
