  /api/configurations/legal-documents/{documentId}:
    patch:
      tags:
        - Configurations
      operationId: updateLegalDocument
      summary: Edit a legal document's content
      description: >-
        Unknown documentId -> 404 `Unknown legal document "<id>"`; the record is seeded if missing. Applies each present
        field: title/shortTitle/intro/version must be non-blank (400 "<field> cannot be empty"); subtitle may be
        cleared; `sections` replaces all sections after strict validation (>= 1 section; each needs a non-empty id
        unique within the document, a non-empty title, an optional non-negative integer number, and >= 1 valid block;
        blocks are p{text} | clauses/bullets{items[>=1 non-empty]} | sub{title, blocks[>=1], recursive} |
        table{head[>=2], rows[>=1] each exactly head.length cells}; first error -> 400 with a path such as
        `sections[3].blocks[1].items[0] must be non-empty text`). `version` changes only when sent; `revision` is
        incremented on EVERY call (even an empty body); `lastUpdatedLabel` and `sourceVersion` are never changed here.
        Sets updatedBy = session email || uid || "admin" and saves. Writes an ActivityLog audit row
        `legal_document_updated` on every call, listing changed parts and the new revision (non-fatal; logActivity also
        emits `activity:new` to the /admin superadmins room). Tries to emit `configuration:updated` via
        req.app.get("io"), but server.js never calls app.set("io"), so nothing is emitted. The Kayod app reads these
        through the Kayod server's own public endpoint, not this one. Auth: adminAuth — no session / non-admin session
        -> 403 `{success:false,error:"Admin access required"}`; an admin account that is now deactivated, demoted or
        deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: documentId
          in: path
          required: true
          description: Legal document id.
          schema:
            $ref: '#/components/schemas/ConfigLegalDocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigLegalDocumentUpdate'
      responses:
        '200':
          description: Saved document (re-read, lean).
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
