  /api/reports/admin/combined:
    get:
      operationId: getAllCombinedReports
      tags:
        - Reports
      summary: Combined, normalized Flagged feed over reports and reportedposts
      description: >-
        Requires an authenticated admin session (authMiddleware + adminAuth): 401 without a session or when the admin
        account is no longer active/admin (session destroyed), 403 when the session role is not admin/superadmin.


        Reads both `reports` (source "report") and the legacy `reportedposts` (source "reported_post") in full,
        batch-resolves every referenced user (name email phoneNumber phoneNumberWithCountryCode userType accountStatus)
        and job (title description category budget budgetType paymentMethod location media createdAt status isDeleted
        isHidden) with two $in lookups, maps each row to one normalized shape (legacy statuses/reasons mapped to the
        canonical vocabulary, raw values kept in rawStatus/rawReason), merges, sorts and paginates in memory. Stats are
        counted from the filtered, normalized rows before pagination. There is no upper bound on limit and the whole
        filtered set is loaded on every call. Read-only.


        Filter notes: status/reason match the canonical value plus every legacy value that maps to it. reportType
        filters the stored Report.reportType, so legacy Report rows without one (shown as "job"/"other") are excluded by
        any reportType filter; reported_post rows are included only when reportType is absent or "job".
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - under_review
              - action_taken
              - dismissed
              - escalated
          description: >-
            Canonical status; legacy stored values that map to it are included (e.g. "open" also matches stored
            "pending"). Unvalidated: other values match literally.
        - name: reason
          in: query
          required: false
          schema:
            type: string
            enum:
              - spam
              - inappropriate_content
              - misleading_information
              - fake_job_posting
              - duplicate_posting
              - scam_or_fraud
              - discrimination
              - harassment
              - violence_or_threats
              - adult_content
              - copyright_violation
              - unsafe_work_conditions
              - payment_issues
              - other
              - unfinished_work
              - substandard_work
              - misconduct
              - fake_profile
              - threats
              - unsolicited_solicitation
              - inappropriate_behavior
              - fake_review
              - defamation
              - conflict_of_interest
              - unauthorized_charge
              - payment_dispute
          description: >-
            Canonical reason; legacy stored values that map to it are included (e.g. "scam_or_fraud" also matches "scam"
            and "fraud"). Unvalidated: other values match literally.
        - name: reportType
          in: query
          required: false
          schema:
            type: string
            enum:
              - job
              - user
              - message
              - conversation
              - review
              - payment
              - other
          description: Stored Report.reportType. Any value other than "job" also drops every reported_post row.
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - report
              - reported_post
          description: Restrict to one collection; absent or any other value reads both.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number; non-numeric or < 1 becomes 1.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 500
          description: Page size; non-numeric becomes 500, < 1 becomes 1. No maximum.
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            default: createdAt
          description: >-
            Any key of the normalized row (e.g. createdAt, updatedAt, reviewedAt, status, reason, reportType, source);
            rows missing the key fall back to createdAt. Compared with < / > in memory.
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: '"asc" sorts ascending; anything else descending.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always true on success.
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReportsCombinedReport'
                      stats:
                        $ref: '#/components/schemas/ReportsCombinedStats'
                      pagination:
                        allOf:
                          - $ref: '#/components/schemas/ReportsPagination'
                        description: total is at least 1 even when there are no rows.
                    required:
                      - reports
                      - stats
                      - pagination
                required:
                  - success
                  - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
