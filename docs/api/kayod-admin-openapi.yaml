        status:
          type: string
          description: Job status at report time.
        softLimitBudget:
          type: number
        budget:
          type: number
        budgetType:
          type: string
          description: Default `fixed`.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    DashboardReportedPost:
      type: object
      description: Fully populated ReportedPost (hydrated; toJSON virtuals add `id`). Nested refs are not populated.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        id:
          type: string
          description: 'Virtual: string form of `_id`.'
        jobId:
          $ref: '#/components/schemas/ObjectId'
        jobDetails:
          $ref: '#/components/schemas/DashboardReportedPostJobDetails'
        reportedByDetails:
          type: object
          properties:
            providerId:
              $ref: '#/components/schemas/ObjectId'
            providerName:
              type: string
            providerEmail:
              type: string
            providerUserType:
              type: string
            reportedAt:
              $ref: '#/components/schemas/DateTime'
        reportedBy:
          $ref: '#/components/schemas/ObjectId'
        jobPosterId:
          $ref: '#/components/schemas/ObjectId'
        reportedUserId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Reported user, if any.
          nullable: true
        reason:
          type: string
          description: Canonical report reason (legacy rows may still hold `scam`, `fraud`, `fake_job`).
          enum:
            - spam
            - inappropriate_content
            - misleading_information
            - fake_job_posting
            - duplicate_posting
            - scam_or_fraud
            - discrimination
            - harassment
            - violence_or_threats
            - adult_content
            - copyright_violation
            - unsafe_work_conditions
            - payment_issues
            - other
            - unfinished_work
            - substandard_work
            - misconduct
            - fake_profile
            - threats
            - unsolicited_solicitation
            - inappropriate_behavior
            - fake_review
            - defamation
            - conflict_of_interest
            - unauthorized_charge
            - payment_dispute
            - scam
            - fraud
            - fake_job
        comment:
          type: string
          description: Reporter comment (max 1000).
        status:
          type: string
          description: >-
            Canonical: open, under_review, action_taken, dismissed, escalated. Unmigrated legacy rows may hold pending,
            reviewed, resolved.
          enum:
            - open
            - under_review
            - action_taken
            - dismissed
            - escalated
            - pending
            - reviewed
            - resolved
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        adminNotes:
          type: string
          description: Max 1000.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    DashboardVerificationDocument:
      type: object
      properties:
        cloudinaryUrl:
          type: string
          description: Cloudinary URL of the uploaded file.
        publicId:
          type: string
          description: Cloudinary public id.
        uploadedAt:
          $ref: '#/components/schemas/DateTime'
        originalName:
          type: string
        type:
          type: string
          description: Document type label.
    DashboardCredentialVerification:
      type: object
      description: Fully populated CredentialVerification (no virtuals on this schema). Nested refs are not populated.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        faceVerification:
          description: 'Mixed: a single document object or an array of them.'
          oneOf:
            - $ref: '#/components/schemas/DashboardVerificationDocument'
            - type: array
              items:
                $ref: '#/components/schemas/DashboardVerificationDocument'
        validId:
          description: 'Mixed: a single document object or an array of them.'
          oneOf:
            - $ref: '#/components/schemas/DashboardVerificationDocument'
            - type: array
              items:
                $ref: '#/components/schemas/DashboardVerificationDocument'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/DashboardVerificationDocument'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - under_review
            - resubmission_requested
            - flagged
        submittedAt:
          $ref: '#/components/schemas/DateTime'
        reviewedAt:
          $ref: '#/components/schemas/DateTime'
        reviewedBy:
          $ref: '#/components/schemas/ObjectId'
        adminNotes:
          type: string
        rejectionReason:
          type: string
        verificationAttempts:
          type: integer
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    DashboardChatSupportMessage:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        senderId:
          $ref: '#/components/schemas/ObjectId'
        senderName:
          type: string
        senderType:
          type: string
          enum:
            - User
            - Admin
        message:
          type: string
          description: Empty string for image-only messages.
        imageUrl:
          type: string
