components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: admin.session.id
      description: express-session cookie set by POST /api/auth/login.
    serviceKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'Shared service key: SUPPORT_SERVICE_KEY, else KAYOD_API_KEY. Missing in production → 503.'
  schemas:
    ObjectId:
      type: string
      pattern: ^[a-fA-F0-9]{24}$
      description: MongoDB ObjectId as a 24-character hex string
      example: 6a4501c6a1b2c3d400000045
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 timestamp
    Error:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
          description: Human-readable message
        message:
          type: string
          description: Same text as `error`
        details:
          nullable: true
          description: Extra detail (validation errors, or the stack in development)
    AuditActionType:
      type: string
      description: >-
        ActivityLog.actionType — the keys of AUDIT_ACTIONS in Backend/app/constants/auditActions.js (the model enum is
        built from them; a write with any other value fails validation and the audit row is silently dropped). Sensitive
        actions: admin_created, admin_role_changed, admin_permissions_changed, admin_status_changed,
        admin_password_reset, audit_log_exported, user_restricted, user_suspended, user_banned, user_deleted,
        job_deleted, job_force_cancelled, dispute_resolved, transaction_completed, bulk_transaction_approval,
        report_deleted, settings_updated, job_category_deleted, profession_deleted, legal_document_updated,
        legal_document_reset.
      enum:
        - admin_login
        - admin_created
        - admin_updated
        - admin_role_changed
        - admin_permissions_changed
        - admin_status_changed
        - admin_password_reset
        - audit_log_exported
        - verification_approved
        - verification_rejected
        - user_verified
        - user_unverified
        - user_restricted
        - user_suspended
        - user_banned
        - user_unrestricted
        - user_deleted
        - job_status_changed
        - job_assigned
        - job_hidden
        - job_unhidden
        - job_deleted
        - job_restored
        - job_force_cancelled
        - dispute_resolved
        - transaction_completed
        - transaction_failed
        - bulk_transaction_approval
        - support_accepted
        - support_closed
        - support_reopened
        - report_reviewed
        - reports_bulk_reviewed
        - report_deleted
        - settings_updated
        - job_category_created
        - job_category_updated
        - job_category_deleted
        - profession_created
        - profession_updated
        - profession_deleted
        - profession_transferred
        - quick_access_updated
        - advertisement_created
        - advertisement_updated
        - advertisement_deleted
        - advertisements_reordered
        - legal_document_updated
        - legal_document_reset
    AuditGroupKey:
      type: string
      description: >-
        Catalog group: access = "Team & access", users = "Users", jobs = "Jobs", money = "Money", support = "Support",
        moderation = "Reports", config = "Configuration".
      enum:
        - access
        - users
        - jobs
        - money
        - support
        - moderation
        - config
    AuditTargetType:
      type: string
      description: ActivityLog.targetType (AUDIT_TARGET_TYPES).
      enum:
        - user
        - admin
        - transaction
        - support
        - verification
        - job
        - report
        - settings
        - job_category
        - profession
        - advertisement
        - legal_document
    AuditTargetModel:
      type: string
      description: ActivityLog.targetModel — the model targetId populates from via refPath (AUDIT_TARGET_MODELS).
      enum:
        - User
        - Transaction
        - ChatSupport
        - CredentialVerification
        - Job
        - Report
        - ReportedPost
        - JobCategory
        - Advertisement
        - LegalDocument
    AuditChange:
      type: object
      description: One field change. Values are whatever was stored (strings, numbers, booleans, objects, arrays, or null).
      properties:
        from:
          nullable: true
          description: Value before (any JSON type).
        to:
          nullable: true
          description: Value after (any JSON type).
    AuditMetadata:
      type: object
      description: >-
        Free-form ActivityLog.metadata (Mixed, defaults to {}). The keys below are the ones writers commonly set; each
        action writes its own subset and others may appear.
      properties:
        targetName:
          type: string
          description: Display name of the affected record at the time of the action.
          nullable: true
        changes:
          type: object
          description: Changed fields, keyed by field name.
          additionalProperties:
            $ref: '#/components/schemas/AuditChange'
        granted:
          type: array
          items:
            type: string
          description: Permission keys switched on (admin_permissions_changed, admin_created).
        revoked:
          type: array
          items:
            type: string
          description: Permission keys switched off (admin_permissions_changed).
        role:
          type: string
          description: 'admin_created: the new account''s userType.'
        accountStatus:
          type: string
          description: 'admin_created: the new account''s status.'
        location:
          type: string
          description: 'admin_login: location resolved from the IP.'
        count:
          type: integer
          description: 'Bulk / export rows: number of records handled.'
        total:
          type: integer
          description: 'audit_log_exported: rows matching the filters.'
        failed:
          type: integer
          description: 'bulk_transaction_approval: failures.'
        filters:
          type: object
          description: >-
            audit_log_exported: the query filters in force (adminId, group, actionType, sensitive, targetId, from, to,
            search — whichever were set).
          additionalProperties:
            type: string
        professionId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: 'profession_* rows: the profession subdocument id inside the JobCategory.'
        reports:
          type: array
          description: 'Bulk report triage: the reports touched.'
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/ObjectId'
              source:
                type: string
                enum:
                  - report
                  - reported_post
        reportIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: 'Older reported-posts bulk endpoint: ReportedPost ids touched.'
        userAgent:
          type: string
          description: 'Older rows: the browser, before userAgent became a top-level field.'
        reason:
          type: string
          description: Reason given for the action, when the action takes one.
          nullable: true
    AuditAdminRef:
      type: object
      description: ActivityLog.adminId populated with name email userType.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        userType:
          type: string
    AuditAdminDetailRef:
      type: object
      description: >-
        ActivityLog.adminId populated with name email userType accountStatus lastLogin (lastLogin is absent if the admin
        never signed in).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        userType:
          type: string
        accountStatus:
          type: string
          enum:
            - active
            - restricted
            - suspended
            - banned
            - deleted
        lastLogin:
          $ref: '#/components/schemas/DateTime'
    AuditPopulatedTarget:
      type: object
      description: >-
        targetId populated through refPath with `name email title subject description type` — only the fields the target
        model actually has are present (e.g. a User has name/email, a Job title/description, a ChatSupport subject, a
        Transaction type/description).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        title:
          type: string
        subject:
          type: string
        description:
          type: string
        type:
          type: string
    AuditLogBase:
      type: object
      description: 'ActivityLog document fields (lean). timestamps: createdAt/updatedAt.'
      required:
        - _id
        - actionType
        - description
        - createdAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        actionType:
          $ref: '#/components/schemas/AuditActionType'
        description:
          type: string
          description: Human-readable sentence written at log time.
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetModel:
          $ref: '#/components/schemas/AuditTargetModel'
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
        ipAddress:
          type: string
          description: Caller IP (x-forwarded-for first hop, x-real-ip, or req.ip). Absent on some rows.
        userAgent:
          type: string
          description: Caller User-Agent, truncated to 300 chars. Absent on older rows.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    AuditLogEntry:
      description: 'An audit row as listed: adminId and targetId populated.'
      allOf:
        - $ref: '#/components/schemas/AuditLogBase'
        - type: object
          properties:
            adminId:
              allOf:
                - $ref: '#/components/schemas/AuditAdminRef'
              nullable: true
              description: The acting admin; null if that User no longer exists.
            targetId:
              nullable: true
              description: >-
                Populated target; null when the target record no longer exists; a bare ObjectId when the row has no
                targetModel to populate from; absent when the row has no target.
              oneOf:
                - $ref: '#/components/schemas/AuditPopulatedTarget'
                - $ref: '#/components/schemas/ObjectId'
    AuditLogDetailRecord:
      description: 'The raw entry on the detail endpoint: adminId populated (with status and last login), targetId NOT populated.'
      allOf:
        - $ref: '#/components/schemas/AuditLogBase'
        - type: object
          properties:
            adminId:
              allOf:
                - $ref: '#/components/schemas/AuditAdminDetailRef'
              nullable: true
              description: The acting admin; null if that User no longer exists.
            targetId:
              $ref: '#/components/schemas/ObjectId'
    AuditLogListResponse:
      type: object
      required:
        - success
        - logs
        - total
        - page
        - limit
        - pages
        - hasMore
      properties:
        success:
          type: boolean
          enum:
            - true
        logs:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
          description: Newest first (createdAt desc, then _id desc).
        total:
          type: integer
          description: Entries matching the filters.
        page:
          type: integer
          description: Page served (after clamping).
        limit:
          type: integer
          description: Page size served (after clamping).
        pages:
          type: integer
          description: ceil(total / limit), at least 1.
        hasMore:
          type: boolean
          description: page * limit < total.
    AuditCatalogGroup:
      type: object
      required:
        - key
        - label
      properties:
        key:
          $ref: '#/components/schemas/AuditGroupKey'
        label:
          type: string
          enum:
            - Team & access
            - Users
            - Jobs
            - Money
            - Support
            - Reports
            - Configuration
    AuditCatalogAction:
      type: object
      required:
        - key
        - label
        - group
        - sensitive
      properties:
        key:
          $ref: '#/components/schemas/AuditActionType'
        label:
          type: string
          description: How the action reads in a list, e.g. "User banned".
        group:
          $ref: '#/components/schemas/AuditGroupKey'
        sensitive:
          type: boolean
          description: Changes someone's access, moves money, or changes what every user sees.
    AuditCatalogResponse:
      type: object
      required:
        - success
        - groups
        - actions
      properties:
        success:
          type: boolean
          enum:
            - true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AuditCatalogGroup'
          description: AUDIT_GROUPS in declaration order.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AuditCatalogAction'
          description: Every AUDIT_ACTIONS entry in declaration order.
    AuditTeamMember:
      type: object
      required:
        - _id
        - name
        - email
        - userType
        - accountStatus
        - lastLogin
        - lastActionAt
        - actions
        - logins
        - sensitive
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        userType:
          type: string
          enum:
            - admin
            - superadmin
            - finance
            - customer support
            - support
        accountStatus:
          type: string
          enum:
            - active
            - restricted
            - suspended
            - banned
            - deleted
        lastLogin:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: User.lastLogin, or null if never signed in.
        lastActionAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: Latest non-login entry EVER (ignores the from/to window); null if none.
        actions:
          type: integer
          description: Entries in the window, excluding admin_login.
        logins:
          type: integer
          description: admin_login entries in the window.
        sensitive:
          type: integer
          description: Sensitive entries in the window.
    AuditTeamResponse:
      type: object
      required:
        - success
        - team
        - total
        - page
        - limit
        - pages
        - totals
      properties:
        success:
          type: boolean
          enum:
            - true
        team:
          type: array
          items:
            $ref: '#/components/schemas/AuditTeamMember'
          description: The requested page of the filtered, sorted rows.
        total:
          type: integer
          description: Rows after adminId/search/activity filters (before paging).
        page:
          type: integer
          description: Page served.
        limit:
          type: integer
          description: Page size served.
        pages:
          type: integer
          description: ceil(total / limit), at least 1.
        totals:
          type: object
          description: Across EVERY admin account for the window — unaffected by adminId, search, activity or paging.
          required:
            - admins
            - actions
            - logins
            - sensitive
            - activeAdmins
          properties:
            admins:
              type: integer
              description: Admin accounts (any admin userType, any status).
            actions:
              type: integer
              description: Sum of non-login entries.
            logins:
              type: integer
              description: Sum of admin_login entries.
            sensitive:
              type: integer
              description: Sum of sensitive entries.
            activeAdmins:
              type: integer
              description: Admins with at least one non-login entry in the window.
    AuditFact:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          description: e.g. "Status", "Email", "Budget".
        value:
          type: string
          description: Always stringified; empty facts are omitted.
    AuditTargetDescription:
      type: object
      description: What the entry was about, read LIVE from the target model now (not as it was at log time).
      required:
        - type
        - kind
        - id
        - label
        - exists
        - facts
      properties:
        type:
          $ref: '#/components/schemas/AuditTargetType'
        kind:
          type: string
          description: Human label for targetType, e.g. "Admin account", "Support ticket", "Legal document".
        id:
          type: string
          nullable: true
          description: targetId as a string, or null when the row has none.
        label:
          type: string
          nullable: true
          description: >-
            Current name/title/subject of the record (e.g. "Top up · ₱500.00" for a transaction), falling back to
            metadata.targetName.
        exists:
          type: boolean
          nullable: true
          description: >-
            true = the record still exists; false = it was deleted (for a profession: no longer in its category); null =
            not checked (no/invalid id, or a targetModel with no live lookup, e.g. settings).
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AuditFact'
          description: >-
            A few current facts; empty when not looked up or the record is gone. Dates are formatted like "Oct 12,
            2026", money as ₱.
    AuditBulkItem:
      type: object
      required:
        - id
        - kind
        - label
        - detail
        - status
        - exists
      properties:
        id:
          type: string
        kind:
          type: string
          description: >-
            "Job post report" (ReportedPost) or "<Report type> report" (e.g. "User report", "Payment report"); "Report"
            when the record is gone.
        label:
          type: string
          description: Job title or reported user's name; "Report no longer exists" when gone.
        detail:
          type: string
          nullable: true
          description: Humanized reason.
        status:
          type: string
          nullable: true
          description: Current status (legacy statuses mapped), humanized.
        exists:
          type: boolean
    AuditBulk:
      type: object
      description: >-
        For bulk report entries (metadata.reports or metadata.reportIds): the reports the batch touched, as they are
        now.
      required:
        - kind
        - total
        - items
      properties:
        kind:
          type: string
          enum:
            - report
        total:
          type: integer
          description: How many records the entry covers.
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AuditBulkItem'
          description: The first 50 refs with a valid id.
    AuditEntrySummary:
      type: object
      required:
        - _id
        - actionType
        - description
        - createdAt
        - admin
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        actionType:
          $ref: '#/components/schemas/AuditActionType'
        description:
          type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        admin:
          type: object
          nullable: true
          description: Who did it; null if that User no longer exists.
          required:
            - _id
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
    AuditLogDetailResponse:
      type: object
      required:
        - success
        - log
        - action
        - origin
        - target
        - bulk
        - aboutTarget
        - aboutTargetTotal
        - adminHistory
      properties:
        success:
          type: boolean
          enum:
            - true
        log:
          $ref: '#/components/schemas/AuditLogDetailRecord'
        action:
          type: object
          required:
            - key
            - label
            - group
            - groupLabel
            - sensitive
          properties:
            key:
              $ref: '#/components/schemas/AuditActionType'
            label:
              type: string
              description: Catalog label, or the humanized key if the action is no longer in the catalog.
            group:
              allOf:
                - $ref: '#/components/schemas/AuditGroupKey'
              nullable: true
            groupLabel:
              type: string
              nullable: true
            sensitive:
              type: boolean
        origin:
          type: object
          required:
            - ipAddress
            - location
            - userAgent
          properties:
            ipAddress:
              type: string
              nullable: true
            location:
              type: string
              nullable: true
              description: >-
                geoip-lite lookup of the IP: "City, CC", "CC", "Unknown" or "Local Development"; null when there is no
                IP.
            userAgent:
              type: string
              nullable: true
              description: log.userAgent, else metadata.userAgent, else null.
        target:
          allOf:
            - $ref: '#/components/schemas/AuditTargetDescription'
          nullable: true
          description: null when the entry has no targetType.
        bulk:
          allOf:
            - $ref: '#/components/schemas/AuditBulk'
          nullable: true
          description: null unless the entry carries metadata.reports / metadata.reportIds.
        aboutTarget:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AuditEntrySummary'
          description: Up to 10 other entries with the same targetId, newest first; [] when no targetId.
        aboutTargetTotal:
          type: integer
          description: Count of all other entries with the same targetId (0 when no targetId).
        adminHistory:
          type: object
          required:
            - total
            - position
          description: >-
            Where this entry sits in its admin's history, so the UI can open GET /activity-logs?adminId=… on the right
            page.
          properties:
            total:
              type: integer
              description: All entries by this admin (0 when the admin no longer exists).
            position:
              type: integer
              description: 0-based index of this entry in the admin's newest-first history (createdAt desc, _id desc).
    AdminsAdminUserType:
      type: string
      description: The userTypes that count as admin accounts.
      enum:
        - admin
        - superadmin
        - finance
        - customer support
        - support
    AdminsUserTypeInput:
      type: string
      description: >-
        Accepted by the User schema enum. The handlers do not restrict it further: "client"/"provider" are accepted and
        turn the account into a non-admin (it then disappears from these endpoints). Only admin/superadmin can pass
        adminAuth.
      enum:
        - client
        - provider
        - admin
        - superadmin
        - finance
        - customer support
        - support
    AdminsAccountStatus:
      type: string
      enum:
        - active
        - restricted
        - suspended
        - banned
        - deleted
    AdminsPermissions:
      type: object
      description: >-
        User.permissions — which admin pages the account may open. Schema defaults: all true except settings (false).
        Unknown keys are dropped (strict schema); values are cast to Boolean ("true"/"false"/1/0 accepted, anything else
        fails validation → 400).
      properties:
        dashboard:
          type: boolean
        users:
          type: boolean
        jobs:
          type: boolean
        transactions:
          type: boolean
        verifications:
          type: boolean
        support:
          type: boolean
        activity:
          type: boolean
        flagged:
          type: boolean
        settings:
          type: boolean
    AdminsListItem:
      type: object
      required:
        - _id
        - uid
        - fullName
        - email
        - role
        - permissions
        - accountStatus
        - createdAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        uid:
          type: string
          pattern: ^KYD-[0-9A-F]{6}$
