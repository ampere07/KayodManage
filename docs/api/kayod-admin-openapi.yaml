            reportedUserId:
              allOf:
                - $ref: '#/components/schemas/ReportsUserRef'
              nullable: true
              description: Null/absent for report types that do not require one.
            reviewedBy:
              allOf:
                - $ref: '#/components/schemas/ReportsUserRef'
              nullable: true
    ReportsMyReport:
      description: 'Report document as returned by GET /api/reports/my: only reportedUserId is populated.'
      allOf:
        - $ref: '#/components/schemas/ReportsReportFields'
        - type: object
          properties:
            reportedBy:
              $ref: '#/components/schemas/ObjectId'
            reportedUserId:
              allOf:
                - $ref: '#/components/schemas/ReportsUserRef'
              nullable: true
            reviewedBy:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
              nullable: true
    ReportsStats:
