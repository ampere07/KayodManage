          type: integer
        dismissed:
          type: array
          items:
            $ref: '#/components/schemas/AdminMiscDismissedAlert'
    UsersRestrictionDetails:
      type: object
      description: >-
        Present only while accountStatus is not active; removed ($unset) on unrestrict or expiry. Each penalty endpoint
        replaces this object wholesale.
      properties:
        type:
          type: string
          enum:
            - restricted
            - suspended
            - banned
            - deleted
          description: Which penalty is in force (mirrors accountStatus).
        reason:
          type: string
          description: Why. For /restrict a blank reason is stored as "Account restricted by admin".
        restrictedBy:
          $ref: '#/components/schemas/ObjectId'
        restrictedAt:
          $ref: '#/components/schemas/DateTime'
        suspendedUntil:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Only set by /suspend (equals expiresAt).
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: >-
            When the penalty lapses. Absent = indefinite. Lapsed penalties are lifted by the hourly restriction
            scheduler (minute 0), which sets accountStatus active, isRestricted false and unsets restrictionDetails — so
            a lapsed penalty can remain visible for up to ~1 hour.
        appealAllowed:
          type: boolean
          description: false only for soft-deleted accounts.
    UsersVerificationDocument:
      type: object
      description: An uploaded verification file.
      properties:
        cloudinaryUrl:
          type: string
        publicId:
          type: string
        uploadedAt:
          $ref: '#/components/schemas/DateTime'
        originalName:
          type: string
        type:
          type: string
    UsersUserRecord:
      type: object
      description: >-
        A raw `users` document read with `.lean()`: every stored field is returned (including fields the Kayod server
        writes that the admin schema does not declare), except `password` (schema `select: false`). Mongoose virtuals
        (`isCurrentlyRestricted`, `restrictionStatus`) are NOT included.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
          description: Lower-cased.
          format: email
        phone:
          type: string
        phoneNumber:
          type: string
        userType:
          type: string
          enum:
            - client
            - provider
            - admin
            - superadmin
            - finance
            - customer support
            - support
        location:
          type: string
        categories:
          type: array
          items:
            type: string
          description: Profession/category names (provider).
        jobCategories:
          description: 'Mixed: written by the Kayod server, a string or an array of strings in practice.'
        category:
          type: string
        profileImage:
          type: string
          nullable: true
        profileImagePublicId:
          type: string
          nullable: true
        isVerified:
          type: boolean
          description: Admin "verified" flag. Documents may lack it entirely (treated as unverified).
        credentialVerificationStatus:
          type: string
          enum:
            - none
            - pending
            - approved
            - rejected
            - resubmission_requested
            - flagged
        jobVerificationStatus:
          type: array
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              category:
                type: string
              status:
                type: string
                enum:
                  - none
                  - pending
                  - approved
                  - rejected
                  - expired
                  - resubmission_requested
                  - flagged
              documents:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      $ref: '#/components/schemas/ObjectId'
                    cloudinaryUrl:
                      type: string
                    publicId:
                      type: string
                    uploadedAt:
                      $ref: '#/components/schemas/DateTime'
                    originalName:
                      type: string
              reviewedAt:
                $ref: '#/components/schemas/DateTime'
              reviewedBy:
                $ref: '#/components/schemas/ObjectId'
              adminNotes:
                type: string
          description: Per-profession credential state.
        accountStatus:
          type: string
          enum:
            - active
            - restricted
            - suspended
            - banned
            - deleted
          description: Missing on some legacy documents (treated as active).
        faultFindings:
          type: array
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              jobId:
                $ref: '#/components/schemas/ObjectId'
              role:
                type: string
                enum:
                  - client
                  - provider
              faultParty:
                type: string
                enum:
                  - client
                  - provider
                  - both
              findingReason:
                type: string
                enum:
                  - no_show
                  - late_cancel
                  - access_failure
                  - emergency
                  - other
              notes:
                type: string
                nullable: true
              sanctioned:
                type: boolean
              decidedBy:
                $ref: '#/components/schemas/ObjectId'
              decidedAt:
                $ref: '#/components/schemas/DateTime'
          description: Confirmed fault findings from dispute rulings.
        restrictionDetails:
          $ref: '#/components/schemas/UsersRestrictionDetails'
        isRestricted:
          type: boolean
          description: Legacy flag; true for restricted, suspended, banned and soft-deleted accounts.
        ratings:
          type: number
