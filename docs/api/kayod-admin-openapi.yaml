    UsersWalletSummary:
      type: object
      description: 'Copied from the user''s `wallets` document; when the user has no wallet: 0/0/0, "PHP", false, false.'
      required:
        - balance
        - availableBalance
        - heldBalance
        - currency
        - isActive
        - isVerified
      properties:
        balance:
          type: number
        availableBalance:
          type: number
        heldBalance:
          type: number
        currency:
          type: string
          description: Defaults to "PHP".
        isActive:
          type: boolean
        isVerified:
          type: boolean
    UsersFeeSummary:
      type: object
      description: >-
        A FeeRecord owed by the user as provider. NOTE: the lookup filters on `provider` (a virtual) instead of the
        stored `providerId`, so records written by the Kayod server never match and this array is empty in practice.
      required:
        - _id
        - isPaid
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
        dueDate:
          $ref: '#/components/schemas/DateTime'
        isPaid:
          type: boolean
          description: status === "paid".
        status:
          type: string
          enum:
            - pending
            - paid
            - overdue
            - waived
            - cancelled
        paymentMethod:
          type: string
          enum:
            - wallet
            - xendit
            - bank_transfer
        createdAt:
          $ref: '#/components/schemas/DateTime'
    UsersListFinancials:
      type: object
      description: Per-row money totals (all-time, uncapped). All zero when the user has no matching rows.
      required:
        - topUpTotal
        - topUpPending
        - cashOutTotal
        - cashOutPending
      properties:
        topUpTotal:
          type: number
          description: Sum of completed xendit_topup/wallet_topup transactions to the user (amount).
        topUpPending:
          type: number
          description: Same, for statuses pending/processing/held/escrowed.
        cashOutTotal:
          type: number
          description: >-
            Completed cash-outs: withdrawals documents (netAmount, else amount) plus withdrawal-type transactions that
            no withdrawal document links to (amount).
        cashOutPending:
          type: number
          description: >-
            Unsettled cash-outs: withdrawals documents with any status other than completed/failed/cancelled, plus
            unlinked withdrawal transactions with status pending/processing/held/escrowed.
    UsersListItem:
      allOf:
        - $ref: '#/components/schemas/UsersUserRecord'
        - type: object
          required:
            - wallet
            - fees
            - financials
          properties:
            wallet:
              $ref: '#/components/schemas/UsersWalletSummary'
            fees:
              type: array
              items:
                $ref: '#/components/schemas/UsersFeeSummary'
              description: Always [] in practice (see UsersFeeSummary).
            financials:
              $ref: '#/components/schemas/UsersListFinancials'
    UsersAuditReviewer:
      type: object
      description: Populated reviewer (name, email).
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
    UsersVerificationAudit:
      type: object
      description: >-
        A `credentialverifications` document (lean). If the user isVerified, the most recently reviewed approved record;
        otherwise (or if none is approved) the most recently submitted record of any status.
      required:
        - _id
        - userId
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        faceVerification:
          oneOf:
            - $ref: '#/components/schemas/UsersVerificationDocument'
            - type: array
              items:
                $ref: '#/components/schemas/UsersVerificationDocument'
          description: Single document or an array of documents.
        validId:
          oneOf:
            - $ref: '#/components/schemas/UsersVerificationDocument'
            - type: array
              items:
                $ref: '#/components/schemas/UsersVerificationDocument'
          description: Single document or an array of documents.
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/UsersVerificationDocument'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - under_review
            - resubmission_requested
            - flagged
        submittedAt:
          $ref: '#/components/schemas/DateTime'
        reviewedAt:
          $ref: '#/components/schemas/DateTime'
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/UsersAuditReviewer'
          nullable: true
          description: Populated; null when the reviewer no longer exists, absent when never reviewed.
        adminNotes:
          type: string
        rejectionReason:
          type: string
        verificationAttempts:
          type: integer
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    UsersUserDetail:
      allOf:
        - $ref: '#/components/schemas/UsersUserRecord'
        - type: object
          required:
            - wallet
            - fees
            - verificationAudit
          properties:
            wallet:
              $ref: '#/components/schemas/UsersWalletSummary'
            fees:
              type: array
              items:
                $ref: '#/components/schemas/UsersFeeSummary'
              description: Always [] in practice (see UsersFeeSummary).
            verificationAudit:
              allOf:
                - $ref: '#/components/schemas/UsersVerificationAudit'
              nullable: true
              description: null when the user has never submitted credentials.
      description: >-
        Output of userService.getUserById: the user document plus wallet, fees and verificationAudit. Also returned by
        every PATCH on this tag (re-read after the write).
    UsersPagination:
      type: object
      required:
        - page
        - limit
        - total
        - pages
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Matching documents.
        pages:
          type: integer
          description: Math.ceil(total / limit). 0 when total is 0 on GET /api/users; at least 1 on the jobs and reviews endpoints.
    UsersListResponse:
      type: object
      description: No `success` flag on this response.
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UsersListItem'
          description: Sorted by createdAt descending.
        pagination:
          $ref: '#/components/schemas/UsersPagination'
    UsersCountCell:
      type: object
      required:
        - userType
        - accountStatus
        - isVerified
        - count
      properties:
        userType:
          type: string
          enum:
            - client
            - provider
        accountStatus:
          type: string
          enum:
            - active
            - restricted
            - suspended
            - banned
            - deleted
          description: A missing/null stored accountStatus is reported as "active".
        isVerified:
          type: boolean
          description: true only when the stored flag is exactly true.
        count:
          type: integer
    UsersCountsResponse:
      type: object
      required:
        - success
        - cells
      properties:
        success:
          type: boolean
          enum:
            - true
        cells:
          type: array
          items:
            $ref: '#/components/schemas/UsersCountCell'
          description: >-
            One cell per stored (userType, accountStatus, isVerified) combination. Grouping happens BEFORE the
            missing→"active"/false normalisation, so two cells can carry the same normalised key (e.g. stored
            accountStatus missing vs "active"); consumers must sum matching cells, not look one up. Combinations with no
            users are absent.
    UsersActivityJobEvent:
      type: object
      description: >-
        A job the user posted (userId) or was assigned to (assignedToId); timestamp = job createdAt. Includes
        soft-deleted and hidden jobs.
      required:
        - id
        - type
        - action
        - title
        - timestamp
        - targetId
        - targetType
      properties:
        id:
          type: string
          description: '"job-<jobId>".'
        type:
          type: string
          enum:
            - job
        action:
          type: string
          enum:
            - job_posted
            - job_assigned
        title:
          type: string
          enum:
            - Posted a job
            - Assigned to a job
        description:
          type: string
          description: The job title.
        amount:
          type: number
          description: 'Job value: budget if > 0, else agreedPrice, else paidAmount, else softLimitBudget; null when that is 0.'
          nullable: true
        status:
          type: string
          description: Job status.
        category:
          type: string
          nullable: true
        targetId:
          $ref: '#/components/schemas/ObjectId'
        targetType:
          type: string
          enum:
            - job
        timestamp:
          $ref: '#/components/schemas/DateTime'
    UsersActivityTransactionEvent:
      type: object
      description: >-
        A transaction where the user is from/to (fromUserId|fromUser|toUserId|toUser). Withdrawal transactions linked
        from a withdrawals document are excluded (shown as a withdrawal event instead).
      required:
        - id
        - type
        - action
        - title
        - timestamp
        - direction
        - targetId
        - targetType
        - jobId
      properties:
        id:
          type: string
          description: '"tx-<transactionId>".'
        type:
          type: string
          enum:
            - money
        action:
          type: string
          description: '"top_up" for xendit_topup/wallet_topup, "cash_out" for withdrawal, otherwise the raw transaction type.'
        title:
          type: string
          description: '"Topped up wallet", "Cashed out", or "Received — <Type>" / "Paid — <Type>".'
        description:
          type: string
          description: Transaction description.
        amount:
          type: number
        direction:
          type: string
          enum:
            - in
            - out
        status:
          type: string
          description: Transaction status.
        targetId:
          $ref: '#/components/schemas/ObjectId'
        targetType:
          type: string
          enum:
            - transaction
        jobId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        timestamp:
          $ref: '#/components/schemas/DateTime'
    UsersActivityWithdrawalEvent:
      type: object
      description: A document from the raw `withdrawals` collection.
      required:
        - id
        - type
        - action
        - title
        - timestamp
        - direction
        - targetId
        - targetType
      properties:
        id:
          type: string
          description: '"wd-<withdrawalId>".'
        type:
          type: string
          enum:
            - money
        action:
          type: string
          enum:
            - cash_out
        title:
          type: string
          enum:
            - Cashed out
        description:
          type: string
          description: '"<destination> · <accountNumber>" (whichever exist), else "Withdrawal".'
        amount:
          type: number
          description: netAmount, else amount.
        direction:
          type: string
          enum:
            - out
        status:
          type: string
          description: Withdrawal status (pending, processing, completed, failed, cancelled).
        targetId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: The linked transaction, or null.
        targetType:
          type: string
          enum:
            - transaction
            - withdrawal
          description: '"transaction" when a linked transaction exists, else "withdrawal" (nothing to open).'
        timestamp:
          $ref: '#/components/schemas/DateTime'
    UsersActivityQuoteEvent:
      type: object
