        - $ref: '#/components/schemas/TransactionsJobPartyUser'
        - $ref: '#/components/schemas/TransactionsUnknownParty'
    TransactionsJobSummary:
      type: object
      description: >-
        A populated Job (lean). Select is `title category categoryName professionName icon userId assignedToId budget`
        with userId/assignedToId populated; the detail endpoint also selects `description`. In the top-up branch of
        PATCH /status only `title category categoryName professionName icon` are selected (userId/assignedToId/budget
        absent).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
