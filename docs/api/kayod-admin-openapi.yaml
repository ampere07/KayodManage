  /api/users/counts:
    get:
      operationId: getUserCounts
      tags:
        - Users
      summary: Client/provider counts by account status and verification
      description: >-
        One aggregation over `users` (userType client/provider only) grouped by (userType, accountStatus, isVerified),
        under the same `search` and `profession` filters as the list. The Users page derives every card and tab number
        by summing these cells. Read-only.


