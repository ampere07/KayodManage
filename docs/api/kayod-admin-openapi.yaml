          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Configurations
      operationId: updateJobPostingSettings
      summary: Update job posting & fee settings
      description: >-
        Partial update of the singleton (seeded first if missing). Numeric fields are coerced with Number() and must be
        finite and >= 0; cross-field rules are then checked on the merged values (see ConfigJobPostingSettingsUpdate)
        and the first failure is a 400 with a field-specific message; booleans are coerced with Boolean(). Sets
        updatedBy = session uid || email || "unknown" and saves (schema bounds -> 400 ValidationError). These values are
        read by the Kayod server for fees, payouts and restrictions. Writes an ActivityLog audit row `settings_updated`
        with every changed field's from/to, only if something changed (non-fatal; logActivity also emits `activity:new`
        to the /admin superadmins room). The handler also tries to emit `configuration:updated` on the /admin namespace,
        but configurationsController captures `io` at module load via a circular `require("../../server")` (server.js
        has not set module.exports yet), so `io` is always undefined and no event is sent. Auth: adminAuth — no session
        / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an admin account that is now
        deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigJobPostingSettingsUpdate'
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema:
                type: object
