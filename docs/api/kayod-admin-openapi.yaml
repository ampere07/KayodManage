openapi: 3.0.3
info:
  title: Kayod Admin API
  version: 1.0.0
  description: >-
    The KayodManage admin backend (Express 4, `Backend/`). Every route the server registers is documented here,
    including the public endpoints the Kayod mobile app reads and the service-to-service callbacks kayod/server makes.


    **Authentication.** Admin routes use the session cookie `admin.session.id`, set by `POST /api/auth/login` (24-hour
    lifetime, httpOnly; `secure` + `SameSite=None` in production). `x-access` on each operation says which guard
    applies: `public`, `session` (any signed-in session), `admin` (active admin or superadmin, re-checked on every
    request), `superadmin`, or `service` (header `x-api-key` from kayod/server).


    **Status codes from the guards.** With no session at all, admin and superadmin routes answer **403** "Admin access
    required". **401** means the session belonged to an account that is no longer an active admin; the session is
    destroyed.


    **Errors.** Error bodies carry `success: false` and the same text in both `error` and `message`.


    **Mounts.** The configurations router is mounted twice, at `/api/configurations` and `/api/admin/configurations`;
    both are listed.
servers:
  - url: http://localhost:5000
    description: Local development (PORT defaults to 5000)
tags:
  - name: Auth
    description: Admin sign-in and session
  - name: System
    description: Health and debug
  - name: Dashboard
    description: Dashboard numbers, charts and alerts
  - name: Users
    description: Customer and provider accounts
  - name: Jobs
    description: Job moderation, cancellations and dispute rulings
  - name: Transactions
    description: Money movements, refunds and top-ups
  - name: Verifications
    description: Provider credential and face verification
  - name: Legacy reports
    description: The older reported-posts endpoints under /api/admin
  - name: Reports
    description: User reports from both report collections
  - name: Support
    description: Support chats, and the callbacks kayod/server makes
  - name: Audit log
    description: Superadmin audit log
  - name: Admin accounts
    description: Superadmin management of admin accounts
  - name: Admin
    description: Alerts, admin stats, top-up approval and debug routes
  - name: Configurations
    description: Job categories, professions, job-posting settings, legal documents and ads
paths:
  /api/admin/activity-logs:
    get:
      operationId: getActivityLogs
      tags:
        - Audit log
      summary: List audit-log entries (filtered, server-paged)
      description: >-
        Reads ActivityLog with the buildLogQuery filters, newest first (createdAt desc, _id desc as tie-break so pages
        never overlap), and populates adminId (name email userType) and targetId (via targetModel refPath; name email
        title subject description type). Read-only. Access: requireSuperAdmin (adminAuth first — session role must be
        admin/superadmin and the account must still be active with an admin role, else 401 and the session is destroyed;
        no admin session is a 403 "Admin access required"; a non-superadmin is a 403 "Only superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      parameters:
        - name: adminId
          in: query
          required: false
          description: Only entries by this admin (ActivityLog.adminId). Invalid ObjectId is a 400 "Invalid adminId".
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: group
          in: query
          required: false
          description: >-
            Only actions in this catalog group (see /activity-logs/catalog). Ignored when `actionType` is set (and not
            "all"). "all" or empty = no group filter. Not validated: an unknown group matches no entries.
          schema:
            type: string
            enum:
              - all
              - access
              - users
              - jobs
              - money
              - support
              - moderation
              - config
        - name: actionType
          in: query
          required: false
          description: >-
            Only this one action. Takes precedence over `group`. "all" or empty = no action filter. Not validated: an
            unknown value matches no entries.
          schema:
            type: string
            enum:
              - all
              - admin_login
              - admin_created
              - admin_updated
              - admin_role_changed
              - admin_permissions_changed
              - admin_status_changed
              - admin_password_reset
              - audit_log_exported
              - verification_approved
              - verification_rejected
              - user_verified
              - user_unverified
              - user_restricted
              - user_suspended
              - user_banned
              - user_unrestricted
              - user_deleted
              - job_status_changed
              - job_assigned
              - job_hidden
              - job_unhidden
              - job_deleted
              - job_restored
              - job_force_cancelled
              - dispute_resolved
              - transaction_completed
              - transaction_failed
              - bulk_transaction_approval
              - support_accepted
              - support_closed
              - support_reopened
              - report_reviewed
              - reports_bulk_reviewed
              - report_deleted
              - settings_updated
              - job_category_created
              - job_category_updated
              - job_category_deleted
              - profession_created
              - profession_updated
              - profession_deleted
              - profession_transferred
              - quick_access_updated
              - advertisement_created
              - advertisement_updated
              - advertisement_deleted
              - advertisements_reordered
              - legal_document_updated
              - legal_document_reset
        - name: sensitive
          in: query
          required: false
          description: >-
            Exactly "true" narrows to sensitive actions (intersected with the group/actionType filter if any). Any other
            value is ignored.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: targetType
          in: query
          required: false
          description: 'Exact match on ActivityLog.targetType. Not validated: other values match nothing.'
          schema:
            type: string
            enum:
              - user
              - admin
              - transaction
              - support
              - verification
              - job
              - report
              - settings
              - job_category
              - profession
              - advertisement
              - legal_document
        - name: targetId
          in: query
          required: false
          description: Only entries about this record (ActivityLog.targetId). Invalid ObjectId is a 400 "Invalid targetId".
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: from
          in: query
          required: false
          description: >-
            Entries with createdAt >= this instant (anything `new Date()` parses; an unparseable value is a 400 "Invalid
            date …").
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: >-
            Entries with createdAt <= this instant (inclusive; a date-only value means midnight UTC at the START of that
            day). Unparseable is a 400.
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: >-
            Trimmed, regex-escaped, case-insensitive substring match against the entry description, metadata.targetName,
            OR the acting admin's name/email (admins of any admin userType). Blank is ignored.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 1-based page. Non-numeric or < 1 becomes 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1–100. Missing, 0 or non-numeric becomes 25; negative becomes 1.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/activity-logs/{logId}:
    get:
      operationId: getActivityLogDetail
      tags:
        - Audit log
      summary: Everything about one audit entry
      description: >-
        Loads the entry (adminId populated with name email userType accountStatus lastLogin) and adds: the catalog
        `action` info; `origin` (IP, geoip location, user agent); `target` — the affected record read LIVE now from its
        model (User, Job, Transaction, ChatSupport, CredentialVerification, Report/ReportedPost, JobCategory incl.
        profession subdocs, Advertisement, LegalDocument) with a label, exists flag and a few facts; `bulk` — for bulk
        report entries, up to 50 touched reports with their current status; `aboutTarget` — up to 10 other entries about
        the same targetId plus `aboutTargetTotal`; and `adminHistory` — this admin's total entries and this entry's
        0-based position in their newest-first history (for paging GET /activity-logs?adminId=). Read-only. Registered
        after the fixed /catalog, /team and /export paths. Access: requireSuperAdmin (adminAuth first — session role
        must be admin/superadmin and the account must still be active with an admin role, else 401 and the session is
        destroyed; no admin session is a 403 "Admin access required"; a non-superadmin is a 403 "Only superadmins can do
        this").
      security:
        - sessionCookie: []
      x-access: superadmin
      parameters:
        - name: logId
          in: path
          required: true
          description: ActivityLog _id. Invalid ObjectId is a 400 "Invalid logId".
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: The entry with its context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/activity-logs/catalog:
    get:
      operationId: getAuditCatalog
      tags:
        - Audit log
      summary: The catalog of loggable actions and their groups
      description: >-
        Returns the static AUDIT_GROUPS and AUDIT_ACTIONS from constants/auditActions.js (no DB access). The single
        source of action labels, groups and the sensitive flag. Access: requireSuperAdmin (adminAuth first — session
        role must be admin/superadmin and the account must still be active with an admin role, else 401 and the session
        is destroyed; no admin session is a 403 "Admin access required"; a non-superadmin is a 403 "Only superadmins can
        do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      responses:
        '200':
          description: Groups and actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/activity-logs/export:
    get:
      operationId: exportActivityLogs
      tags:
        - Audit log
      summary: Download the filtered audit log as CSV
      description: >-
        Same filters as GET /activity-logs (no paging): newest first, at most 5000 rows. CSV columns: When (ISO), Admin,
        Admin email, Role, Action (catalog label), Area (group label), Sensitive (Yes/No), What happened, Affected,
        Changes ("field: from → to; …"), IP address, Browser. Every cell is double-quoted with quotes doubled; cells
        starting with = + - @ tab or CR get a leading apostrophe (formula-injection guard). Rows joined with CRLF; body
        starts with a UTF-8 BOM. Side effect: writes an `audit_log_exported` (sensitive) ActivityLog row with metadata
        {count, total, filters} BEFORE responding (filters records adminId, group, actionType, sensitive, targetId,
        from, to, search — not targetType). Each audit row written also emits socket `activity:new` {logId, actionType}
        to the /admin namespace room `superadmins`. Audit writes are non-fatal: a failed write is logged server-side and
        the request still succeeds. Also sets Access-Control-Expose-Headers: Content-Disposition, X-Export-Count,
        X-Export-Total. Access: requireSuperAdmin (adminAuth first — session role must be admin/superadmin and the
        account must still be active with an admin role, else 401 and the session is destroyed; no admin session is a
        403 "Admin access required"; a non-superadmin is a 403 "Only superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      parameters:
        - name: adminId
          in: query
          required: false
          description: Only entries by this admin (ActivityLog.adminId). Invalid ObjectId is a 400 "Invalid adminId".
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: group
          in: query
          required: false
          description: >-
            Only actions in this catalog group (see /activity-logs/catalog). Ignored when `actionType` is set (and not
            "all"). "all" or empty = no group filter. Not validated: an unknown group matches no entries.
          schema:
            type: string
            enum:
              - all
              - access
              - users
              - jobs
              - money
              - support
              - moderation
              - config
        - name: actionType
          in: query
          required: false
          description: >-
            Only this one action. Takes precedence over `group`. "all" or empty = no action filter. Not validated: an
            unknown value matches no entries.
          schema:
            type: string
            enum:
              - all
              - admin_login
              - admin_created
              - admin_updated
              - admin_role_changed
              - admin_permissions_changed
              - admin_status_changed
              - admin_password_reset
              - audit_log_exported
              - verification_approved
              - verification_rejected
              - user_verified
              - user_unverified
              - user_restricted
              - user_suspended
              - user_banned
              - user_unrestricted
              - user_deleted
              - job_status_changed
              - job_assigned
              - job_hidden
              - job_unhidden
              - job_deleted
              - job_restored
              - job_force_cancelled
              - dispute_resolved
              - transaction_completed
              - transaction_failed
              - bulk_transaction_approval
              - support_accepted
              - support_closed
              - support_reopened
              - report_reviewed
              - reports_bulk_reviewed
              - report_deleted
              - settings_updated
              - job_category_created
              - job_category_updated
              - job_category_deleted
              - profession_created
              - profession_updated
              - profession_deleted
              - profession_transferred
              - quick_access_updated
              - advertisement_created
              - advertisement_updated
              - advertisement_deleted
              - advertisements_reordered
              - legal_document_updated
              - legal_document_reset
        - name: sensitive
          in: query
          required: false
          description: >-
            Exactly "true" narrows to sensitive actions (intersected with the group/actionType filter if any). Any other
            value is ignored.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: targetType
          in: query
          required: false
          description: 'Exact match on ActivityLog.targetType. Not validated: other values match nothing.'
          schema:
            type: string
            enum:
              - user
              - admin
              - transaction
              - support
              - verification
              - job
              - report
              - settings
              - job_category
              - profession
              - advertisement
              - legal_document
        - name: targetId
          in: query
          required: false
          description: Only entries about this record (ActivityLog.targetId). Invalid ObjectId is a 400 "Invalid targetId".
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: from
          in: query
          required: false
          description: >-
            Entries with createdAt >= this instant (anything `new Date()` parses; an unparseable value is a 400 "Invalid
            date …").
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: >-
            Entries with createdAt <= this instant (inclusive; a date-only value means midnight UTC at the START of that
            day). Unparseable is a 400.
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: >-
            Trimmed, regex-escaped, case-insensitive substring match against the entry description, metadata.targetName,
            OR the acting admin's name/email (admins of any admin userType). Blank is ignored.
          schema:
            type: string
      responses:
        '200':
          description: 'The CSV file (Content-Type: text/csv; charset=utf-8).'
          headers:
            Content-Disposition:
              description: attachment; filename="kayod-audit-log-YYYY-MM-DD.csv" (UTC date of the export).
              schema:
                type: string
            X-Export-Count:
              description: Rows in this file (≤ 5000).
              schema:
                type: integer
            X-Export-Total:
              description: Rows matching the filters; greater than X-Export-Count when the 5000 cap truncated the file.
              schema:
                type: integer
          content:
            text/csv:
              schema:
                type: string
                description: UTF-8 CSV with a leading BOM (U+FEFF), header row then one row per entry, CRLF line endings.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/activity-logs/team:
    get:
      operationId: getAuditTeam
      tags:
        - Audit log
      summary: Per-admin activity counts for a time window
      description: >-
        One row per admin account (userType admin/superadmin/finance/customer support/support, any status), including
        admins with no activity. Counts (actions excluding admin_login, logins, sensitive) come from an ActivityLog
        aggregate over the from/to window; lastActionAt is the latest non-login entry ever. Rows are filtered (adminId,
        search, activity), sorted and paged in memory. Missing dates (lastLogin/lastActionAt null) always sort last in
        either order; ties fall back to name ascending. `totals` always cover every admin for the window regardless of
        filters/paging. Read-only. Access: requireSuperAdmin (adminAuth first — session role must be admin/superadmin
        and the account must still be active with an admin role, else 401 and the session is destroyed; no admin session
        is a 403 "Admin access required"; a non-superadmin is a 403 "Only superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      parameters:
        - name: from
          in: query
          required: false
          description: >-
            Counts cover entries with createdAt >= this instant (anything `new Date()` parses; an unparseable value is a
            400 "Invalid date …").
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: >-
            Counts cover entries with createdAt <= this instant (inclusive; a date-only value means midnight UTC at the
            START of that day). Unparseable is a 400.
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          description: Case-insensitive substring of the admin's name or email (trimmed, regex-escaped).
          schema:
            type: string
        - name: activity
          in: query
          required: false
          description: >-
            active = actions > 0 in the window; none = actions == 0; sensitive = sensitive > 0. Any other value = no
            filter.
          schema:
            type: string
            enum:
              - active
              - none
              - sensitive
        - name: sort
          in: query
          required: false
          description: Sort key; any other value falls back to actions.
          schema:
            type: string
            enum:
              - actions
              - sensitive
              - lastLogin
              - lastActionAt
              - name
            default: actions
        - name: order
          in: query
          required: false
          description: Exactly "asc" sorts ascending; anything else descending.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: page
          in: query
          required: false
          description: 1-based page. Non-numeric or < 1 becomes 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 1–100. Missing, 0 or non-numeric becomes 25; negative becomes 1.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: adminId
          in: query
          required: false
          description: Only this admin's row (string compare, not validated — an unknown or malformed id just yields no rows).
          schema:
            type: string
      responses:
        '200':
          description: Team rows and totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/admins:
    get:
      operationId: getAllAdmins
      tags:
        - Admin accounts
      summary: List all admin accounts
      description: >-
        Every User whose userType is admin, superadmin, finance, customer support or support (any accountStatus), mapped
        to a display shape (uid "KYD-XXXXXX", fullName, capitalised role). No paging, filtering or sorting. Read-only.
        Unexpected errors answer 500 with the literal message "Server error: ". Access: requireSuperAdmin (adminAuth
        first — session role must be admin/superadmin and the account must still be active with an admin role, else 401
        and the session is destroyed; no admin session is a 403 "Admin access required"; a non-superadmin is a 403 "Only
        superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      responses:
        '200':
          description: All admin accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createAdmin
      tags:
        - Admin accounts
      summary: Create an admin account
      description: >-
        Rejects missing name/email/password/phone/location (400 "All fields are required") and an email already used by
        any user (409 "Email already exists"; the pre-check is case-sensitive but the schema lower-cases, so a case
        variant is caught by the unique index as 409 "That email is already taken"). Creates a User with a bcrypt-hashed
        password, isVerified true, restrictionDetails {appealAllowed:true}, ticket counters 0, and the given or
        all-false permissions. Schema validation failures (bad userType/accountStatus enum, non-active accountStatus
        without restriction details, non-boolean permission) are 400. Side effect: writes an `admin_created` (sensitive)
        ActivityLog row (targetType admin, metadata {role, accountStatus, granted, targetName}). Each audit row written
        also emits socket `activity:new` {logId, actionType} to the /admin namespace room `superadmins`. Audit writes
        are non-fatal: a failed write is logged server-side and the request still succeeds. Access: requireSuperAdmin
        (adminAuth first — session role must be admin/superadmin and the account must still be active with an admin
        role, else 401 and the session is destroyed; no admin session is a 403 "Admin access required"; a non-superadmin
        is a 403 "Only superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminsCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminsCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/admins/{adminId}:
    get:
      operationId: getAdminById
      tags:
        - Admin accounts
      summary: One admin account
      description: >-
        The admin's profile, role, status and permissions. 404 "Admin not found" if the id is not an admin account.
        Read-only. Access: requireSuperAdmin (adminAuth first — session role must be admin/superadmin and the account
        must still be active with an admin role, else 401 and the session is destroyed; no admin session is a 403 "Admin
        access required"; a non-superadmin is a 403 "Only superadmins can do this").
      security:
        - sessionCookie: []
      x-access: superadmin
      parameters:
        - name: adminId
          in: path
          required: true
          description: >-
            The admin account's User _id. Must be an account whose userType is admin, superadmin, finance, customer
            support or support. A malformed id is a 400 (CastError).
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: The admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminsDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateAdmin
      tags:
        - Admin accounts
      summary: Edit an admin account (details, role, status, permissions, password)
      description: >-
        Requires name, email, phone, location (400 "All fields are required"); 404 "Admin not found"; 409 "Email already
        exists" when a changed email belongs to another user. Lockout guard (400): when the target is an ACTIVE
        SUPERADMIN and the edit would leave it not an active superadmin — editing yourself is refused ("You can't
        deactivate your own account" if the status changes, else "You can't remove your own superadmin access"); editing
        another is refused when no other active superadmin exists ("Kayod needs at least one active superadmin"). Then
        sets name/email/phone/location, userType and accountStatus if given (status change to non-active writes
        restrictionDetails with an open-ended suspendedUntil for suspended; to active clears it), replaces permissions
        if given, and bcrypt-hashes newPassword if non-blank. Schema validation failures are 400. Side effects: one
        ActivityLog row per kind of change (targetType admin) — `admin_updated` (name/email/phone/location diff in
        metadata.changes), `admin_role_changed`, `admin_status_changed`, `admin_permissions_changed` (only if keys
        flipped; metadata granted/revoked), `admin_password_reset`. Each audit row written also emits socket
        `activity:new` {logId, actionType} to the /admin namespace room `superadmins`. Audit writes are non-fatal: a
        failed write is logged server-side and the request still succeeds. The demoted/deactivated admin loses access on
        their next request (adminAuth re-reads the account); existing sessions are not destroyed here. Access:
        requireSuperAdmin (adminAuth first — session role must be admin/superadmin and the account must still be active
        with an admin role, else 401 and the session is destroyed; no admin session is a 403 "Admin access required"; a
        non-superadmin is a 403 "Only superadmins can do this").
