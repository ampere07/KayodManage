        reason:
          $ref: '#/components/schemas/ReportsStoredReason'
        comment:
          type: string
          description: Max 1000 chars.
        status:
          $ref: '#/components/schemas/ReportsStoredStatus'
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        adminNotes:
          type: string
          description: Max 2000 chars.
        actionTaken:
          $ref: '#/components/schemas/ReportsActionTaken'
        reportMetadata:
          $ref: '#/components/schemas/ReportsReportMetadata'
        jobPosterId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Legacy job-shaped rows copied out of ReportedPost only (not in the Report schema).
        jobDetails:
          allOf:
            - $ref: '#/components/schemas/ReportsJobDetailsSnapshot'
          description: Legacy job-shaped rows only.
        reportedByDetails:
          allOf:
            - $ref: '#/components/schemas/ReportsReportedByDetails'
          description: Legacy job-shaped rows only.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
        id:
          type: string
          description: >-
            Mongoose `id` virtual (Report schema enables virtuals in toJSON); present only in responses serialized from
            hydrated documents (create, status update, details).
    ReportsReport:
      description: Report document with reportedBy, reportedUserId and reviewedBy populated (`name email userType`).
