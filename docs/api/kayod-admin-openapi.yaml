          nullable: true
        paymentMethod:
          type: string
          enum:
            - wallet
            - xendit
        status:
          type: string
          enum:
            - open
            - in_progress
            - scheduled
            - completed
            - cancelled
            - expired
        userId:
          allOf:
            - $ref: '#/components/schemas/UsersJobParty'
