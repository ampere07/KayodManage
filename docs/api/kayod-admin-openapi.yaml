        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          enum:
            - Old alert fields cleaned up successfully
        modifiedCount:
          type: integer
          description: Alerts that still carry a legacy `dismissedBy` field (their updatedAt is bumped; see description).
    AdminMiscAdminStats:
      type: object
      required:
        - success
        - stats
      properties:
        success:
          type: boolean
          enum:
            - true
        stats:
          type: object
          required:
            - ticketsResolved
          properties:
            name:
              type: string
            email:
              type: string
            ticketsResolved:
              type: integer
              description: User.ticketsResolved, 0 when unset.
            userType:
              type: string
              enum:
                - client
                - provider
                - admin
                - superadmin
                - finance
                - customer support
                - support
    AdminMiscAutoApproveResult:
      type: object
      description: >-
        The autoApproveTopups() result, returned verbatim. Three shapes: nothing pending → {success:true, approved:0,
        message}; ran → {success:true, approved, failed, transactions, failedTransactions, message}; the initial query
        threw → {success:false, approved:0, error, message:"Failed to auto-approve top-ups"} — still HTTP 200.
      required:
        - success
        - approved
        - message
      properties:
        success:
          type: boolean
        approved:
          type: integer
        failed:
          type: integer
          description: Top-ups whose save threw (each is isolated by its own try/catch).
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/ObjectId'
              userId:
                allOf:
                  - $ref: '#/components/schemas/ObjectId'
                nullable: true
                description: fromUser or fromUserId; absent when neither resolves.
              amount:
                type: number
              type:
                type: string
                enum:
                  - xendit_topup
                  - wallet_topup
              userName:
                type: string
                description: Requester name, or "Unknown".
        failedTransactions:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '#/components/schemas/ObjectId'
              error:
                type: string
                description: Error message.
        message:
          type: string
          description: >-
            "No pending top-ups to approve", "Automatically approved N top-up transaction(s)" or "Failed to auto-approve
            top-ups".
        error:
          type: string
          description: 'Only when success is false: the error message.'
    AdminMiscDebugIdentity:
      type: object
      properties:
        adminId:
          type: string
          description: req.admin.id (User _id as string), else req.user.id.
        adminEmail:
          type: string
        adminName:
          type: string
        fullAdmin:
          type: object
          description: >-
            req.admin as set by adminAuth. If adminAuth's User lookup threw, its fallback carries only
            id/name("Admin")/email.
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
            userType:
              type: string
              enum:
                - client
                - provider
                - admin
                - superadmin
                - finance
                - customer support
                - support
        fullUser:
          type: object
          description: req.user as set by adminAuth from the session.
          properties:
            id:
              type: string
              description: session userId || adminId || "admin".
            username:
              type: string
            role:
              type: string
              enum:
                - admin
                - superadmin
            email:
              type: string
    AdminMiscDismissedAlert:
