  /api/users/{userId}/activity:
    get:
      operationId: getUserActivity
      tags:
        - Users
      summary: Merged timeline of the user's activity
      description: >-
        Builds one newest-first timeline from: jobs posted/assigned (`job`), transactions and withdrawals (`money`),
        quotes (`quote`, raw jobquotes), reviews given/received (`review`, raw reviews), credential submissions
        (`verification`), support tickets (`support`, raw chatsupports + supporttickets), reports (`report`, raw
        reports) and admin audit-log rows targeting the user (`admin`). Each source fetches its newest page*limit rows,
        the union is sorted by timestamp and the requested page sliced out; pagination reports `loaded`/`hasMore` rather
        than a total. A withdrawal document hides the transaction it links to, so a cash-out is listed once. Read-only.
        An unknown (but well-formed) userId returns an empty timeline, not 404.


        Access: `adminAuth` — the session must be authenticated with role admin or superadmin (otherwise **403** `Admin
        access required`, which is also what an unauthenticated caller gets). The admin account is re-read on every
        request; if it no longer exists, is not `accountStatus: active`, or is no longer admin/superadmin, the session
        is destroyed and **401** is returned.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's `_id`. Validated with ObjectId.isValid → 400 "Invalid user id".
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: page
          in: query
          required: false
          description: 1-based page; parseInt, missing/0/non-numeric → 1.
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Events per page; parseInt, missing/0/non-numeric → 25; capped at 100.
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: types
          in: query
          required: false
          description: >-
            Comma-separated event types to include; omitted/empty = all. Unknown values are ignored (they select
            nothing).
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - job
                - money
                - quote
                - review
                - verification
                - support
                - report
                - admin
      responses:
        '200':
          description: A page of timeline events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/users/{userId}/ban:
    patch:
      operationId: banUser
      tags:
        - Users
      summary: Ban the user, permanently or for a number of days
      description: >-
        Rejects a missing/blank reason with 400 "Ban reason is required". Sets accountStatus "banned", isRestricted true
        and replaces restrictionDetails with {type: "banned", reason (trimmed), restrictedAt: now, appealAllowed: true,
        restrictedBy: session admin, expiresAt?}. Duration: > 0 days → temporary ban, expiresAt = now + duration days,
        after which the hourly scheduler reactivates the account; 0 / -1 / any non-positive / missing / non-numeric →
        permanent (no expiresAt).


        Side effects:

        - Writes the `users` document with findByIdAndUpdate (schema validators are not run).

        - Writes an ActivityLog row via logActivity: user_banned with metadata {reason, duration (days, or -1 for
        permanent), expiresAt|null}. The audit write is non-fatal (a failure is logged and the request still succeeds);
        on success it also emits `activity:new` {logId, actionType} to the `/admin` namespace, room `superadmins`.

        - Emits Socket.IO `user:updated` {user: <UsersUserDetail>, updateType: "banned"} to room `admin` on the default
        namespace.

        - No notification is sent to the user; no transaction is used.

        - There is no guard on the target: staff accounts (admin/superadmin) and the calling admin can be targeted; a
        targeted admin loses access on their next request (adminAuth requires accountStatus active).


        A malformed userId is a Mongoose CastError → 400 "Invalid _id". The response is the user re-read through
        getUserById (same shape as GET /api/users/{userId}).


        Access: `adminAuth` — the session must be authenticated with role admin or superadmin (otherwise **403** `Admin
        access required`, which is also what an unauthenticated caller gets). The admin account is re-read on every
        request; if it no longer exists, is not `accountStatus: active`, or is no longer admin/superadmin, the session
        is destroyed and **401** is returned.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: userId
          in: path
          required: true
          description: The user's `_id`.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersBanRequest'
      responses:
        '200':
          description: The banned user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersUserDetail'
