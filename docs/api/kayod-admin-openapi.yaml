  /api/jobs/{jobId}/rebook-verdict:
    post:
      operationId: submitRebookVerdict
      tags:
        - Jobs
      summary: Record the reporter's verdict on a rebooked job (service-to-service)
      description: >-
        Called by kayod/server on behalf of the party who raised the dispute (they have no admin session). Authenticated
        by the `x-api-key` header (supportServiceAuth): missing/wrong key → 401; no key configured in production → 503.


        Runs in a MongoDB transaction. Order: `satisfied` not a boolean → 400; job missing → 404; no
        `completionStatus.rebook.orderedAt` → 400; a verdict already recorded (`verdict.respondedAt` set) → 200 with
        `alreadyRecorded: true` and the stored verdict, nothing changed (this check precedes the reporterId check);
        `reporterId` missing → 400; `reporterId` is not the reporter side's user (rebook.reporterRole, or inferred from
        the id for legacy rebooks) → 403 `{ error }`.


        Writes `rebook.reporterRole` and `rebook.verdict {askedAt, respondedAt: now, satisfied, reason}`.


        **satisfied: true** — job `status=completed`, `completionStatus.completedAt=now`, both confirmations true
        (confirmedAt kept or set to now); `escrowService.scheduleEscrowRelease` revives the suspended EscrowRelease (or
        creates one) with a FRESH window from now, priced on `job.escrowAmount`. The held Transaction and the client
        wallet are not touched. Notifications "Rebooked Work Confirmed" (type job_completed).


        **satisfied: false** — the dispute is re-activated (`isActive`, `raisedBy` = reporter role, reason "Rebooked
        work rejected…", `escalatedAt` now, internalNotes kept, claims reset); the hold stays suspended. After commit,
        every closed dispute ChatSupport thread for the job is reopened (public system message + internal note, status
        open, assignment/acceptance cleared, `reopened` statusHistory, metadata.disputeOutcome null;
        `support:chat_updated` on `/admin`). Notifications "Dispute Reopened" (type system).


        Notifications go to both client and assigned provider (priority high). `job:updated` with `updateType:
        rebook-confirmed | rebook-rejected`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT namespace —
        admin sockets only join `admin` inside the `/admin` namespace, so in practice no client receives it. No
        audit-log row is written.


        Other failures (malformed jobId CastError, scheduleEscrowRelease throwing for a job with no provider or an
        already released/refunded escrow) → 500 `{ error: "Failed to record rebook verdict", message }`.
      security:
        - serviceKey: []
      x-access: service
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobsRebookVerdictRequest'
      responses:
        '200':
          description: Verdict recorded, or the previously recorded verdict (alreadyRecorded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsRebookVerdictResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: reporterId is not the party who raised the dispute
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/jobs/{jobId}/resolve-dispute:
    post:
      operationId: resolveDispute
      tags:
        - Jobs
      summary: Rule on an active dispute or an unsettled rebook
      description: >-
        Runs in a MongoDB transaction. Validation, in order (each aborts): `outcome` not one of
        pay_provider/refund_client/rebook/no_show_payout → 400; job missing → 404; no active dispute AND no unsettled
        rebook (a rebook whose verdict is not `satisfied: true`, or a legacy archived `rebook` resolution) → 400;
        `completionStatus.paymentReleased` and outcome ≠ rebook → 400; rebook on a `cancelled` job → 400; rebook without
        `rebookDeadlineAt` → 400, unparseable → 400, not in the future → 400. Some of these 400 bodies are just `{ error
        }` (no success/message).


        **pay_provider** — needs a settleable escrow (held Transaction `held`, or post-completion with a live
        EscrowRelease and nothing released/refunded) else 400. Client `heldBalance -= amount` and `totalSpent += amount`
        only if heldBalance covers it (i.e. not already captured at completion); held Transaction → `completed`; job
        `escrowAmount=amount`, `escrowStatus=pending`, `status=completed`, `completionStatus.completedAt` (if unset),
        `paymentDetails.isPaid=true` (`paymentReleased` is NOT set). The paused EscrowRelease is resumed on its ORIGINAL
        date (made due now if that date passed); if none exists a new one is scheduled from now for the job's own window
        (platform fee 20%, 15% for an active premium provider). The provider is paid later by kayod/server's scheduler,
        never directly here.


        **refund_client** — needs a settleable escrow else 400. Full refund: client `heldBalance` reduced (floored at
        0), `availableBalance += amount`, `totalSpent` adjusted; held Transaction → `refunded`; new `job_budget_refund`
        Transaction; every live EscrowRelease (scheduled/processing/failed/suspended) → `refunded` with
        `refundTransactionId`; a Draft is created from the job (`sourceJobId`, paymentMethod wallet); job
        `status=cancelled`, `escrowStatus=refunded`, `cancellation {reason: note || default, feeApplied 0}`,
        `isPaid=false`, `heldTransaction=null`, `paymentStatus=pending`; booking slots released.


        **no_show_payout** — needs a settleable escrow and an assigned provider (each else 400). Splits the held amount
        using JobPostingSettings (`noShowPayoutPercentage` default 20, `noShowPayoutMinimum` default 300): whole amount
        leaves client heldBalance, client share credited to availableBalance (+ `job_budget_refund` Transaction if > 0),
        held Transaction → `completed`, a `no_show_payout` Transaction (status `held`, client → provider) is created;
        job `status=cancelled`, `escrowAmount=payout`, `escrowStatus=pending`, `isPaid=true`, `heldTransaction=null`,
        `cancellation.feeApplied=payout`; an EscrowRelease is scheduled/revived for the payout (hold =
        `noShowPayoutHoldHours` if > 0, else the job's window); booking slots released.


        **rebook** — no money moves. Clears both confirmations; a `completed` job goes back to `in_progress`
        (completedAt cleared); sets `completionStatus.rebook {orderedAt, orderedBy, deadlineAt, reporterRole = dispute
        raiser, verdict reset}`; the live EscrowRelease (if any) is `suspended` (the
        suspendedAt/suspendedReason/suspendedFromScheduledFor metadata it also writes is not in the EscrowRelease schema
        and is silently dropped); job `escrowStatus=pending`, `escrowReleaseAt=null`.


        **All outcomes** archive the dispute (raisedBy/raisedAt/reason/claims + finding) into
        `completionStatus.disputeHistory` and clear the live dispute (keeping internalNotes, recording `finding
        {faultParty, findingReason, notes, decidedBy, decidedAt}` and `resolution`). Inside the transaction: if the
        ruling went against the raiser (client raised → provider_paid/no_show_payout; provider raised → client_refunded)
        and they have lost ≥ `disputeLossRestrictionCount` (default 3; < 2 disables) raised disputes in 30 days, an
        active account is set `restricted`; the finding is $pushed onto each named party's `User.faultFindings`
        (idempotent per job+role; `sanctioned` when the reason is no_show/late_cancel/access_failure), and a party with
        ≥ `confirmedFaultRestrictionCount` (default 2; 0 disables) sanctioned findings in 30 days is restricted. Commit.


        After commit (best-effort): each open dispute ChatSupport thread for the job gets the party-specific outcome
        summary + "Ticket has been resolved: <label>", is closed with metadata.disputeOutcome = outcome
        (`support:chat_updated` on `/admin`); "Account Restricted" Notifications for any restriction this ruling
        triggered; audit row `dispute_resolved` {outcome, resolution, note, refundedAmount, draftId, escrow dates,
        rebookDeadlineAt}; "Dispute Resolved" Notifications (admin_action, high) to client and provider; `job:updated`
        with `updateType: "dispute-resolved"`. Emits Socket.IO `job:updated` to room `admin` on the DEFAULT namespace —
        admin sockets only join `admin` inside the `/admin` namespace, so in practice no client receives it.


        Errors other than the ApiErrors above (including a malformed jobId CastError, or a provider-less pay_provider
        that has to schedule a new hold) are answered by the handler as 500 `{ error: "Failed to resolve dispute",
        message }`.


        adminAuth: no admin session answers 403 `Admin access required`; a session whose account is no longer an active
        admin/superadmin is destroyed and answers 401.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobsResolveDisputeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsResolveDisputeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
