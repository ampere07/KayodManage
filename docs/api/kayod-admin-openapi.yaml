                "poster" when the job's userId is this user, otherwise "provider" (also when the poster could not be
                populated).
            value:
              type: number
              description: >-
                budget if > 0, else agreedPrice, else paidAmount, else softLimitBudget, else 0 (paidAmount 0 stops the
                chain).
    UsersJobsResponse:
      type: object
      required:
        - jobs
        - summary
        - pagination
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/UsersUserJob'
          description: Newest first (createdAt). Soft-deleted and hidden jobs are included.
        summary:
          type: object
          description: Independent of the `role` filter and of pagination.
          required:
            - posted
            - worked
            - postedValue
            - byStatus
          properties:
            posted:
              type: integer
              description: Jobs this user posted (all statuses, regardless of `role`).
            worked:
              type: integer
              description: Jobs assigned to this user (assignedToId).
            postedValue:
              type: number
              description: >-
                Sum over posted jobs of: budget if > 0, else agreedPrice, else paidAmount, else 0 — all statuses,
                including cancelled/expired.
            byStatus:
              type: object
              description: >-
                Posted-job count per status; a job with no status is keyed "unknown". Keys absent for statuses with no
                jobs.
              additionalProperties:
                type: integer
        pagination:
          $ref: '#/components/schemas/UsersPagination'
    UsersTopUpEntry:
      type: object
      required:
        - _id
        - reference
        - completedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
        status:
          type: string
          description: Transaction status.
        method:
          type: string
          description: Transaction paymentMethod, else "xendit" for xendit_topup / "wallet" for wallet_topup.
        description:
          type: string
        reference:
          type: string
          description: xenditId, or null.
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        completedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: completedAt, else processedAt, else null.
    UsersCashOutEntry:
      type: object
      description: >-
        A cash-out from the raw `withdrawals` collection, or a withdrawal-type transaction that no withdrawal document
        links to.
      required:
        - _id
        - netAmount
        - fee
        - destination
        - destinationType
        - accountNumber
        - accountHolder
        - method
        - reference
        - completedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        amount:
          type: number
          description: Gross amount.
        netAmount:
          type: number
          description: Withdrawal netAmount (else amount); for unlinked transactions = amount.
        fee:
          type: number
          description: Withdrawal processingFee, or transaction platformFee; 0 when absent.
        status:
          type: string
        destination:
          type: string
          description: Withdrawal destination; for transactions the transaction description.
          nullable: true
        destinationType:
          type: string
          description: E-Wallet / Traditional Bank / Digital Bank; null for transactions.
          nullable: true
        accountNumber:
          type: string
          description: null for transactions.
          nullable: true
        accountHolder:
          type: string
          description: null for transactions.
          nullable: true
        method:
          type: string
          description: withdrawalMethod (withdrawals) or paymentMethod (transactions).
          nullable: true
        reference:
          type: string
          description: referenceId (withdrawals) or xenditId (transactions).
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        completedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: completedAt, else processedAt, else null.
    UsersFinancialsResponse:
      type: object
      description: >-
        All amounts are raw numbers in the stored currency (PHP). earned/spent/feesPaid/refunded are uncapped aggregates
        over `transactions` matching fromUserId|fromUser (out) or toUserId|toUser (in).
      required:
        - topUp
        - cashOut
        - earned
        - spent
        - feesPaid
        - refunded
      properties:
        topUp:
          type: object
          required:
            - total
            - pending
            - count
            - entries
          properties:
            total:
              type: number
              description: Sum over entries with status "completed" (netAmount when present, else amount).
            pending:
              type: number
              description: Same, over entries with status pending/processing/held/escrowed.
            count:
              type: integer
              description: Number of completed entries.
            entries:
              type: array
              items:
                $ref: '#/components/schemas/UsersTopUpEntry'
              description: >-
                xendit_topup / wallet_topup transactions to the user, newest first, capped at 200 — totals are computed
                from these entries only, so they undercount beyond 200.
        cashOut:
          type: object
          required:
            - total
            - pending
            - count
            - entries
          properties:
            total:
              type: number
              description: Sum over entries with status "completed" (netAmount when present, else amount).
            pending:
              type: number
              description: Same, over entries with status pending/processing/held/escrowed.
            count:
              type: integer
              description: Number of completed entries.
            entries:
              type: array
              items:
                $ref: '#/components/schemas/UsersCashOutEntry'
              description: >-
                Up to 200 withdrawals documents plus up to 200 unlinked withdrawal transactions, merged newest first —
                totals are computed from these entries only.
        earned:
          type: number
          description: >-
            Completed incoming transactions of every type except xendit_topup/wallet_topup (includes refunds, so it
            overlaps `refunded`).
        spent:
          type: number
          description: Completed outgoing transactions of every type except withdrawal (includes fees, so it overlaps `feesPaid`).
        feesPaid:
          type: number
          description: Completed outgoing platform_fee, fee_payment and cancellation_fee transactions.
        refunded:
          type: number
          description: Completed incoming refund, refund_request and job_budget_refund transactions.
    UsersCategoryRating:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
          minimum: 1
          maximum: 5
    UsersReview:
      type: object
      required:
        - _id
