  /api/admin/report-post:
    post:
      operationId: verificationsCreateReport
      tags:
        - Legacy reports
      summary: File a report against a job post (as the signed-in session user)
      description: >-
        Requires any authenticated session (authMiddleware; 401 otherwise — it never sends 403). The reporter is
        req.session.userId (or adminId). Checks the job exists (populating its user) and that this reporter has not
        already reported it (409), then saves a ReportedPost {jobId, reportedBy, jobPosterId: job.user._id, reason,
        comment (trimmed)}. A `reportMetadata` object (IP, user agent, source `web`) is also passed but is not in the
        schema and is dropped. CURRENT BEHAVIOUR: the ReportedPost schema requires `jobDetails` and
        `reportedByDetails.*`, which this handler never sets, so save() always fails Mongoose validation and the request
        returns 400 (e.g. "Path `jobDetails` is required.") with the validator messages in `details`; the 201 below is
        unreachable until the handler is fixed. A job whose poster no longer exists -> 500. No audit row, notification
        or socket event.
      security:
        - sessionCookie: []
      x-access: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jobId
                - reason
                - comment
              properties:
                jobId:
                  allOf:
                    - $ref: '#/components/schemas/ObjectId'
                  description: Job to report; malformed -> 400.
                reason:
                  type: string
                  description: Must be a canonical report reason (schema enum).
                  enum:
                    - spam
                    - inappropriate_content
                    - misleading_information
                    - fake_job_posting
                    - duplicate_posting
                    - scam_or_fraud
                    - discrimination
                    - harassment
                    - violence_or_threats
                    - adult_content
                    - copyright_violation
                    - unsafe_work_conditions
                    - payment_issues
                    - other
                    - unfinished_work
                    - substandard_work
                    - misconduct
                    - fake_profile
                    - threats
                    - unsolicited_solicitation
                    - inappropriate_behavior
                    - fake_review
                    - defamation
                    - conflict_of_interest
                    - unauthorized_charge
                    - payment_dispute
                comment:
                  type: string
                  description: Non-empty string; trimmed; max 1000 characters (schema).
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: 'Created (currently unreachable: see description)'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - reportId
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Report submitted successfully
                  reportId:
                    $ref: '#/components/schemas/ObjectId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/admin/reported-posts:
    get:
      security:
        - sessionCookie: []
      x-access: admin
      operationId: getReportedPosts
      tags:
        - Legacy reports
      summary: List reported job posts (legacy ReportedPost collection) with pagination and status summary
      description: >-
        Requires an admin session (adminAuth): no authenticated admin/superadmin session -> 403 `Admin access required`;
        a session whose account is no longer active or no longer an admin is destroyed -> 401. Read-only. Finds
        ReportedPost documents (status filter unless `all`), sorted by `sortBy`/`sortOrder`, paginated with skip/limit,
        and populates jobId (title, description, category, location, budget, budgetType, paymentMethod, media, icon,
        createdAt, status, isDeleted, deletedAt, deletionReason — soft-deleted jobs included),
        reportedBy/jobPosterId/reviewedBy (name, email). Each job is enriched with formattedBudget, budgetInfo, media
        classification and deletion info; a missing job is replaced by a `[Job Not Found]` placeholder. `reportedBy` is
        remapped to {_id, providerId, providerName, providerEmail} — a report whose reporter no longer exists makes the
        whole request fail with 500. Also returns the global status summary (same as /reported-posts/summary without the
        extras). page/limit are parseInt-ed without bounds checks.
      parameters:
        - name: status
          in: query
          required: false
          description: Exact stored status to filter by, or `all` for no filter. Not validated.
          schema:
            type: string
            default: all
        - name: page
          in: query
          required: false
          description: 1-based page number (parseInt).
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Page size (parseInt). 0 disables the limit (totalPages becomes null).
          schema:
            type: integer
            default: 10
        - name: sortBy
          in: query
          required: false
          description: Any ReportedPost field name; not validated.
          schema:
            type: string
            default: createdAt
        - name: sortOrder
          in: query
          required: false
          description: '`desc` sorts descending; any other value (e.g. `asc`) sorts ascending.'
          schema:
            type: string
            default: desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - reportedPosts
                  - pagination
                  - summary
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  reportedPosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegacyReportsReportedPostListItem'
                  pagination:
                    $ref: '#/components/schemas/LegacyReportsPagination'
                  summary:
                    $ref: '#/components/schemas/LegacyReportsSummaryCounts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
