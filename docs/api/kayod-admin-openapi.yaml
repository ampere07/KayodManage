        - id
        - type
        - action
        - title
        - timestamp
        - targetId
        - targetType
      properties:
        id:
          type: string
          description: '"verif-<verificationId>".'
        type:
          type: string
          enum:
            - verification
        action:
          type: string
          enum:
            - verification_submitted
        title:
          type: string
          enum:
            - Submitted credentials for verification
        description:
          type: string
          description: '"Status: <status>".'
        status:
          type: string
        targetId:
          $ref: '#/components/schemas/ObjectId'
        targetType:
          type: string
          enum:
            - verification
        timestamp:
          $ref: '#/components/schemas/DateTime'
    UsersActivitySupportEvent:
      type: object
      required:
        - id
        - type
        - action
        - title
        - timestamp
        - targetId
        - targetType
      properties:
        id:
          type: string
          description: '"support-<ticketId>".'
        type:
          type: string
          enum:
