        Picks only the editable fields. Validates in order: type "image" needs a truthy imageUrl (400 "An image ad
        requires an uploaded image"); linkAction shape (400, see ConfigAdvertisementInput.linkAction); status enum
        (400). Reconciles status/isActive (neither sent -> published + active). If order is omitted it becomes (highest
