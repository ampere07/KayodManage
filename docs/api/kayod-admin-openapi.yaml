      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Always true on success.
                    enum:
                      - true
                  chatSupport:
                    allOf:
                      - $ref: '#/components/schemas/SupportChatSupportPopulated'
