        only, no _id tie-break; targetId populated with name email title subject and flattened to targetName) plus a
        summary — last login, last non-login action ever, non-login counts for 7 and 30 days, sensitive and login counts
        for 30 days, and a 30-day per-action breakdown. 404 "Admin not found" if the id is not an admin account.
        Read-only. Access: requireSuperAdmin (adminAuth first — session role must be admin/superadmin and the account
