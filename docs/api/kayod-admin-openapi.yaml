        icon) and saves the category. Writes an ActivityLog audit row `profession_created` (targetType profession,
        targetId = the category) (non-fatal; logActivity also emits `activity:new` to the /admin superadmins room).
        Auth: adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an
