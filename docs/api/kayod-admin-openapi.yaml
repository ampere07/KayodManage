        Count per stored status over the same filter as the list. Seeded with the retired keys
        pending/reviewed/resolved/dismissed at 0; canonical keys are added only when rows carry them.
      properties:
        total:
          type: integer
          description: countDocuments of the filtered query.
        pending:
          type: integer
        reviewed:
          type: integer
        resolved:
          type: integer
        dismissed:
          type: integer
        open:
          type: integer
          description: Present only when matching rows have this stored status.
        under_review:
          type: integer
          description: Present only when matching rows have this stored status.
        action_taken:
          type: integer
          description: Present only when matching rows have this stored status.
        escalated:
          type: integer
          description: Present only when matching rows have this stored status.
      required:
        - total
        - pending
        - reviewed
        - resolved
        - dismissed
    ReportsParty:
      type: object
      description: >-
        A user resolved by batched lookup (name email phoneNumber phoneNumberWithCountryCode userType accountStatus).
        For reportedBy only, falls back to the stored reportedByDetails snapshot when the user no longer exists.
      properties:
        _id:
          type: string
          description: User id as a string ("" when the fallback snapshot has no providerId).
        name:
          type: string
          description: '"" when missing; "Unknown" for the reportedByDetails fallback.'
        email:
          type: string
        phoneNumber:
          type: string
          description: phoneNumberWithCountryCode, else phoneNumber, else "" (always "" for the reportedByDetails fallback).
        userType:
          type: string
          description: '"" when missing.'
        accountStatus:
          type: string
          description: >-
            Defaults to "active". Absent when the party came from the reportedByDetails fallback rather than a live
            user.
          enum:
            - active
            - restricted
            - suspended
            - banned
            - deleted
      required:
        - _id
        - name
        - email
        - phoneNumber
        - userType
    ReportsCombinedJob:
      type: object
      description: The live Job when it still exists, else the embedded jobDetails snapshot.
      properties:
        _id:
          type: string
          description: Job id as a string ("" when only a snapshot without a job id survives).
        title:
          type: string
          description: '"Untitled job" when missing.'
        description:
          type: string
        category:
          type: string
        budget:
          type: number
          description: 0 when missing.
        budgetType:
          type: string
          description: '"fixed" when missing.'
        paymentMethod:
          type: string
          description: '"Not specified" when missing.'
        location:
          type: object
          description: '{} when missing.'
        media:
          type: array
          items:
            type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
        isDeleted:
          type: boolean
          description: 'Live job: its isDeleted flag. No live job but a snapshot exists: true (the job is gone).'
        isHidden:
          type: boolean
          description: 'Live job: its isHidden flag. Snapshot only: false.'
      required:
        - _id
        - title
        - description
        - category
        - budget
        - budgetType
        - paymentMethod
        - location
        - media
        - isDeleted
        - isHidden
    ReportsCombinedReport:
      type: object
      description: One normalized row of the combined Flagged feed.
      properties:
        _id:
          type: string
        source:
          type: string
          description: Which collection the row came from — pass it back as items[].source to bulk-status.
          enum:
            - report
            - reported_post
        reportType:
          type: string
          description: >-
            Report.reportType; legacy rows without one are "job" when they carry jobId/jobDetails, else "other". Always
            "job" for reported_post rows.
          enum:
            - job
            - user
            - message
            - conversation
            - review
            - payment
            - other
        reportedBy:
          allOf:
            - $ref: '#/components/schemas/ReportsParty'
          nullable: true
          description: The reporter.
        reportedUserId:
          allOf:
            - $ref: '#/components/schemas/ReportsParty'
          nullable: true
          description: 'The reported party: reportedUserId, else jobPosterId.'
        relatedId:
          type: string
          description: relatedId (or jobId) as a string; "" when neither is set.
        job:
          allOf:
            - $ref: '#/components/schemas/ReportsCombinedJob'
          nullable: true
          description: Null when there is neither a live job nor a snapshot.
        reason:
          allOf:
            - $ref: '#/components/schemas/ReportsReason'
          description: Normalized reason (legacy values mapped; "other" when empty; unknown stored values pass through).
        rawReason:
          type: string
          description: Stored reason before normalization.
        comment:
          type: string
        status:
          $ref: '#/components/schemas/ReportsStatus'
        rawStatus:
          type: string
          description: Stored status before normalization.
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/ReportsParty'
          nullable: true
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        adminNotes:
          type: string
        actionTaken:
          type: string
          description: Report.actionTaken, "none" when unset; always "none" for reported_post rows.
          enum:
            - none
            - post_deleted
            - post_approved
            - user_warned
            - user_restricted
            - user_suspended
            - report_dismissed
            - conversation_deleted
            - message_deleted
            - escalated_to_dispute
        reportMetadata:
          allOf:
            - $ref: '#/components/schemas/ReportsReportMetadata'
          description: 'Stored metadata, or { reportSource: "web" } (always that for reported_post rows).'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      required:
        - _id
        - source
        - reportType
        - reportedBy
        - reportedUserId
        - relatedId
        - job
        - reason
        - comment
        - status
        - reviewedBy
        - reviewedAt
        - adminNotes
        - actionTaken
        - reportMetadata
    ReportsCombinedStats:
      type: object
      description: Counted from the normalized, filtered rows (before pagination), so they always agree with the table.
      properties:
        total:
          type: integer
          description: Number of rows after filtering (all pages).
        open:
          type: integer
        under_review:
          type: integer
        action_taken:
          type: integer
        dismissed:
          type: integer
        escalated:
          type: integer
        open_total:
          type: integer
          description: open + under_review.
        bySource:
          type: object
          properties:
            report:
              type: integer
            reported_post:
              type: integer
          required:
            - report
            - reported_post
      required:
        - total
        - open
        - under_review
        - action_taken
        - dismissed
        - escalated
        - open_total
        - bySource
    ReportsCreateReportRequest:
      type: object
      properties:
        reportType:
          type: string
          description: Must be a Report.reportType value; an invalid value fails model validation and returns 500.
          enum:
            - job
            - user
            - message
            - conversation
            - review
            - payment
            - other
        relatedId:
          type: string
          description: ObjectId of the reported item (job, message, conversation, …). A malformed id returns 500.
        reportedUserId:
          type: string
          description: >-
            ObjectId of the reported user. Required by the model for reportType user/message/conversation (500 when
            missing). Equal to the caller's id → 403.
        reason:
          allOf:
            - $ref: '#/components/schemas/ReportsReason'
          description: Must be a canonical reason; anything else (legacy values included) fails model validation (500).
        comment:
          type: string
          description: Optional, trimmed, max 1000 chars (longer → 500).
          maxLength: 1000
      required:
        - reportType
        - relatedId
        - reason
    ReportsUpdateReportStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReportsDecisionStatus'
        adminNotes:
          type: string
          description: Applied only when truthy (cannot be cleared); max 2000 chars (longer → 500).
          maxLength: 2000
        actionTaken:
          type: string
          description: Applied only when truthy; validated by the model on save — an unknown value returns 500, not 400.
          enum:
            - none
            - post_deleted
            - post_approved
            - user_warned
            - user_restricted
            - user_suspended
            - report_dismissed
            - conversation_deleted
            - message_deleted
            - escalated_to_dispute
      required:
        - status
    ReportsUpdateReportedPostStatusRequest:
      type: object
      properties:
        status:
          type: string
          description: Optional; when present must be one of these (else 400).
          enum:
            - under_review
            - action_taken
            - dismissed
        adminNotes:
          type: string
          description: Optional; any value other than undefined is written (an empty string clears). Max 1000 chars (longer → 500).
          maxLength: 1000
    ReportsBulkItem:
      type: object
      properties:
        id:
          type: string
          description: Report or ReportedPost _id (must be a valid ObjectId).
        source:
          type: string
          enum:
            - report
            - reported_post
      required:
        - id
        - source
    ReportsBulkStatusRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ReportsBulkItem'
          description: 1–500 references; duplicates are collapsed.
        status:
          $ref: '#/components/schemas/ReportsDecisionStatus'
        adminNotes:
          type: string
          description: Optional; trimmed, written only when non-empty. Not length-checked (updateMany skips validators).
        actionTaken:
          type: string
          description: >-
            Optional; Report rows only, and only when status is not under_review. Defaults to "report_dismissed" for
            dismissed and "none" for action_taken. Not validated against the enum (updateMany skips validators).
          enum:
            - none
            - post_deleted
            - post_approved
            - user_warned
            - user_restricted
            - user_suspended
            - report_dismissed
            - conversation_deleted
            - message_deleted
            - escalated_to_dispute
      required:
        - items
        - status
    ReportsBulkStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always true on success.
          enum:
            - true
        updated:
          type: integer
          description: Number of reports this request changed.
        skipped:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              source:
                type: string
                enum:
                  - report
                  - reported_post
              reason:
                type: string
                description: >-
                  "not found", "already <status>" (already closed, or already at the target status), or "changed by
                  someone else meanwhile".
            required:
              - id
              - source
              - reason
        failed:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              source:
                type: string
                enum:
                  - report
                  - reported_post
              error:
                type: string
                description: Database error message for that collection's batch.
            required:
              - id
              - source
              - error
      required:
        - success
        - updated
        - skipped
        - failed
    TransactionsUserSummary:
