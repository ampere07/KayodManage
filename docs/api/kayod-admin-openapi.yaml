      operationId: updateProfessionAdminMount
      summary: Edit a profession (name, icon, service class, quick-access flags)
      description: >-
        Finds the category holding the profession (404 "Profession not found"). Each field is applied only when present:
        `name` non-blank (400 "Profession name is required") and not a case-insensitive duplicate within the category
        (400 "Profession name already exists in this category"); `icon` stored as given; `isQuickAccess` /
