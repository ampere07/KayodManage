        fromUserId:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: Populated sender (newer key written by the Kayod app).
        toUser:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: Overwritten with `toUser || toUserId`.
        toUserId:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: Populated recipient (newer key).
        amount:
          type: number
          description: Amount in PHP (min 0).
        type:
          type: string
          enum:
            - immediate_payment
            - job_budget_deduction
            - job_budget_refund
            - job_escrow
            - escrow_payment
            - escrow_release
            - wallet_topup
            - fee_payment
            - refund
            - refund_request
            - compensation
            - platform_fee
            - withdrawal
            - xendit_topup
            - referral_bonus
            - premium_subscription
            - cancellation_fee
            - no_show_payout
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
            - held
            - expired
            - refunded
            - escrowed
        jobId:
          allOf:
            - $ref: '#/components/schemas/TransactionsJobSummary'
          nullable: true
          description: >-
            Populated job. Top-up branch: title/category/categoryName/professionName/icon only; other branch: also
            budget and nested userId/assignedToId.
        description:
          type: string
        metadata:
          type: object
          description: Free-form (Mixed). For xendit_topup, `xenditPaymentMethod` is surfaced as `paymentMethod`.
        platformFee:
          type: number
        currency:
          type: string
          example: PHP
        exchangeRate:
          type: number
        complianceChecked:
          type: boolean
        maxRetries:
          type: integer
        retryCount:
          type: integer
        xenditWebhookEvents:
          type: array
          items:
            type: object
        xenditId:
          type: string
        paymentMethod:
          type: string
          description: >-
            Top-up branch: display value (metadata.xenditPaymentMethod for xendit_topup when present). Other branch:
            stored value (wallet | xendit | bank_transfer).
        completedAt:
          $ref: '#/components/schemas/DateTime'
        failedAt:
          $ref: '#/components/schemas/DateTime'
        failureReason:
          type: string
        refundStatus:
          type: string
          enum:
            - pending
            - approved
            - declined
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
        transactionType:
          type: string
          enum:
            - transaction
        fromUserData:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: '`fromUser || fromUserId`.'
        toUserData:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: '`toUser || toUserId`.'
        job:
          allOf:
            - $ref: '#/components/schemas/TransactionsJobSummary'
          nullable: true
          description: Alias of jobId.
        userId:
          allOf:
            - $ref: '#/components/schemas/TransactionsStatusUpdateUser'
          nullable: true
          description: Alias of fromUserData.
    TransactionsRefundRequester:
      type: object
