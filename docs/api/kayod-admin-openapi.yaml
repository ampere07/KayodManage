  /api/admin/approve-topups-now:
    post:
      operationId: approveTopupsNow
      tags:
        - Admin
      summary: Run the top-up auto-approval job immediately (inline handler)
      description: >-
        Calls utils/autoApproveTopups — the same function the scheduler started by server.js runs every 5 minutes. It
        loads every Transaction with type xendit_topup/wallet_topup and status pending and, per item inside its own
        try/catch, sets status=completed + completedAt via save() and calls `User.findByIdAndUpdate(userId, {$inc:
        {"wallet.balance": amount}})` — stripped by Mongoose strict mode because `wallet` is a virtual on User, so no
        wallet is credited (only the user's updatedAt changes). When anything was pending it emits
        `transactions:auto-approved` {count, transactions, timestamp}. The Socket.IO emit goes to room `admin` on the
        DEFAULT namespace (`io.to('admin')`); admin dashboards connect to the `/admin` namespace and join its `admin`
        room, so no client currently receives this event. When approved > 0 writes ActivityLog bulk_transaction_approval
        (metadata {count, failed, manualRun: true}). The result object is returned verbatim with HTTP 200 — including
        when the job itself failed ({success:false, ...}). The route's own 500 ({success:false, error:"Failed to approve
        top-ups", details}) is reachable only if something outside the job throws. No request body. Access: adminAuth
        (session role admin/superadmin and the account must still be active with an admin role; a
        deactivated/demoted/deleted admin gets a 401 and the session is destroyed; no admin session is a 403 "Admin
        access required").
      security:
        - sessionCookie: []
      x-access: admin
      responses:
        '200':
          description: Job result (check `success`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMiscAutoApproveResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
