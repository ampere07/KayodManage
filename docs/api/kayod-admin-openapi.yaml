      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
        category:
          type: string
        budget:
          type: number
        budgetType:
          type: string
        paymentMethod:
          type: string
        location:
          type: object
          description: Job.location (Mixed) or the snapshot location.
        media:
          type: array
          items:
            type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
    ReportsReportedPost:
      type: object
      description: >-
        Lean ReportedPost document (legacy reportedposts collection) with reportedBy, jobPosterId and reportedUserId
        populated (`name email userType`).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        jobId:
          allOf:
            - $ref: '#/components/schemas/ReportsPopulatedJob'
          nullable: true
          description: >-
            Populated job. In the list endpoint, when the job no longer exists it is replaced by an object built from
