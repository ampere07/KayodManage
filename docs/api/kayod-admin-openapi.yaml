      tags:
        - Support
      summary: Accept (claim) an open support ticket
      description: >-
        Requires an authenticated admin session (authMiddleware + adminAuth): 401 without a session or when the admin
        account is no longer active/admin (session destroyed), 403 when the session role is not admin/superadmin.


        Atomic findOneAndUpdate that only matches an open ticket with acceptedBy null — and, for a non-superadmin, one
        that is unassigned or already assigned to the caller. Sets
        assignedTo/assignedToName/acceptedBy/acceptedByName/acceptedAt to the caller and pushes an Admin message "Ticket
        has been accepted" (isRead true). When nothing matched: 404 if the ticket does not exist, 409 "Only open tickets
        can be accepted" if it is closed, else 409 "This ticket has already been accepted by another admin" (also
        returned when it is merely assigned to another admin). 400 "Invalid admin ID" when the session id is not an
        ObjectId.


        Dispute threads (metadata.kind "dispute"): every other open, unaccepted dispute thread with the same
        metadata.jobId is accepted the same way (best effort; failures are logged, not returned) and returned in
        linkedChatSupports.


        Side effects: ActivityLog row `support_accepted` (targetType support, model ChatSupport; one row, for the
        requested ticket only); socket `support:chat_updated` `{ chatSupportId, updates: { status, assignedTo,
        assignedToName, acceptedBy, acceptedByName, acceptedAt, messages, updatedAt, displayStatus }, timestamp }` to
