        timestamp:
          $ref: '#/components/schemas/DateTime'
        isRead:
          type: boolean
        isInternal:
          type: boolean
          description: Admin-only internal note.
    DashboardChatSupport:
      type: object
      description: >-
        Fully populated ChatSupport ticket, including the entire `messages` array (internal notes included). Nested refs
        are not populated.
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        ticketId:
          type: string
          description: Ticket code, e.g. `K3QP7A19ZM`.
        userId:
          $ref: '#/components/schemas/ObjectId'
        userName:
          type: string
        userEmail:
          type: string
        subject:
          type: string
        category:
          type: string
          enum:
            - account
            - payment
            - technical
            - job
            - general
            - feedback
        priority:
          type: string
          enum:
            - low
            - medium
            - high
            - urgent
        metadata:
          type: object
          description: Mixed.
        jobDetailsSnapshot:
          type: object
          nullable: true
          description: Mixed.
        status:
          type: string
          enum:
            - open
            - closed
        ticketHistory:
          type: array
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              ticketNumber:
                type: integer
              subject:
                type: string
              category:
                type: string
              openedAt:
                $ref: '#/components/schemas/DateTime'
              closedAt:
                $ref: '#/components/schemas/DateTime'
              resolvedBy:
                $ref: '#/components/schemas/ObjectId'
              messageCount:
                type: integer
        assignedTo:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        assignedToName:
          type: string
          nullable: true
        acceptedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        acceptedByName:
          type: string
          nullable: true
        acceptedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        closedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        statusHistory:
          type: array
          items:
            type: object
            properties:
              _id:
                $ref: '#/components/schemas/ObjectId'
              status:
                type: string
                enum:
                  - resolved
                  - reopened
              performedBy:
                $ref: '#/components/schemas/ObjectId'
              performedByName:
                type: string
              timestamp:
                $ref: '#/components/schemas/DateTime'
              reason:
                type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/DashboardChatSupportMessage'
        lastMessage:
          type: object
          properties:
            text:
              type: string
            timestamp:
              $ref: '#/components/schemas/DateTime'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    DashboardAlert:
      type: object
      description: >-
        Either a stored Alert document (hydrated, toJSON virtuals) or a synthesised alert built from live data
        (`metadata.generatedFromData: true`). Populated refs become null when the referenced document no longer exists.
      required:
        - _id
        - type
        - category
        - title
        - message
        - priority
        - isActive
        - isRead
      properties:
        _id:
          type: string
          description: >-
            Stored: ObjectId (24-hex). Synthesised: `report_<reportedPostId>`, `verification_<verificationId>` or
            `support_<ticketId>` — not ObjectIds, so they cannot be passed to PATCH /alerts/{alertId}/read.
        id:
          type: string
          description: 'Stored alerts only: virtual string form of `_id`.'
        type:
          type: string
          description: 'Severity. Synthesised: report → critical, verification → warning, support → info.'
          enum:
            - critical
            - warning
            - info
        category:
          type: string
          enum:
            - reported_post
            - verification_request
            - support_ticket
            - system
            - user_activity
            - transaction
        title:
          type: string
          description: 'Synthesised: `New Post Report`, `New Verification Request`, `New Support Message`.'
        message:
          type: string
        priority:
          type: integer
          description: '1–5 (schema default 1). Synthesised: report 4, verification 3, support 2.'
          minimum: 1
          maximum: 5
        isActive:
          type: boolean
          description: Always true (only active alerts are listed; synthesised ones are true).
        isRead:
          type: boolean
          description: 'Global read flag (not per admin). Synthesised: false. Not used for filtering.'
        userId:
          description: >-
            Stored alerts, synthesised report alerts (the reporter) and synthesised support alerts (the ticket owner): a
            populated user. Synthesised verification alerts: the bare user ObjectId.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/DashboardPopulatedUserRef'
            - $ref: '#/components/schemas/ObjectId'
        jobId:
          description: 'Stored alerts: populated job (`title`). Synthesised report alerts: the bare job ObjectId.'
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/DashboardPopulatedJobRef'
            - $ref: '#/components/schemas/ObjectId'
        transactionId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: Stored alerts only; not populated.
        reportId:
          description: 'Stored alerts: fully populated ReportedPost. Synthesised report alerts: the bare ObjectId.'
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/DashboardReportedPost'
            - $ref: '#/components/schemas/ObjectId'
        verificationId:
          description: 'Stored alerts: fully populated CredentialVerification. Synthesised verification alerts: the bare ObjectId.'
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/DashboardCredentialVerification'
            - $ref: '#/components/schemas/ObjectId'
        supportId:
          description: >-
            Stored alerts: fully populated ChatSupport ticket (with all messages). Synthesised support alerts: the bare
            ObjectId.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/DashboardChatSupport'
            - $ref: '#/components/schemas/ObjectId'
        metadata:
          type: object
          description: 'Mixed. Synthesised alerts: `{ generatedFromData: true }`.'
          properties:
            generatedFromData:
              type: boolean
              description: Present (true) only on synthesised alerts.
        actionUrl:
          type: string
          description: 'Synthesised: `/reports/<id>`, `/verifications/<id>`, `/support/<id>`.'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: >-
            Stored: document createdAt. Synthesised: report createdAt / verification submittedAt / ticket
            lastMessage.timestamp (or createdAt).
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Stored alerts only.
        __v:
          type: integer
          description: Stored alerts only.
    DashboardSuccess:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Always true.
          enum:
            - true
    DashboardRevenueChartPoint:
      type: object
      required:
        - name
        - revenue
        - transactions
      properties:
        name:
          type: string
          description: >-
            Bucket label from `toLocaleDateString("en-US", { month: "short", day: "numeric" })` in server-local time:
            `Oct 12` for daily buckets, `Oct 6 - Oct 12` for weekly buckets.
        revenue:
          type: number
          description: Sum of `amount` of completed `platform_fee` Transactions in the bucket (PHP).
        transactions:
          type: integer
          description: Number of those Transactions.
    DashboardPopularJob:
      type: object
      required:
        - name
        - count
        - jobCount
        - icon
      properties:
        name:
          type: string
          description: >-
            Group key: lowercased `professionName` (or `category` when professionName is null/empty/missing),
            underscores → spaces, each word capitalised. `Uncategorized` when the key is empty.
        count:
          type: number
          description: 'Despite the name: the SUM of `budget` across the group''s jobs (PHP), and the sort key (descending).'
        jobCount:
          type: integer
          description: Number of jobs in the group.
        icon:
          type: string
          nullable: true
          description: '`icon` of an arbitrary job in the group (`$first` without a sort), or null.'
    ConfigServiceClass:
      type: string
      enum:
        - standard
        - immediate
      description: >-
        Service class (app/config/serviceClasses.js) — decides how long a completed job holds the client's payment
        before the provider is paid: `standard` = 120 h warranty hold (repairs, installations); `immediate` = 0 h
        (released once both sides confirm; wellness, grooming). Resolution for a job: profession override -> category
        class -> `standard`. Jobs snapshot their release window at creation, so a change only affects jobs created
        afterwards.
    ConfigProfession:
      type: object
      required:
        - _id
        - name
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: >-
            Profession name (trimmed). Unique within its category, case-insensitive (enforced by the handlers, not an
            index).
        icon:
          type: string
          description: >-
            Icon reference. `ik:/professionIconsUpload/<slug>.webp` for ImageKit icons (set by upload-profession-icon);
            `custom:<file>` or a bare filename for legacy on-disk icons; may be absent. The Kayod client resolves
            ImageKit icons by the slug of the profession NAME, so the file name must follow the name.
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
            - null
          nullable: true
          description: Per-profession override of the category's service class; `null` (default) = inherit the category class.
        isQuickAccess:
          type: boolean
          default: false
          description: Shown in the client app's quick-access row.
        quickAccessOrder:
          type: number
          default: 0
          description: 1-based position in the quick-access row (set by POST /quick-access-professions); 0 when not quick access.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
      description: >-
        Profession subdocument of a JobCategory (`jobcategories.professions[]`). Lean reads may omit defaulted fields on
        legacy rows.
    ConfigJobCategory:
      type: object
      required:
        - _id
        - name
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: Category name (trimmed). Unique index (case-sensitive).
        icon:
          type: string
          description: >-
            Icon reference, e.g. `custom:<file>` returned by upload-category-icon (served from
            /assets/icons/categories/), or a built-in icon name.
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
          description: >-
            Category service class (see ConfigServiceClass). Schema default `standard`; legacy lean rows may omit it
            (treated as standard).
          default: standard
        professions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigProfession'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
      description: JobCategory document (collection `jobcategories`).
    ConfigProfessionInput:
      type: object
      properties:
        name:
          type: string
          description: Profession name; trimmed. Blank entries are skipped.
        icon:
          type: string
          description: Optional icon reference.
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
            - null
          nullable: true
          description: Optional override; an unknown value is silently stored as `null` (inherit) rather than rejected.
      description: Profession seed passed inline when creating a category.
    ConfigJobCategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Required; trimmed; must be non-blank. 400 "Category already exists" on an exact (case-sensitive) match.
        icon:
          type: string
          description: Optional icon reference (empty string is treated as omitted).
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
          description: Optional; omitted -> `standard`. Any other value (including null) -> 400.
        professions:
          type: array
          items:
            $ref: '#/components/schemas/ConfigProfessionInput'
          description: Optional initial professions. Entries without a name and case-insensitive duplicates are silently skipped.
    ConfigJobCategoryUpdate:
      type: object
      properties:
        name:
          type: string
          description: >-
            If present must be non-blank; trimmed; 400 "Category name already exists" if another category has the exact
            same name.
        icon:
          type: string
          description: If present, stored as given (no validation).
        serviceClass:
          type: string
          enum:
            - standard
            - immediate
          description: If present must be `standard` or `immediate` (null -> 400). Affects only jobs created afterwards.
      description: All fields optional; professions cannot be edited through this route.
    ConfigJobPostingSettings:
      type: object
      required:
        - _id
        - key
        - maxActiveJobsPerUser
        - jobPostDurationDays
        - asapFee
        - bookingFeePercentage
        - bookingFeeThreshold
        - bookingFeeMinimum
        - clientCancellationFeePercentage
        - clientCancellationFeeMinimum
        - clientCancellationFeeThreshold
        - clientCancellationDayOfFeePercentage
        - clientCancellationDayOfFeeMinimum
        - providerStrikeLimit
        - providerStrikeRatingPenalty
        - providerCancellationFeePercentage
        - providerCancellationFeeMinimum
        - providerCancellationFeeThreshold
        - providerCancellationDayOfFeePercentage
        - providerCancellationDayOfFeeMinimum
        - providerCancellationFeeClientSharePercentage
        - noShowReviewWindowHours
        - noShowReviewReminderHours
        - noShowPayoutPercentage
        - noShowPayoutMinimum
        - noShowPayoutHoldHours
        - noShowLapseRestrictionCount
        - confirmedFaultRestrictionCount
        - disputeLossRestrictionCount
        - maxAttachments
        - requireApproval
        - allowAttachments
        - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        key:
          type: string
          enum:
            - job-posting
          description: Singleton guard (unique).
        maxActiveJobsPerUser:
          type: number
          minimum: 1
          default: 5
          description: 'Limit: maximum simultaneously active jobs one user may have posted.'
        jobPostDurationDays:
          type: number
          minimum: 1
          default: 30
          description: 'Limit: days a job post stays live before it auto-expires.'
        asapFee:
          type: number
          minimum: 0
          default: 100
          description: >-
            Priority (ASAP) fee in PHP charged to the client when posting an ASAP job; read by the Kayod server
            jobController.
        bookingFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 0
          description: >-
            Booking fee: % of the agreed price, charged when agreedPrice >= bookingFeeThreshold. 0 with a 0 minimum = no
            booking fee.
        bookingFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: 'Booking fee: agreed price (PHP) at or above which the percentage applies.'
        bookingFeeMinimum:
          type: number
          minimum: 0
          default: 0
          description: 'Booking fee: flat fee (PHP) charged when the agreed price is below the threshold.'
        clientCancellationFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 10
          description: >-
            Client cancellation, advance tier: % of the agreed price (floored at the minimum, capped at the agreed
            price).
        clientCancellationFeeMinimum:
          type: number
          minimum: 0
          default: 150
          description: 'Client cancellation, advance tier: floor in PHP.'
        clientCancellationFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: >-
            Client cancellation: agreed price above which the percentage applies instead of the flat minimum; 0 = not
            configured (Kayod server uses the active tier's minimum).
        clientCancellationDayOfFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: 'Client cancellation, day-of tier (on/after the confirmed booking day): % of the agreed price.'
        clientCancellationDayOfFeeMinimum:
          type: number
          minimum: 0
          default: 300
          description: 'Client cancellation, day-of tier: floor in PHP.'
        providerStrikeLimit:
          type: number
          minimum: 1
          default: 4
          description: Provider cancellation strikes at which the provider is restricted from accepting jobs.
        providerStrikeRatingPenalty:
          type: number
          minimum: 0
          maximum: 5
          default: 0
          description: >-
            Rating points deducted per strike; 0 keeps the escalating default (0.3 / 0.5 / 0.7 ...). The max of 5 is
            enforced only by the Mongoose schema (400 ValidationError with `details`).
        providerCancellationFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: 'Provider cancellation, advance tier: % of the agreed price (charged in addition to the strike ladder).'
        providerCancellationFeeMinimum:
          type: number
          minimum: 0
          default: 300
          description: 'Provider cancellation, advance tier: floor in PHP.'
        providerCancellationFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: Provider cancellation threshold; 0 = use the active tier's minimum (same rule as the client side).
        providerCancellationDayOfFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 40
          description: 'Provider cancellation, day-of tier: % of the agreed price.'
        providerCancellationDayOfFeeMinimum:
          type: number
          minimum: 0
          default: 600
          description: 'Provider cancellation, day-of tier: floor in PHP.'
        providerCancellationFeeClientSharePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 50
          description: >-
            Share (%) of the provider cancellation fee credited to the client on top of their refund; the remainder goes
            to the platform.
        noShowReviewWindowHours:
          type: number
          minimum: 1
          default: 48
          description: >-
            No-show review: hours from the booking day ending until an unclaimed booking lapses with a full client
            refund.
        noShowReviewReminderHours:
          type: number
          minimum: 0
          default: 24
          description: >-
            No-show review: hours into the window at which the single reminder fires. Must be strictly less than
            noShowReviewWindowHours.
        noShowPayoutPercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: >-
            Reserved-time payout to the provider on an ADJUDICATED client no-show: % of the agreed price (never applied
            automatically).
        noShowPayoutMinimum:
          type: number
          minimum: 0
          default: 300
          description: Reserved-time payout floor in PHP.
        noShowPayoutHoldHours:
          type: number
          minimum: 0
          default: 0
          description: >-
            Hours the no-show payout is held before reaching the provider's available balance; 0 = use the job's own
            release window.
        noShowLapseRestrictionCount:
          type: number
          minimum: 1
          default: 3
          description: Unclaimed no-show lapses within 30 days before the account is restricted automatically.
        confirmedFaultRestrictionCount:
          type: number
          minimum: 0
          default: 2
          description: >-
            Confirmed fault findings within a rolling 30 days before the party is restricted; 0 disables
            auto-restriction (findings are still recorded).
        disputeLossRestrictionCount:
          type: number
          minimum: 0
          default: 3
          description: >-
            Disputes raised and NOT upheld within a rolling 30 days before the raiser is restricted. 0 disables; 1 is
            rejected (must be 0 or >= 2).
        maxAttachments:
          type: number
          minimum: 0
          default: 5
          description: 'Limit: maximum image attachments per job post.'
        requireApproval:
          type: boolean
          default: false
          description: When true, a newly posted job must be approved by an admin before going live.
        allowAttachments:
          type: boolean
          default: true
          description: When true, clients may attach images to a job post.
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          type: string
          description: Session uid (or email, or "unknown") of the admin who last saved via PATCH; absent until the first PATCH.
        __v:
          type: integer
      description: >-
        The singleton JobPostingSettings document (collection `jobpostingsettings`, key `job-posting`). Returned as a
        hydrated Mongoose document, so schema defaults fill any field missing from a stored legacy document. Money
        values are PHP; percentages are 0-100 rates. Values need not be integers (no integer check anywhere).
    ConfigJobPostingSettingsUpdate:
      type: object
      properties:
        maxActiveJobsPerUser:
          type: number
          minimum: 1
          default: 5
          description: 'Limit: maximum simultaneously active jobs one user may have posted.'
        jobPostDurationDays:
          type: number
          minimum: 1
          default: 30
          description: 'Limit: days a job post stays live before it auto-expires.'
        asapFee:
          type: number
          minimum: 0
          default: 100
          description: >-
            Priority (ASAP) fee in PHP charged to the client when posting an ASAP job; read by the Kayod server
            jobController.
        bookingFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 0
          description: >-
            Booking fee: % of the agreed price, charged when agreedPrice >= bookingFeeThreshold. 0 with a 0 minimum = no
            booking fee.
        bookingFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: 'Booking fee: agreed price (PHP) at or above which the percentage applies.'
        bookingFeeMinimum:
          type: number
          minimum: 0
          default: 0
          description: 'Booking fee: flat fee (PHP) charged when the agreed price is below the threshold.'
        clientCancellationFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 10
          description: >-
            Client cancellation, advance tier: % of the agreed price (floored at the minimum, capped at the agreed
            price).
        clientCancellationFeeMinimum:
          type: number
          minimum: 0
          default: 150
          description: 'Client cancellation, advance tier: floor in PHP.'
        clientCancellationFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: >-
            Client cancellation: agreed price above which the percentage applies instead of the flat minimum; 0 = not
            configured (Kayod server uses the active tier's minimum).
        clientCancellationDayOfFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: 'Client cancellation, day-of tier (on/after the confirmed booking day): % of the agreed price.'
        clientCancellationDayOfFeeMinimum:
          type: number
          minimum: 0
          default: 300
          description: 'Client cancellation, day-of tier: floor in PHP.'
        providerStrikeLimit:
          type: number
          minimum: 1
          default: 4
          description: Provider cancellation strikes at which the provider is restricted from accepting jobs.
        providerStrikeRatingPenalty:
          type: number
          minimum: 0
          maximum: 5
          default: 0
          description: >-
            Rating points deducted per strike; 0 keeps the escalating default (0.3 / 0.5 / 0.7 ...). The max of 5 is
            enforced only by the Mongoose schema (400 ValidationError with `details`).
        providerCancellationFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: 'Provider cancellation, advance tier: % of the agreed price (charged in addition to the strike ladder).'
        providerCancellationFeeMinimum:
          type: number
          minimum: 0
          default: 300
          description: 'Provider cancellation, advance tier: floor in PHP.'
        providerCancellationFeeThreshold:
          type: number
          minimum: 0
          default: 0
          description: Provider cancellation threshold; 0 = use the active tier's minimum (same rule as the client side).
        providerCancellationDayOfFeePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 40
          description: 'Provider cancellation, day-of tier: % of the agreed price.'
        providerCancellationDayOfFeeMinimum:
          type: number
          minimum: 0
          default: 600
          description: 'Provider cancellation, day-of tier: floor in PHP.'
        providerCancellationFeeClientSharePercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 50
          description: >-
            Share (%) of the provider cancellation fee credited to the client on top of their refund; the remainder goes
            to the platform.
        noShowReviewWindowHours:
          type: number
          minimum: 1
          default: 48
          description: >-
            No-show review: hours from the booking day ending until an unclaimed booking lapses with a full client
            refund.
        noShowReviewReminderHours:
          type: number
          minimum: 0
          default: 24
          description: >-
            No-show review: hours into the window at which the single reminder fires. Must be strictly less than
            noShowReviewWindowHours.
        noShowPayoutPercentage:
          type: number
          minimum: 0
          maximum: 100
          default: 20
          description: >-
            Reserved-time payout to the provider on an ADJUDICATED client no-show: % of the agreed price (never applied
            automatically).
        noShowPayoutMinimum:
          type: number
          minimum: 0
          default: 300
          description: Reserved-time payout floor in PHP.
        noShowPayoutHoldHours:
          type: number
          minimum: 0
          default: 0
          description: >-
            Hours the no-show payout is held before reaching the provider's available balance; 0 = use the job's own
            release window.
        noShowLapseRestrictionCount:
          type: number
          minimum: 1
          default: 3
          description: Unclaimed no-show lapses within 30 days before the account is restricted automatically.
        confirmedFaultRestrictionCount:
          type: number
          minimum: 0
          default: 2
          description: >-
            Confirmed fault findings within a rolling 30 days before the party is restricted; 0 disables
            auto-restriction (findings are still recorded).
        disputeLossRestrictionCount:
          type: number
          minimum: 0
          default: 3
          description: >-
            Disputes raised and NOT upheld within a rolling 30 days before the raiser is restricted. 0 disables; 1 is
            rejected (must be 0 or >= 2).
          not:
            enum:
              - 1
        maxAttachments:
          type: number
          minimum: 0
          default: 5
          description: 'Limit: maximum image attachments per job post.'
        requireApproval:
          type: boolean
          description: >-
            When true, a newly posted job must be approved by an admin before going live. Coerced with Boolean(), so the
            string "false" becomes true.
        allowAttachments:
          type: boolean
          description: >-
            When true, clients may attach images to a job post. Coerced with Boolean(), so the string "false" becomes
            true.
      description: >-
        Partial update; every field optional, unknown fields (including key/updatedAt/updatedBy) ignored. Each numeric
        field present is coerced with Number() (numeric strings accepted; null and "" become 0) and must be finite and
        >= 0 (400 "<field> must be a non-negative number"). Then the MERGED settings are checked in this order, first
        failure wins (400): maxActiveJobsPerUser >= 1; jobPostDurationDays >= 1; bookingFeePercentage,
        clientCancellationFeePercentage, clientCancellationDayOfFeePercentage, providerCancellationFeePercentage,
        providerCancellationDayOfFeePercentage, providerCancellationFeeClientSharePercentage, noShowPayoutPercentage <=
        100; noShowReviewWindowHours >= 1; noShowReviewReminderHours < noShowReviewWindowHours;
        disputeLossRestrictionCount != 1; noShowLapseRestrictionCount >= 1; providerStrikeLimit >= 1. Remaining schema
        bounds (providerStrikeRatingPenalty <= 5) are enforced on save (400 ValidationError).
    ConfigLegalDocumentId:
      type: string
      enum:
        - termsOfUse
        - clientTerms
        - providerAgreement
        - serviceCategories
        - privacyPolicy
      description: The five documents of the code-side corpus (app/config/legal, presentation order). Unknown ids -> 404.
    ConfigLegalParagraphBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - p
        text:
          type: string
          description: Non-empty after trim.
          minLength: 1
      description: A plain paragraph (lead-ins, recitals).
    ConfigLegalListBlock:
      type: object
      required:
        - type
        - items
      properties:
        type:
          type: string
          enum:
            - clauses
            - bullets
          description: '`clauses` render numbered from the section number (3.1, 3.2 ...); `bullets` are unnumbered.'
        items:
          type: array
          items:
            type: string
            description: Non-empty after trim.
            minLength: 1
          minItems: 1
    ConfigLegalSubBlock:
      type: object
      required:
        - type
        - title
        - blocks
      properties:
        type:
          type: string
          enum:
            - sub
        title:
          type: string
          description: Non-empty after trim.
          minLength: 1
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ConfigLegalBlock'
          minItems: 1
          description: Nested blocks, validated recursively.
      description: A titled sub-part carrying its own blocks.
    ConfigLegalTableBlock:
      type: object
      required:
        - type
        - head
        - rows
      properties:
        type:
          type: string
          enum:
            - table
        head:
          type: array
          items:
            type: string
          minItems: 2
          description: Column headings (at least two). Entry types are not validated.
        rows:
          type: array
          items:
            type: array
            items:
              type: string
          minItems: 1
          description: >-
            Each row must be an array with exactly head.length cells (ragged rows -> 400). Cell contents are not
            validated.
    ConfigLegalBlock:
      description: >-
        One of the five block types the client's LegalBlocks renderer knows. Stored as Mixed (extra keys are kept
        as-is); any other `type` is a 400 naming the offending path, e.g. `sections[2].blocks[0] has unknown type "x"`.
      oneOf:
        - $ref: '#/components/schemas/ConfigLegalParagraphBlock'
        - $ref: '#/components/schemas/ConfigLegalListBlock'
        - $ref: '#/components/schemas/ConfigLegalSubBlock'
        - $ref: '#/components/schemas/ConfigLegalTableBlock'
      discriminator:
        propertyName: type
        mapping:
          p: '#/components/schemas/ConfigLegalParagraphBlock'
          clauses: '#/components/schemas/ConfigLegalListBlock'
          bullets: '#/components/schemas/ConfigLegalListBlock'
          sub: '#/components/schemas/ConfigLegalSubBlock'
          table: '#/components/schemas/ConfigLegalTableBlock'
    ConfigLegalSection:
      type: object
      required:
        - id
        - title
        - blocks
      properties:
        id:
          type: string
          description: Stable slug, non-empty, unique within the document (deep-link target, e.g. Cancellation Policy links).
          minLength: 1
        number:
          type: integer
          minimum: 0
          default: 0
          description: Section number as printed. Optional; if sent must be a non-negative integer (numeric strings accepted).
        title:
          type: string
          description: Section heading without its number; non-empty.
          minLength: 1
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ConfigLegalBlock'
          minItems: 1
      description: Section subdocument (no _id). Keys other than id/number/title/blocks are dropped by the Mongoose sub-schema.
    ConfigLegalDocument:
      type: object
      required:
        - _id
        - documentId
        - title
        - shortTitle
        - intro
        - sections
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        documentId:
          $ref: '#/components/schemas/ConfigLegalDocumentId'
        title:
          type: string
          description: Full title as printed.
        shortTitle:
          type: string
          description: Title for list rows and links.
        subtitle:
          type: string
          default: ''
          description: The document's own subtitle line; may be empty.
        intro:
          type: string
          description: The unnumbered preamble (stored untrimmed).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ConfigLegalSection'
        version:
          type: string
          description: >-
            Version an acceptance of this text must be recorded against. Seeded from LEGAL_VERSION ("2026.08"); changed
            only when an admin sends `version` (or on reset).
          example: '2026.08'
        sourceVersion:
          type: string
          description: >-
            Shipped corpus version the record was seeded from. Never changed by PATCH; differs from `version` once an
            admin marks an amendment.
          example: '2026.08'
        revision:
          type: integer
          minimum: 1
          description: Monotonic per-document counter; +1 on every PATCH (even one that changes nothing) and on every reset.
        lastUpdatedLabel:
          type: string
          description: Human "Last updated" line, seeded from LEGAL_LAST_UPDATED. Not changed by PATCH.
          example: 'Last updated: August 2026'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        updatedBy:
          type: string
          description: Session email (or uid, or "admin") of the last editor; absent on untouched seeded records.
        __v:
          type: integer
      description: >-
        Admin-editable store record (collection `legaldocuments`). Only content is stored; route, icon and audience stay
        in code. Returned lean.
    ConfigLegalDocumentUpdate:
      type: object
      properties:
        title:
          type: string
          description: If present must be non-blank; trimmed.
          minLength: 1
        shortTitle:
          type: string
          description: If present must be non-blank; trimmed.
          minLength: 1
        subtitle:
          type: string
          description: Optional line; a non-string value clears it to "". Trimmed.
        intro:
          type: string
          description: If present must be non-blank; stored untrimmed.
          minLength: 1
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ConfigLegalSection'
          minItems: 1
          description: If present, REPLACES all sections; validated in full (first error -> 400 with a path-qualified message).
        version:
          type: string
          description: If present must be non-blank; trimmed. How an admin marks an amendment; omitted -> version unchanged.
          minLength: 1
      description: All fields optional; documentId, sourceVersion, revision and lastUpdatedLabel cannot be set.
    ConfigAdOverlay:
      type: object
      properties:
        id:
          type: string
          default: ''
          description: Client-side key.
        kind:
          type: string
          enum:
            - text
            - button
          default: text
        text:
          type: string
          default: ''
        color:
          type: string
          default: '#FFFFFF'
          description: Text colour.
        bgColor:
          type: string
          default: '#E37F0D'
          description: Button background.
        position:
          type: string
          enum:
            - top-left
            - top-right
            - center
            - bottom-left
            - bottom-right
          default: bottom-left
      description: Text or button element overlaid on an image ad (subdocument, no _id). Enum violations -> 400 ValidationError.
    ConfigAdvertisement:
      type: object
      required:
        - _id
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        type:
          type: string
          enum:
            - invite
            - offer
            - image
          default: offer
          description: >-
            Banner variant (Kayod client PromoBanner): invite = referral banner (teal, two-line title, orange CTA);
            offer = discount banner (peach); image = full-bleed uploaded image.
        title:
          type: string
          default: ''
          description: 'invite: line 1 / offer: title.'
        subtitle:
          type: string
          default: ''
          description: 'offer: description.'
        highlight:
          type: string
          default: ''
          description: 'invite: line 2 / offer: discount text (e.g. "20% off").'
        ctaLabel:
          type: string
          default: ''
          description: Button label, e.g. "Refer Now".
        imageUrl:
          type: string
          default: ''
          description: 'image: the banner itself; invite/offer: optional background photo. ImageKit URL from upload-image.'
        imageFileId:
          type: string
          default: ''
          description: ImageKit fileId, used to delete the image. Also exposed by the public endpoint.
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/ConfigAdOverlay'
          default: []
        linkAction:
          type: string
          maxLength: 512
          pattern: ^(|[A-Za-z][A-Za-z0-9]{0,63}|[Hh][Tt][Tt][Pp][Ss]://[^\s/$.?#][^\s]*)$
          description: >-
            Tap action: "" (none), a Kayod client route name, or an https:// URL. Validated on the trimmed String()
            value: length <= 512 (else 400 "Link is too long") and either `/^[A-Za-z][A-Za-z0-9]{0,63}$/` (route name)
            or `/^https:\/\/[^\s/$.?#][^\s]*$/i` (else 400 "Navigate-to must be a screen name or an https:// link").
            http://, javascript:, data: etc. are rejected. Route names are not checked against the client's navigator —
            they must exist on the AppNavigator root stack / tabs to work.
          default: ''
        status:
          type: string
          enum:
            - draft
            - published
            - paused
          description: >-
            Admin lifecycle: draft = never live, paused = taken down. Kept in sync with isActive (published <=> isActive
            true). No schema default — documents written before the field existed lack it.
        isActive:
          type: boolean
          default: true
          description: What the client app filters on.
        order:
          type: number
          default: 0
          description: 'Carousel position; the client sorts by { order: 1, createdAt: 1 }.'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
      description: >-
        Advertisement for the Kayod client home-screen promo carousel (collection `advertisements`). There are no
        start/end scheduling fields: visibility is only status/isActive, and position is `order`. Lean reads of legacy
        documents may omit defaulted fields.
    ConfigAdvertisementInput:
      type: object
      properties:
        type:
          type: string
          enum:
            - invite
            - offer
            - image
          description: Default `offer` on create. Other values -> 400 ValidationError.
        title:
          type: string
        subtitle:
          type: string
        highlight:
          type: string
        ctaLabel:
          type: string
        imageUrl:
          type: string
          description: >-
            On CREATE, required (truthy) when type is `image` (400 "An image ad requires an uploaded image"). Not
            checked on update.
        imageFileId:
          type: string
          description: >-
            On UPDATE, sending a value different from the stored non-empty fileId deletes the old ImageKit file first
            (best-effort, before the save).
        overlays:
          type: array
          items:
            $ref: '#/components/schemas/ConfigAdOverlay'
        linkAction:
          type: string
          maxLength: 512
          pattern: ^(|[A-Za-z][A-Za-z0-9]{0,63}|[Hh][Tt][Tt][Pp][Ss]://[^\s/$.?#][^\s]*)$
          description: >-
            Tap action: "" (none), a Kayod client route name, or an https:// URL. Validated on the trimmed String()
            value: length <= 512 (else 400 "Link is too long") and either `/^[A-Za-z][A-Za-z0-9]{0,63}$/` (route name)
            or `/^https:\/\/[^\s/$.?#][^\s]*$/i` (else 400 "Navigate-to must be a screen name or an https:// link").
            http://, javascript:, data: etc. are rejected. Route names are not checked against the client's navigator —
            they must exist on the AppNavigator root stack / tabs to work.
        status:
          type: string
          enum:
            - draft
            - published
            - paused
          description: >-
            If sent must be draft|published|paused (else 400 "Status must be draft, published or paused") and it wins:
            isActive is set to (status === "published"), overriding any isActive sent. If only isActive is sent, status
            is derived: true -> published; false -> paused, or stays draft if the ad is currently a draft. Neither sent
            on create -> published + isActive true.
        isActive:
          type: boolean
          description: Legacy toggle; see status.
        order:
          type: number
          description: Carousel position. Omitted on create -> (highest existing order) + 1, or 0 for the first ad.
      description: Only these editable fields are picked from the body; anything else is ignored. All optional.
    ConfigQuickAccessDebugItem:
