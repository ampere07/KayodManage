        budget:
          type: number
          description: Job budget (0 for quoted jobs).
    TransactionsTransactionView:
      type: object
      description: >-
        A Transaction document (lean, so no `id` virtual and no schema defaults filled in) with users and job populated,
        plus the frontend-compatibility aliases. Returned by GET /api/transactions/{transactionId} (non-fee_record).
      required:
        - _id
        - transactionType
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        fromUser:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: Overwritten with `fromUser || fromUserId` (absent when neither resolves).
        fromUserId:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: Populated sender (newer key written by the Kayod app).
        toUser:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: Overwritten with `toUser || toUserId` (absent when neither resolves).
        toUserId:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: Populated recipient (newer key).
        amount:
          type: number
          description: Amount in PHP (min 0).
        type:
          type: string
          enum:
            - immediate_payment
            - job_budget_deduction
            - job_budget_refund
            - job_escrow
            - escrow_payment
            - escrow_release
            - wallet_topup
            - fee_payment
            - refund
            - refund_request
            - compensation
            - platform_fee
            - withdrawal
            - xendit_topup
            - referral_bonus
            - premium_subscription
            - cancellation_fee
            - no_show_payout
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
            - held
            - expired
            - refunded
            - escrowed
        jobId:
          allOf:
            - $ref: '#/components/schemas/TransactionsJobSummary'
          nullable: true
          description: Populated job (with nested userId/assignedToId); null if dangling, absent if unset.
        description:
          type: string
        metadata:
          type: object
          description: Free-form (Mixed). For xendit_topup, `xenditPaymentMethod` is surfaced as `paymentMethod`.
        platformFee:
          type: number
        currency:
          type: string
          example: PHP
        exchangeRate:
          type: number
        complianceChecked:
          type: boolean
        maxRetries:
          type: integer
        retryCount:
          type: integer
        xenditWebhookEvents:
          type: array
          items:
            type: object
        xenditId:
          type: string
        paymentMethod:
          type: string
          description: >-
            Stored paymentMethod (wallet | xendit | bank_transfer), except for xendit_topup rows carrying
            `metadata.xenditPaymentMethod`, where that value (e.g. a Xendit channel name) is returned instead.
        completedAt:
          $ref: '#/components/schemas/DateTime'
        failedAt:
          $ref: '#/components/schemas/DateTime'
        failureReason:
          type: string
        refundStatus:
          type: string
          enum:
            - pending
            - approved
            - declined
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
        transactionType:
          type: string
          enum:
            - transaction
        fromUserData:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: '`fromUser || fromUserId`. Absent when neither resolves.'
        toUserData:
          allOf:
            - $ref: '#/components/schemas/TransactionsUserSummary'
          nullable: true
          description: '`toUser || toUserId`. Absent when neither resolves.'
        job:
          allOf:
            - $ref: '#/components/schemas/TransactionsJobSummary'
          nullable: true
          description: Alias of `jobId`.
    TransactionsTransactionListRow:
      description: 'A Transaction row in the list: the detail view plus `userId`/`user` aliases.'
      allOf:
        - $ref: '#/components/schemas/TransactionsTransactionView'
        - type: object
          properties:
            userId:
