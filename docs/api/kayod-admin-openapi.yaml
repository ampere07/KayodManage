  /api/support/chatsupports/{chatSupportId}/close:
    put:
      operationId: closeChatSupport
      tags:
        - Support
      summary: Resolve (close) a support ticket
      description: >-
        Requires an authenticated admin session (authMiddleware + adminAuth): 401 without a session or when the admin
        account is no longer active/admin (session destroyed), 403 when the session role is not admin/superadmin.


        Checks, in order: 404 if the ticket does not exist; 403 "Accept this ticket before resolving it" if acceptedBy
        is empty (applies to superadmins too); 403 if the caller does not own it (a superadmin may act on any ticket; an
        admin only on tickets whose assignedTo is their own id (403 "Accept this ticket before modifying it"
        otherwise)); 400 "Only open chats can be closed" if already closed.


        Writes (findByIdAndUpdate, validators off): status "closed", closedAt now, lastMessage,
        assignedTo/assignedToName = caller if still empty; pushes statusHistory `{ status: "resolved", performedBy,
        performedByName, timestamp, reason: reason || "Ticket closed" }` and an Admin message "Ticket has been resolved"
        (": <reason>" appended when given). Then $inc ticketsResolved on the admin's User and ticketsSubmittedResolved
        on the ticket user's User (each best effort). ActivityLog row `support_closed` (metadata reason, userName).
        Socket `support:chat_updated` with updates { status, closedAt, updatedAt, messages, statusHistory, displayStatus
        } to rooms `admin` and `support:<id>`. Outbound: awaits POST `{KAYOD_BACKEND_URL}/api/support/broadcast-message`
        (default http://localhost:8080) with header x-api-key (KAYOD_API_KEY, else a hardcoded fallback) and body `{
        chatSupportId, message: { _id, senderId, senderName, senderType, message, timestamp } }` for the close message,
        so the mobile app receives it. No timeout is set; failures are logged and ignored.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: chatSupportId
          in: path
          required: true
