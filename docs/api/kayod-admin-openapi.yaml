    LegacyReportsListJob:
      type: object
      description: >-
        The populated Job (selected fields only, plus the Job `id` virtual) enriched with derived fields. When the job
        document no longer exists, a placeholder is returned instead: `_id: null`, `title: "[Job Not Found]"`,
        `isDeleted: true`, `deletionReason: "Record not found"`, `createdAt` = report createdAt, and no
