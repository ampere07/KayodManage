            media/status, _id usually absent). In the status-update response it is null when the job is gone.
        jobDetails:
          $ref: '#/components/schemas/ReportsJobDetailsSnapshot'
        reportedByDetails:
          $ref: '#/components/schemas/ReportsReportedByDetails'
        reportedBy:
          allOf:
            - $ref: '#/components/schemas/ReportsUserRef'
          nullable: true
        jobPosterId:
          allOf:
            - $ref: '#/components/schemas/ReportsUserRef'
          nullable: true
        reportedUserId:
          allOf:
            - $ref: '#/components/schemas/ReportsUserRef'
          nullable: true
        reason:
          $ref: '#/components/schemas/ReportsStoredReason'
        comment:
          type: string
          description: Max 1000 chars.
        status:
          $ref: '#/components/schemas/ReportsStoredStatus'
        reviewedBy:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Not populated.
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        adminNotes:
          type: string
          description: Max 1000 chars.
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    ReportsReportedPostStats:
      type: object
