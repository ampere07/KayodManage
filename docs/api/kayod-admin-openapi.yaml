  /api/configurations/upload-category-icon:
    post:
      tags:
        - Configurations
      operationId: uploadCategoryIcon
      summary: Upload a category icon file to the local asset folders
      description: >-
        Requires a file (400 "No file uploaded") and categoryName (400 "Category name is required"). File name =
        `<slug><original extension>` where slug = categoryName lowercased, whitespace -> "-", characters outside
        [a-z0-9-] removed. Writes to the SERVER HOST filesystem, not ImageKit:
        `<repos>/kayod/client/src/assets/icons/categories/` and `KayodManage/Frontend/public/assets/icons/categories/`
        (folders created if missing), after deleting every file in the kayod folder whose base name equals the slug or
        starts with `<slug>-` (and the same names in the Manage folder) — so uploading for "Home" also deletes
        "home-repair.*". Does NOT update any category: the caller saves `iconName` via PATCH /job-categories/{id}.
        `oldIcon` is read but unused. No audit row. Filesystem errors -> 500 "Failed to upload icon". Multer (memory
        storage, single file, 5 MB limit, image/* only) runs after adminAuth. Its rejections are plain Errors that
        errorHandler does not classify, so they come back as **500** (never 400/413): a non-image mimetype -> 500 "Only
        image files are allowed"; a file over 5 MB -> 500 "File too large" (MulterError LIMIT_FILE_SIZE); a file under
        any other field name -> 500 "Unexpected field". In NODE_ENV=development the 500 body also carries `stack`. Auth:
        adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an admin
        account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - icon
                - categoryName
              properties:
                icon:
                  type: string
                  format: binary
                  description: Image file (image/* mimetype, <= 5 MB).
                categoryName:
                  type: string
                  description: Required. Used to build the file name.
                oldIcon:
                  type: string
                  description: Accepted but ignored.
            encoding:
              icon:
                contentType: image/*
      responses:
        '200':
          description: Icon written.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - iconName
                  - fullPath
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  iconName:
                    type: string
                    description: Value to store on the category, `custom:<slug><ext>`.
                    example: custom:home-repair.png
                  fullPath:
                    type: string
                    description: Path served by the admin frontend.
                    example: /assets/icons/categories/home-repair.png
                  message:
                    type: string
                    example: Icon uploaded successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/configurations/upload-profession-icon:
    post:
      tags:
        - Configurations
      operationId: uploadProfessionIcon
      summary: Upload a profession icon to ImageKit (and optionally assign it)
      description: >-
        Requires a file (400 "No file uploaded") and professionName (400 "Profession name is required"). slug =
        professionName with camelCase split to kebab, lowercased, trimmed, whitespace -> "-", characters outside
        [a-z0-9-] removed, dashes collapsed (must match the Kayod client's name-derived resolver). Steps: (1) uploads to
        ImageKit folder `professionIconsUpload` under a staging name `tmp-<slug>-<ts>-<rand>.webp` (pre-transformation
        q-80,w-256,h-256,fo-auto); (2) if the client has disconnected by then (e.g. user cancelled), deletes the staged
        file, leaves the icon unchanged and sends NO response; (3) best-effort deletes any existing `<slug>.webp` and
        the `oldIcon` file (when `ik:` and differently named), then renames the staged file to `<slug>.webp` (CDN
        purge); (4) if professionId is sent, sets that profession's icon to `ik:/professionIconsUpload/<slug>.webp` and
        saves the category (no job/draft cascade). Not wrapped in asyncHandler: any failure — ImageKit error,
        professionId not found or malformed — returns 500 `{success:false, message:"Failed to upload profession icon",
        error:<raw message>}` after deleting the staged file if still present; note step 3 may already have replaced the
        live ImageKit file. No audit row. The handler also tries to emit `configuration:updated` on the /admin
        namespace, but configurationsController captures `io` at module load via a circular `require("../../server")`
        (server.js has not set module.exports yet), so `io` is always undefined and no event is sent. Multer (memory
        storage, single file, 5 MB limit, image/* only) runs after adminAuth. Its rejections are plain Errors that
        errorHandler does not classify, so they come back as **500** (never 400/413): a non-image mimetype -> 500 "Only
        image files are allowed"; a file over 5 MB -> 500 "File too large" (MulterError LIMIT_FILE_SIZE); a file under
        any other field name -> 500 "Unexpected field". In NODE_ENV=development the 500 body also carries `stack`. Auth:
        adminAuth — no session / non-admin session -> 403 `{success:false,error:"Admin access required"}`; an admin
        account that is now deactivated, demoted or deleted -> 401 and the session is destroyed.
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - icon
                - professionName
              properties:
                icon:
                  type: string
                  format: binary
                  description: Image file (image/* mimetype, <= 5 MB). Stored under a .webp name regardless of format.
                professionName:
                  type: string
                  description: Required. Determines the ImageKit file name.
                professionId:
                  allOf:
                    - $ref: '#/components/schemas/ObjectId'
                  description: Optional. When sent, the profession's icon field is updated in the DB.
                oldIcon:
                  type: string
                  description: >-
                    Optional previous icon (`ik:/professionIconsUpload/<file>`); its file is deleted when its name
                    differs from `<slug>.webp`.
            encoding:
              icon:
                contentType: image/*
      responses:
        '200':
          description: Icon uploaded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - iconName
                  - fullPath
                  - message
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  iconName:
                    type: string
                    description: Stored icon reference.
                    example: ik:/professionIconsUpload/pipe-fitter.webp
                  fullPath:
                    type: string
                    description: 'Public URL: `<IMAGEKIT_URL_ENDPOINT>/professionIconsUpload/<slug>.webp`.'
                    format: uri
                  message:
                    type: string
                    example: Profession icon uploaded to ImageKit successfully
                  professionId:
                    allOf:
                      - $ref: '#/components/schemas/ObjectId'
                    description: Echo of the form field; omitted when not sent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dashboard/activity:
    get:
      operationId: getActivity
      tags:
        - Dashboard
      summary: Recent platform activity feed (stored or synthesised)
      description: >-
        Returns the 50 newest `activityfeeds` rows (lean; `userId` populated with name,email, `jobId` with title), each
        with `timestamp` = `createdAt`. When that collection is empty (the usual case) a feed is synthesised from live
        data: the 10 newest users (`user_registered`), 10 newest jobs (`job_posted`, or `job_completed` when the job's
        status is completed) and 10 newest completed transactions (`payment_completed`), sorted by timestamp desc,
        capped at 50, each with `metadata.generatedFromData: true` and a prefixed string `_id`. Generator defects: jobs
        select `client`, which the Job schema does not declare (the owner is `userId`), so job items always have
        `userId: null`; transactions select `from`, which the Transaction schema does not declare
        (`fromUser`/`fromUserId`), so `payment_completed` items are never produced. If synthesis throws, `[]` is
        returned. Read-only; no query parameters. Access: `adminAuth` — the session must have `isAuthenticated` and a
        cached role of admin/superadmin, otherwise 403 `Admin access required` (an unauthenticated caller gets 403, not
        401). The account is then re-read from `users`: if it no longer exists, is not `accountStatus: active`, or is no
        longer admin/superadmin, the session is destroyed and 401 `Your admin access has ended. Please sign in again.`
        is returned. If that lookup itself throws, the request proceeds on the cached session data. Per-page
        `permissions` flags are NOT checked by the server. Unexpected errors → 500 `Failed to fetch activity feed`.
      security:
        - sessionCookie: []
      x-access: admin
      responses:
        '200':
          description: Activity items, newest first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DashboardActivityItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dashboard/alerts:
    get:
      operationId: getAlerts
      tags:
        - Dashboard
      summary: Active dashboard alerts, minus those this admin dismissed
      description: >-
        Loads up to 20 stored Alerts with `isActive: true`, sorted by priority desc then createdAt desc, populating
        `userId` (name,email), `jobId` (title) and — in full — `reportId`, `verificationId` and `supportId` (the whole
        support ticket, including every message and internal note). If there are none, synthesises up to 20 alerts from
        live data: ReportedPosts with status `pending` (a LEGACY status — canonical reports are `open`, so current
        reports never produce alerts), CredentialVerifications with status `pending` (not the schema default
        `under_review`), and open support tickets that have an unread message from the user (up to 10 of each source
        queried); if synthesis throws (e.g. a report with no `reason`), `[]` is returned. Finally, alerts whose id is in
        this admin's DismissedAlert rows are removed — after the 20-item limit, so fewer than 20 can be returned even
        when more exist; synthesised alerts can never match a dismissal. `isRead` is not used for filtering. Read-only;
        no query parameters. Access: `adminAuth` — the session must have `isAuthenticated` and a cached role of
        admin/superadmin, otherwise 403 `Admin access required` (an unauthenticated caller gets 403, not 401). The
        account is then re-read from `users`: if it no longer exists, is not `accountStatus: active`, or is no longer
        admin/superadmin, the session is destroyed and 401 `Your admin access has ended. Please sign in again.` is
        returned. If that lookup itself throws, the request proceeds on the cached session data. Per-page `permissions`
        flags are NOT checked by the server. Unexpected errors → 500 `Failed to fetch alerts`.
      security:
        - sessionCookie: []
      x-access: admin
      responses:
        '200':
          description: Alerts, highest priority first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/DashboardAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dashboard/alerts/{alertId}/read:
    patch:
      operationId: markAlertAsRead
      tags:
        - Dashboard
      summary: Mark a stored alert as read
      description: >-
        `Alert.findByIdAndUpdate(alertId, { isRead: true })` — no upsert, no existence check: a well-formed id that
        matches nothing still returns 200 `{ success: true }`. `isRead` is a single global flag (not per admin) and GET
        /alerts does not filter on it, so the alert keeps appearing. Synthesised alert ids (`report_…`,
        `verification_…`, `support_…`) and other malformed ids fail ObjectId casting → 400 `Invalid _id`. No request
        body, no audit-log row, no socket event. Access: `adminAuth` — the session must have `isAuthenticated` and a
        cached role of admin/superadmin, otherwise 403 `Admin access required` (an unauthenticated caller gets 403, not
        401). The account is then re-read from `users`: if it no longer exists, is not `accountStatus: active`, or is no
        longer admin/superadmin, the session is destroyed and 401 `Your admin access has ended. Please sign in again.`
        is returned. If that lookup itself throws, the request proceeds on the cached session data. Per-page
        `permissions` flags are NOT checked by the server. Unexpected errors → 500 `Failed to mark alert as read`.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: alertId
          in: path
          required: true
          description: Stored Alert `_id` (24-hex ObjectId).
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Update issued (whether or not a document matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/dashboard/popular-jobs:
