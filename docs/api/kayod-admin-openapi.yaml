  /api/admin/configurations/advertisements/upload-image:
    post:
      tags:
        - Configurations
      operationId: uploadAdvertisementImageAdminMount
      summary: Upload a banner image to ImageKit
      description: >-
        Requires a file (400 "No image file provided"). Builds `<base>.webp` from the optional `name` field (lowercased,
        runs of non-[a-z0-9] -> "-", leading/trailing dashes stripped, max 40 chars, default "ad") and uploads to
        ImageKit folder `advertisements` with useUniqueFileName=true, tag `advertisement` and pre-transformation
        q-80,w-1080 (width cap, aspect kept). Does not create or modify an Advertisement — the caller sends url/fileId
        as imageUrl/imageFileId; an upload that is never saved is not cleaned up. No audit row. ImageKit failure -> 500
        "Failed to upload image". Multer (memory storage, single file, 5 MB limit, image/* only) runs after adminAuth.
        Its rejections are plain Errors that errorHandler does not classify, so they come back as **500** (never
        400/413): a non-image mimetype -> 500 "Only image files are allowed"; a file over 5 MB -> 500 "File too large"
        (MulterError LIMIT_FILE_SIZE); a file under any other field name -> 500 "Unexpected field". In
        NODE_ENV=development the 500 body also carries `stack`. Auth: adminAuth — no session / non-admin session -> 403
        `{success:false,error:"Admin access required"}`; an admin account that is now deactivated, demoted or deleted ->
        401 and the session is destroyed.


        Same handler as `POST /api/configurations/advertisements/upload-image` (second mount of the configurations
        router; the admin panel uses this one).
      security:
        - sessionCookie: []
      x-access: admin
      requestBody:
        required: true
        content:
