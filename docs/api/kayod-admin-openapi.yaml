      tags:
        - Dashboard
      summary: Platform-fee revenue per day or per week for the last N days
      description: >-
        Sums completed `platform_fee` Transactions per bucket, matching on `completedAt` in the bucket, or `createdAt`
        in the bucket when `completedAt` is null. `days` ≤ 31 → one bucket per calendar day (server-local), oldest
        first, `days` buckets ending today. `days` > 31 → `ceil(days / 7)` rolling 7-day buckets ending today. One query
        per bucket, run sequentially, and `days` has no upper bound (a very large value runs thousands of queries). A
        negative `days` returns `[]`. Read-only. Access: `adminAuth` — the session must have `isAuthenticated` and a
        cached role of admin/superadmin, otherwise 403 `Admin access required` (an unauthenticated caller gets 403, not
        401). The account is then re-read from `users`: if it no longer exists, is not `accountStatus: active`, or is no
        longer admin/superadmin, the session is destroyed and 401 `Your admin access has ended. Please sign in again.`
        is returned. If that lookup itself throws, the request proceeds on the cached session data. Per-page
        `permissions` flags are NOT checked by the server. Unexpected errors → 500 `Failed to fetch revenue chart data`.
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: days
