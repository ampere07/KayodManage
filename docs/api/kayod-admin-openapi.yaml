        icon:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          description: >-
            Job status (`open`, `in_progress`, `scheduled`, `completed`, `cancelled`, `expired`); placeholder uses
            `unknown`/`deleted`.
        formattedBudget:
          type: string
          description: formatPHPCurrency(budget).
        isDeleted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
        deletionReason:
          type: string
          nullable: true
        user:
          allOf:
            - $ref: '#/components/schemas/LegacyReportsPopulatedUser'
          nullable: true
          description: >-
            Requested via a nested populate of the Job `user` virtual, but the populate select omits `userId`, so it
            never resolves: null or absent in practice. Use `jobPosterId` for the poster.
        budgetInfo:
          $ref: '#/components/schemas/LegacyReportsBudgetInfo'
        hasMedia:
          type: boolean
        mediaCount:
          type: integer
        mediaTypes:
          type: array
          items:
            type: string
            enum:
              - image
              - video
              - file
          description: Per media URL, classified by file extension.
        isDeletionFromReport:
          description: '`isDeleted && deletionReason`: false/null when not deleted, otherwise the deletionReason string.'
          oneOf:
            - type: string
              nullable: true
            - type: boolean
        deletionInfo:
          type: object
          nullable: true
          description: null unless the job is soft-deleted.
          properties:
            deletedAt:
              type: string
              format: date-time
              nullable: true
            deletionReason:
              type: string
              nullable: true
            isDeletedFromReport:
              description: deletionReason contains "report"; null/empty-string when there is no deletionReason.
              oneOf:
                - type: boolean
                - type: string
                  nullable: true
    LegacyReportsDetailJob:
      type: object
      description: >-
        The populated Job enriched with derived fields. When the job is missing (or has no title), a placeholder is
        returned: `_id: "deleted"`, `title: "[Deleted Job]"`, `status: "deleted"`, `isDeleted: true`, `user: {name:
        "Unknown", email: "unknown@example.com"}`, `hasMedia: false`, `mediaCount: 0`. For a live job `isDeleted` is
        hard-coded to false — even for a soft-deleted job, since isDeleted is not selected.
      required:
        - _id
        - title
        - formattedBudget
        - budgetInfo
        - isDeleted
        - hasMedia
        - mediaCount
      properties:
        _id:
          type: string
          description: Job ObjectId (24-hex), or the literal string "deleted" on the placeholder.
        id:
          type: string
          description: Job `id` virtual (real jobs only).
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: object
          nullable: true
          description: Job.location is a Mixed field written by the Kayod app; usually an object like below.
          properties:
            latitude:
              type: number
            longitude:
              type: number
            address:
              type: string
            name:
              type: string
            city:
              type: string
            region:
              type: string
            country:
              type: string
        budget:
          type: number
        budgetType:
          type: string
          description: '`fixed` | `flexible` on real jobs; `unknown` on the placeholder.'
        paymentMethod:
          type: string
          description: '`wallet` | `xendit` on real jobs; `unknown` on the placeholder.'
        media:
          type: array
          items:
            type: string
            description: Media URL.
        icon:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          description: >-
            Job status (`open`, `in_progress`, `scheduled`, `completed`, `cancelled`, `expired`); placeholder uses
            `unknown`/`deleted`.
        formattedBudget:
          type: string
          description: formatPHPCurrency(budget).
        user:
          type: object
          nullable: true
          description: >-
            On real jobs this is the Job `user` virtual, which never resolves (the select includes `user` but not
            `userId`), so it is null or absent. On the placeholder it is `{name: "Unknown", email:
            "unknown@example.com"}`.
          properties:
            _id:
              $ref: '#/components/schemas/ObjectId'
            id:
              type: string
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            isCurrentlyRestricted:
              type: boolean
        budgetInfo:
          $ref: '#/components/schemas/LegacyReportsBudgetInfo'
        isDeleted:
          type: boolean
        hasMedia:
          type: boolean
        mediaCount:
          type: integer
