        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      security:
        - sessionCookie: []
      x-access: admin
      operationId: updateVerificationStatus
      tags:
        - Verifications
      summary: Review a credential verification (approve, reject, request resubmission, flag, ...), optionally banning the user
      description: >-
        Requires an admin session (adminAuth): no authenticated admin/superadmin session -> 403 `Admin access required`;
        a session whose account is no longer active or no longer an admin is destroyed -> 401. Validation: the id must
        be a valid ObjectId (else 400 "Invalid verification ID format"); `status` is trimmed and lower-cased, the
        aliases "resubmission requested", "request resubmission", "request for resubmission", "reqeust for resubmission"
        and "resubmit" map to `resubmission_requested`, and the result must be one of pending, approved, rejected,
        under_review, resubmission_requested, flagged (else 400 "Invalid status value: <value>"); `rejected` requires a
        non-blank rejectionReason (else 400). A non-string status/rejectionReason throws a TypeError -> 500. Side
        effects, NOT transactional: (1) CredentialVerification.findByIdAndUpdate $set {status, adminNotes (only when
        sent — undefined keys are stripped), reviewedAt: now, reviewedBy: the admin id (null if not an ObjectId)} plus
        rejectionReason when status is rejected/resubmission_requested/flagged and one is sent (an old rejectionReason
        is NOT cleared on approve). No schema validators run. A missing record throws "Verification not found", which
        this handler returns as 500 (not 404). (2) User.updateOne on the verification's user (no validators):
        credentialVerificationStatus = status (`under_review` is written even though the User enum lacks it); isVerified
        = true for approved, false for every other status; if status is `rejected` AND banUser is truthy: accountStatus
        `banned` and restrictionDetails = {type: banned, reason: rejectionReason, restrictedBy: admin id, restrictedAt:
        now, appealAllowed: false, expiresAt: null}. The legacy isRestricted flag is not synced, the user's sessions are
        not ended, and no separate ban audit row is written. A failure here returns an error although step 1 is already
        saved. (3) For approved/rejected only: audit row `verification_approved` / `verification_rejected` (targetType
        `verification`, targetModel `User`, targetId = user id, metadata {verificationId, rejectionReason}, ipAddress)
        plus `activity:new` to the superadmins socket room; if the user document is gone this step throws -> 500 after
        the writes. (4) Best-effort Notification to the provider (type `credential_verification`, priority `high`, data
        {verificationId, status}): rejected -> "Verification Rejected" with the reason; resubmission_requested ->
        "Resubmission Requested" with the stored adminNotes (only if non-empty — possibly notes from an earlier review).
        (5) Best-effort socket `user:updated` on the /admin namespace, room `admin`: {user: full userService.getUserById
        payload, updateType: "verified" if approved else "unverified", timestamp}.
      parameters:
        - name: verificationId
          in: path
          required: true
          description: CredentialVerification id.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  description: >-
                    New status (case/whitespace-insensitive). Besides the enum values, the aliases "resubmission
                    requested", "request resubmission", "request for resubmission", "reqeust for resubmission" and
                    "resubmit" are accepted as resubmission_requested.
                  enum:
                    - pending
                    - approved
                    - rejected
                    - under_review
                    - resubmission_requested
                    - flagged
                adminNotes:
                  type: string
                  description: Stored as-is when present. For resubmission_requested it becomes the provider notification text.
                rejectionReason:
                  type: string
                  description: >-
                    Required (non-blank) when status is rejected. Stored only for
                    rejected/resubmission_requested/flagged. Used as the ban reason and in the rejection notification.
                banUser:
                  type: boolean
                  description: 'Only honoured with status `rejected`: bans the user (accountStatus banned, appeal not allowed).'
                  default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Verification status updated successfully
                  data:
                    $ref: '#/components/schemas/VerificationsVerification'
        '400':
          description: >-
            Invalid id format ({success, message} only), invalid status, missing rejection reason, or a Mongoose
            ValidationError/CastError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationsUpdateError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Any other failure, including "Verification not found" and a TypeError on non-string input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationsUpdateError'
