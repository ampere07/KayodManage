        total:
          type: integer
          description: Number of pages.
        totalReports:
          type: integer
          description: Number of matching documents.
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
      required:
        - current
        - total
        - totalReports
        - hasNext
        - hasPrev
    ReportsPopulatedJob:
      type: object
      description: >-
        ReportedPost.jobId populated with `title description category budget budgetType paymentMethod location media
