      summary: A user's verification images for one attempt (ImageKit, then Cloudinary, then DB)
      description: >-
        Requires an admin session (adminAuth): no authenticated admin/superadmin session -> 403 `Admin access required`;
        a session whose account is no longer active or no longer an admin is destroyed -> 401. Read-only, but makes
        outbound calls. Loads all of the user's credentialverifications records (submittedAt ascending; 404 if none).
        The selected attempt index is `attempt - 1` clamped to the existing records (latest when omitted). Image lookup
        by folder `verificationUpload/<First>_<Last>/Attempt<n>` (from the user's name, non-alphanumerics stripped; <n>
        is the requested attempt as sent, not clamped): (1) ImageKit listFiles; (2) if nothing is found and Cloudinary
        is configured, a Cloudinary folder search (max 100, public_id asc); provider errors are logged and fall through.
        Files are classified by name prefix `face_` / `frontID_` / `backID_`, everything else as credentials; the
        Cloudinary mapping also fills empty slots by position. (3) Otherwise the stored faceVerification / validId /
        credentials of the selected record are returned. The folder is derived from the name only, so two users with the
        same first and last name resolve to the same folder.
      parameters:
