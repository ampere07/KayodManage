      description: >-
        Server-to-server only (supportServiceAuth): the `x-api-key` header must equal SUPPORT_SERVICE_KEY (falling back
        to KAYOD_API_KEY, and outside production to a built-in development key), compared in constant time. 401 on a
        wrong/missing key; 503 when no key is configured (production with neither env var set).


