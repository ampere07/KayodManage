          nullable: true
          description: Populated sender (newer key written by the Kayod app).
        toUser:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Recipient (not populated).
        toUserId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Recipient (not populated).
        amount:
          type: number
          description: Amount in PHP (min 0).
        type:
          type: string
          enum:
            - refund_request
            - refund
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - cancelled
            - held
            - expired
            - refunded
            - escrowed
        jobId:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Job the refund is for (not populated).
        description:
          type: string
        metadata:
          type: object
          description: Free-form (Mixed). For xendit_topup, `xenditPaymentMethod` is surfaced as `paymentMethod`.
        platformFee:
          type: number
        currency:
          type: string
          example: PHP
        exchangeRate:
          type: number
        complianceChecked:
          type: boolean
        maxRetries:
          type: integer
        retryCount:
          type: integer
        xenditWebhookEvents:
          type: array
          items:
            type: object
        xenditId:
          type: string
        paymentMethod:
          type: string
          enum:
            - wallet
            - xendit
            - bank_transfer
        completedAt:
          $ref: '#/components/schemas/DateTime'
        failedAt:
          $ref: '#/components/schemas/DateTime'
        failureReason:
          type: string
        refundStatus:
          type: string
          enum:
            - pending
            - approved
            - declined
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
    TransactionsRefundResult:
