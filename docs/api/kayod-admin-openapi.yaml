        - images
        - client
        - job
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        rating:
          type: number
          description: Overall stars 1–5.
        review:
          type: string
          description: Review text; "" when none.
        categoryRatings:
          type: array
          items:
            $ref: '#/components/schemas/UsersCategoryRating'
          description: '[] when none.'
        images:
          type: array
          items:
            type: string
          description: '[] when none.'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        client:
          allOf:
            - type: object
              required:
                - _id
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                name:
                  type: string
                profileImage:
                  type: string
                  nullable: true
          nullable: true
          description: The reviewing client (name, profileImage); null if not found.
        job:
          allOf:
            - type: object
              required:
                - _id
              properties:
                _id:
                  $ref: '#/components/schemas/ObjectId'
                title:
                  type: string
          nullable: true
          description: The reviewed job (title); null if not found.
    UsersReviewsResponse:
      type: object
      description: >-
        Reviews from the raw `reviews` collection with providerId = user and reviewerType != "provider" (i.e. written by
        clients; rows without reviewerType count).
      required:
        - summary
        - reviews
        - pagination
      properties:
        summary:
          type: object
          description: Over ALL client-written reviews of this provider — not affected by `rating` or pagination.
          required:
            - average
            - count
            - distribution
            - categories
          properties:
            average:
              type: number
              description: Mean rating rounded to 1 decimal; 0 when there are no reviews.
            count:
              type: integer
            distribution:
              type: object
              description: >-
                Review count per star, keys "5".."1" always present. Ratings are rounded and clamped to 1–5; a missing/0
                rating lands in "1".
              required:
                - '5'
                - '4'
                - '3'
                - '2'
                - '1'
              properties:
                '1':
                  type: integer
                '2':
                  type: integer
                '3':
                  type: integer
                '4':
                  type: integer
                '5':
                  type: integer
            categories:
              type: array
              items:
                type: object
                required:
                  - key
                  - label
                  - average
                  - count
                properties:
                  key:
                    type: string
                  label:
                    type: string
                    description: Stored label, else the key humanised ("on_time" → "On Time").
                  average:
                    type: number
                    description: Rounded to 1 decimal.
                  count:
                    type: integer
              description: Per categoryRatings.key averages, sorted by key.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/UsersReview'
          description: Newest first; filtered by `rating` when given.
        pagination:
          $ref: '#/components/schemas/UsersPagination'
    UsersStandingResponse:
      type: object
      description: Counts only; all zero for an unknown user.
      required:
        - reportsAgainst
        - reportsFiled
        - support
      properties:
        reportsAgainst:
          type: object
          required:
            - total
            - open
          properties:
            total:
              type: integer
              description: '`reports` with reportedUserId = user + `reportedposts` with jobPosterId or reportedUserId = user.'
            open:
              type: integer
              description: The same, restricted to status open/under_review.
        reportsFiled:
          type: integer
          description: '`reports` + `reportedposts` with reportedBy = user.'
        support:
          type: object
          required:
            - total
            - open
          properties:
            total:
              type: integer
              description: '`chatsupports` (userId ObjectId) + `supporttickets` (userId as ObjectId or string).'
            open:
              type: integer
              description: chatsupports with status "open" + supporttickets whose status is not closed/resolved.
    UsersPenaltiesResponse:
      type: object
      required:
        - success
        - totalPenalties
        - lastPenalty
      properties:
        success:
          type: boolean
          enum:
            - true
        totalPenalties:
          type: integer
          description: >-
            ActivityLog rows with targetId = user and actionType user_restricted, user_suspended or user_banned (soft
            deletes and unrestricts are not counted).
        lastPenalty:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: createdAt of the newest such row; null when none.
    UsersVerifyRequest:
      type: object
      properties:
        verified:
          type: boolean
          description: >-
            Value written to isVerified (Mongoose-cast: true/false, "true"/"false", 1/0, "1"/"0", "yes"/"no"; anything
            else → 400). Not required: when omitted the update carries isVerified undefined (the user is never marked
            verified), yet the audit row and socket event still record "unverified". The audit/socket wording uses JS
            truthiness, so the string "false" is logged as user_verified while storing false.
    UsersRestrictRequest:
      type: object
      properties:
        restricted:
          type: boolean
          description: >-
            Truthy → restrict; falsy or missing → remove restrictions (same effect as /unrestrict). Note any non-empty
            string, including "false", is truthy and restricts.
        duration:
          type: number
          description: >-
            Days (fractional allowed, e.g. 0.5 = 12 h). A value > 0 sets restrictionDetails.expiresAt = now + duration
            days. 0, negative, missing or non-numeric means indefinite (no expiresAt) and is recorded as duration -1 in
            the audit metadata. Numeric strings ("7") work.
        reason:
          type: string
          description: >-
            Trimmed; blank or missing is stored as "Account restricted by admin". When un-restricting, a given reason is
            only copied into the audit metadata.
    UsersBanRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Required, non-blank after trim. Must be a string (a non-string value fails with 500).
          minLength: 1
        duration:
          type: number
          description: >-
            Days (fractional allowed, e.g. 0.5 = 12 h). A value > 0 sets restrictionDetails.expiresAt = now + duration
            days. 0, negative, missing or non-numeric means indefinite (no expiresAt) and is recorded as duration -1 in
            the audit metadata. Numeric strings ("7") work. Missing → permanent ban.
    UsersSuspendRequest:
      type: object
      required:
        - reason
        - duration
      properties:
        reason:
          type: string
          description: Required, non-blank after trim. Must be a string (a non-string value fails with 500).
          minLength: 1
        duration:
          type: number
          description: >-
            Required, days, must be > 0 (fractional allowed). missing/0/negative → 400 "Valid suspension duration is
            required". suspendedUntil = expiresAt = now + duration days.
          exclusiveMinimum: true
          minimum: 0
    UsersDeleteRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Required, non-blank after trim. Must be a string (a non-string value fails with 500).
          minLength: 1
