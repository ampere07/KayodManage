              jobId:
                type: string
                description: Populated job _id, or the literal "NULL" when the job is missing.
              jobTitle:
                type: string
                description: Job title, or "NO JOB FOUND".
              providerId:
                allOf:
                  - $ref: '#/components/schemas/ObjectId'
                description: Absent when the provider is missing.
              providerName:
                type: string
                description: Absent when the provider is missing.
              description:
                type: string
              status:
                type: string
                enum:
                  - pending
                  - paid
