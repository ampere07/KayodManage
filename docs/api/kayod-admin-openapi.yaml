          $ref: '#/components/schemas/DateTime'
        dueDate:
          $ref: '#/components/schemas/DateTime'
        description:
          type: string
          description: 'FeeRecord.description, else "Platform fee for job: <title>", else "Platform fee (₱<amount>)".'
        notes:
          type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        __v:
          type: integer
        transactionType:
          type: string
          enum:
            - fee_record
        fromUser:
          $ref: '#/components/schemas/TransactionsFeeParty'
        toUser:
          $ref: '#/components/schemas/TransactionsFeeParty'
        fromUserData:
          $ref: '#/components/schemas/TransactionsFeeParty'
        toUserData:
          $ref: '#/components/schemas/TransactionsFeeParty'
        user:
          $ref: '#/components/schemas/TransactionsFeeParty'
        type:
          type: string
          description: Always fee_payment.
          enum:
            - fee_payment
        currency:
          type: string
          enum:
            - PHP
    TransactionsListItem:
      description: Either a Transaction row or a FeeRecord row, distinguished by `transactionType`.
      oneOf:
        - $ref: '#/components/schemas/TransactionsTransactionListRow'
        - $ref: '#/components/schemas/TransactionsFeeRecordListRow'
      discriminator:
        propertyName: transactionType
        mapping:
          transaction: '#/components/schemas/TransactionsTransactionListRow'
          fee_record: '#/components/schemas/TransactionsFeeRecordListRow'
    TransactionsDetailResponse:
      description: A Transaction (default) or a FeeRecord (when `?type=fee_record`).
      oneOf:
        - $ref: '#/components/schemas/TransactionsTransactionView'
        - $ref: '#/components/schemas/TransactionsFeeRecordDetail'
      discriminator:
        propertyName: transactionType
        mapping:
          transaction: '#/components/schemas/TransactionsTransactionView'
          fee_record: '#/components/schemas/TransactionsFeeRecordDetail'
    TransactionsPagination:
      type: object
      required:
        - page
        - limit
        - total
        - pages
      properties:
        page:
          type: integer
          description: Echo of the parsed page.
        limit:
          type: integer
          description: Echo of the parsed limit.
        total:
          type: integer
          description: >-
            Matching Transactions; with includeFees=true, plus ALL matching FeeRecords; with type=fee_record, matching
            FeeRecords only.
        pages:
          type: integer
          description: ceil(total / limit).
    TransactionsListResponse:
      type: object
      required:
        - transactions
        - pagination
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionsListItem'
        pagination:
          $ref: '#/components/schemas/TransactionsPagination'
    TransactionsStats:
      type: object
      description: >-
        Unfiltered, all-time tallies. "Revenue" is gross: the sum of `amount` over every completed Transaction of any
        type.
      required:
        - totalTransactions
        - completedTransactions
        - pendingTransactions
        - failedTransactions
        - totalRevenue
        - totalPlatformFees
        - totalFeeRecords
        - paidFees
        - pendingFees
        - totalFeeRevenue
        - combinedRevenue
      properties:
        totalTransactions:
          type: integer
          description: All Transactions.
        completedTransactions:
          type: integer
          description: status = completed.
        pendingTransactions:
          type: integer
          description: status = pending.
        failedTransactions:
          type: integer
          description: status = failed.
        totalRevenue:
          type: number
          description: 'Sum of amount over completed Transactions (all types: top-ups, withdrawals, refunds, payments...).'
        totalPlatformFees:
          type: number
          description: Sum of platformFee over completed Transactions.
        totalFeeRecords:
          type: integer
          description: All FeeRecords.
        paidFees:
          type: integer
          description: FeeRecords with status paid.
        pendingFees:
          type: integer
          description: FeeRecords with status pending or overdue.
        totalFeeRevenue:
          type: number
          description: Sum of amount over paid FeeRecords.
        combinedRevenue:
          type: number
          description: totalRevenue + totalFeeRevenue.
    TransactionsCounts:
      type: object
      description: >-
        Status tallies from one aggregation over Transactions (optionally one type). FeeRecords are not counted.
        `total`/`totalAmount` include every status (processing, held, expired, refunded, escrowed too), which are not
        broken out.
      required:
        - total
        - totalAmount
        - pending
        - pendingAmount
        - completed
        - completedAmount
        - completedRevenue
        - failed
        - failedAmount
        - cancelled
        - cancelledAmount
      properties:
        total:
          type: integer
        totalAmount:
          type: number
        pending:
          type: integer
        pendingAmount:
          type: number
        completed:
          type: integer
        completedAmount:
          type: number
        completedRevenue:
          type: number
          description: Alias of completedAmount.
        failed:
          type: integer
        failedAmount:
          type: number
        cancelled:
          type: integer
        cancelledAmount:
          type: number
    TransactionsStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
          description: >-
            New status. Ignored for xendit_topup / wallet_topup transactions (always forced to completed). For every
            other type it must be one of these values, else 400 "Invalid status" (so it is effectively required for
            non-top-ups).
          enum:
            - pending
            - completed
            - failed
            - cancelled
        type:
          type: string
          description: >-
            Pass "fee_record" and the request is refused with 403 before any lookup (fee records are read-only here).
            Any other value is ignored.
          example: transaction
    TransactionsStatusUpdateUser:
      type: object
      description: A populated User with select `name email phone location` (no profileImage).
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        location:
          type: string
    TransactionsStatusUpdateResult:
      type: object
      description: 'The updated Transaction (lean, `new: true`) with users/job populated and the compatibility aliases.'
      required:
        - _id
        - transactionType
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        fromUser:
