      description: >-
        Aggregates jobs with `budget > 0` (so quoted jobs, whose budget is 0, are excluded) and a professionName or
        category, optionally limited to `createdAt` within the chosen period, grouped by lowercased professionName
        (falling back to category). Sorted by summed budget descending, top 10. The match filter `{ $exists: true, $ne:
        null, $ne: "" }` is a JS object literal with a duplicated key, so only `$ne: ""` applies and null values are not
        excluded. Read-only. Access: `adminAuth` — the session must have `isAuthenticated` and a cached role of
        admin/superadmin, otherwise 403 `Admin access required` (an unauthenticated caller gets 403, not 401). The
        account is then re-read from `users`: if it no longer exists, is not `accountStatus: active`, or is no longer
        admin/superadmin, the session is destroyed and 401 `Your admin access has ended. Please sign in again.` is
        returned. If that lookup itself throws, the request proceeds on the cached session data. Per-page `permissions`
        flags are NOT checked by the server. Unexpected errors → 500 `Failed to fetch popular jobs data`.
      security:
        - sessionCookie: []
