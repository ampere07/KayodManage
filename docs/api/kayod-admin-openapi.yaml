  /api/transactions:
    get:
      operationId: getTransactions
      tags:
        - Transactions
      summary: List transactions (optionally merged with fee records), filtered and paged
      description: >-
        Queries Transactions with the filters below, newest first (createdAt desc), skip/limit at the database,
        populating fromUser/toUser/fromUserId/toUserId (name email phone location profileImage) and jobId (title
        category categoryName professionName icon userId assignedToId budget, with the job's userId/assignedToId
        populated incl. userType). Each row gets aliases (transactionType "transaction", fromUserData/toUserData,
        fromUser/toUser = resolved party, job, userId/user = sender) and xendit_topup rows show
        metadata.xenditPaymentMethod as paymentMethod.


        FeeRecords are added when includeFees=true or type=fee_record. Fee filters are translated: status
        completed→paid, pending→pending|overdue, failed→cancelled (any other status value does NOT filter fee records);
        paymentMethod and the date range apply as-is; `jobId` is NOT applied to fee records; `search` matches Job titles
        and then filters FeeRecords on a `job` field — but FeeRecord stores the reference as `jobId` (`job` is only a
        virtual), so a search that matches any job title returns no fee records, and a search that matches no job title
        leaves fee records unfiltered.


        type=fee_record: returns only fee rows, paged at the database (the Transaction query still runs and is
        discarded); total = matching FeeRecords.


        includeFees=true (any other type): the page of Transactions (already skipped/limited at the DB) is merged with
        the 50 most recent matching FeeRecords, re-sorted by createdAt and then sliced again with [skip, skip+limit).
        Page 1 is correct; on page ≥2 the Transactions are effectively skipped twice, so later pages are wrong or empty.
        total = matching Transactions + ALL matching FeeRecords.


        Read-only. Errors: a malformed jobId or unparseable dateFrom/dateTo is a 400 (cast error); an invalid regex in
        `search`, a negative page, or any other failure is a 500 "Failed to fetch transactions". Access: adminAuth
        (session role admin/superadmin and the account must still be active with an admin role; a
        deactivated/demoted/deleted admin gets a 401 and the session is destroyed; no admin session is a 403 "Admin
        access required").
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page. parseInt; missing, 0 or non-numeric → 1. A negative value produces a negative skip and a 500.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Page size. parseInt; missing, 0 or non-numeric → 20. No upper bound is enforced.
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive, UNESCAPED regex matched against Transaction.description OR Transaction.type (regex
            metacharacters are live; an invalid pattern is a 500). For fee records see the operation description.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: >-
            Transaction.type exact match. "all" or omitted = no type filter. "fee_record" = return only FeeRecords (as
            fee_payment rows). Not validated: an unknown value matches no Transactions (but still returns fee rows when
            includeFees=true).
          schema:
            type: string
            enum:
              - all
              - fee_record
              - immediate_payment
              - job_budget_deduction
              - job_budget_refund
              - job_escrow
              - escrow_payment
              - escrow_release
              - wallet_topup
              - fee_payment
              - refund
              - refund_request
              - compensation
              - platform_fee
              - withdrawal
              - xendit_topup
              - referral_bonus
              - premium_subscription
              - cancellation_fee
              - no_show_payout
            default: all
        - name: includeFees
          in: query
          required: false
          description: Merge FeeRecords into the list. Only the exact string "true" enables it.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            default: 'false'
        - name: status
          in: query
          required: false
          description: >-
            Transaction.status exact match; "all" or omitted = no filter. Not validated (unknown value matches nothing).
            For fee records only completed/pending/failed are translated (see description).
          schema:
            type: string
            enum:
              - all
              - pending
              - processing
              - completed
              - failed
              - cancelled
              - held
              - expired
              - refunded
              - escrowed
            default: all
        - name: paymentMethod
          in: query
          required: false
          description: >-
            Exact match on the STORED paymentMethod of Transactions and FeeRecords; "all" or omitted = no filter. (Rows
            display metadata.xenditPaymentMethod for xendit_topup, but the filter uses the stored value.) Not validated.
          schema:
            type: string
            enum:
              - all
              - wallet
              - xendit
              - bank_transfer
            default: all
        - name: dateFrom
          in: query
          required: false
          description: createdAt >= new Date(dateFrom). Any Date-parseable string; unparseable is a 400.
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: dateTo
          in: query
          required: false
          description: createdAt <= that day at 23:59:59.999 in the SERVER's local timezone. Unparseable is a 400.
          schema:
            type: string
            format: date
            example: '2026-10-31'
        - name: jobId
          in: query
          required: false
          description: Only Transactions with this jobId (not applied to fee records). Malformed id is a 400 "Invalid jobId".
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: A page of rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/{transactionId}:
    get:
      operationId: getTransactionDetails
      tags:
        - Transactions
      summary: One transaction, or one fee record with ?type=fee_record
      description: >-
        Default: Transaction.findById (lean) with users (name email phone location profileImage) and job (title
        description category categoryName professionName icon userId assignedToId budget, nested users incl. userType)
        populated, plus aliases (transactionType, fromUserData/toUserData, fromUser/toUser, job) and the xendit display
        paymentMethod. Unlike the list row there are no userId/user aliases.


        type=fee_record: FeeRecord.findById (lean) with providerId, jobId (incl. description, nested users) and
        transaction (`_id amount status`) populated, reshaped like a transaction (customer = job client, provider = job
        assignee → providerId → placeholder; type fee_payment; status mapped paid→completed, cancelled→failed, else
        pending — the stored status is overwritten; currency PHP).


        Read-only. 404 "Transaction not found" for either lookup; a malformed id is a 400 "Invalid _id". Other errors
        are a 500 "Failed to fetch transaction details". Access: adminAuth (session role admin/superadmin and the
        account must still be active with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session
        is destroyed; no admin session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Transaction _id, or FeeRecord _id when type=fee_record.
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: type
          in: query
          required: false
          description: '"fee_record" looks the id up in FeeRecords; any other value (or none) looks it up in Transactions.'
          schema:
            type: string
            enum:
              - transaction
              - fee_record
            default: transaction
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/{transactionId}/approve-refund:
    post:
      operationId: approveRefund
      tags:
        - Transactions
      summary: Approve a pending refund request and move the money
      description: >-
        No request body is read (no amount override, no reason). Steps, none of them in a MongoDB transaction:

        1. Load the Transaction (fromUser/fromUserId populated name). 404 "Transaction not found"; type must be
        refund_request or refund, else 400 "Transaction is not a refund request"; status must be pending, else 400
        "Transaction is already <status>". The check-then-save is not atomic, so two concurrent approvals can both pass
        and credit twice.

        2. refundAmount = transaction.amount; if that is 0 and the job exists, falls back to job.escrowAmount ||
        job.agreedPrice || job.budget (and writes it into transaction.amount).

        3. Transaction: status=completed, completedAt=now, refundStatus=approved (save(), full validation — a
        ValidationError is a 400).

        4. Client (fromUser || fromUserId) wallet, if refundAmount > 0: raw `wallets` collection $inc availableBalance
        +refundAmount, matched by userId as ObjectId, falling back to userId as string. No wallet found, or any error
        here, is only logged — the request still succeeds and nothing is credited.

        5. If the job exists: Job $inc escrowAmount −refundAmount (no validators, can go negative) and
        paymentStatus=refunded; ReportedPosts for the job with status "pending" → status "resolved", reviewedBy=admin,
        reviewedAt, adminNotes "Refund approved for <amount> PHP. Status auto-resolved." (both are legacy values outside
        the current report-status enum, so current open/under_review reports are not touched); provider
        (job.assignedToId || job.acceptedProvider), if refundAmount > 0: raw `wallets` $inc balance −refundAmount
        matched on userId or user (can go negative), and that provider's pending escrow_payment Transactions for the job
        → cancelled. Errors in this step are NOT caught: they surface as a 500 after the refund and client credit are
        already committed.

        6. ActivityLog row transaction_completed (targetType transaction, targetModel Transaction, metadata {amount,
        type}).

        7. Emits `transaction:updated` {transaction, updateType:"approved refund"}. The Socket.IO emit goes to room
        `admin` on the DEFAULT namespace (`io.to('admin')`); admin dashboards connect to the `/admin` namespace and join
        its `admin` room, so no client currently receives this event.

        Other errors are a 500 "Failed to approve refund". Access: adminAuth (session role admin/superadmin and the
        account must still be active with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session
        is destroyed; no admin session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Refund Transaction _id. Malformed is a 400 "Invalid _id".
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Refund approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsRefundResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/{transactionId}/decline-refund:
    post:
      operationId: declineRefund
      tags:
        - Transactions
      summary: Decline a pending refund request (no money moves)
      description: >-
        No request body is read: the failure reason is always "Declined by admin". Loads the Transaction
        (fromUser/fromUserId populated name); 404 "Transaction not found"; type must be refund_request or refund (400
        "Transaction is not a refund request"); status must be pending (400 "Transaction is already <status>"). Sets
        status=failed, failedAt=now, failureReason="Declined by admin", refundStatus=declined (save()). No wallet, job
        or escrow change — the held escrow stays on the job. If the transaction has a jobId, ReportedPosts for that job
        with legacy status "pending" → dismissed (reviewedBy, reviewedAt, adminNotes "Refund declined by admin. Report
        auto-dismissed."). Writes ActivityLog transaction_failed (metadata {amount, type}). Emits `transaction:updated`
        {transaction, updateType:"declined refund"}. The Socket.IO emit goes to room `admin` on the DEFAULT namespace
        (`io.to('admin')`); admin dashboards connect to the `/admin` namespace and join its `admin` room, so no client
        currently receives this event. Other errors are a 500 "Failed to decline refund". Access: adminAuth (session
        role admin/superadmin and the account must still be active with an admin role; a deactivated/demoted/deleted
        admin gets a 401 and the session is destroyed; no admin session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Refund Transaction _id. Malformed is a 400 "Invalid _id".
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Refund declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsRefundResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/{transactionId}/status:
    patch:
      operationId: updateTransactionStatus
      tags:
        - Transactions
      summary: Set a transaction's status (top-ups are always forced to completed)
      description: >-
        Body `type: "fee_record"` → 403 "Fee records are read-only and cannot be updated from transactions", checked
        before the id is even looked up. Otherwise loads the Transaction (404 "Transaction not found"; malformed id →
        400).


        xendit_topup / wallet_topup: `status` is ignored; the transaction is set to completed with completedAt=now
        whatever its current status (failed/cancelled/already-completed included). Then `User.findByIdAndUpdate(sender,
        {$inc: {"wallet.balance": amount}})`, which Mongoose strips (wallet is a virtual on User) — no wallet is
        credited, only the user's updatedAt changes. ActivityLog transaction_completed ("Auto-approved top-up
        transaction for <name>"). Emits `transaction:updated` {updateType:"auto-approved top-up"}.


        Any other type: status must be pending | completed | failed | cancelled (400 "Invalid status").
        findByIdAndUpdate sets it (+completedAt for completed, +failedAt for failed) with no transition rules and NO
        money movement — e.g. completing a refund_request here credits nobody (use approve-refund for that), and a
        completed transaction can be put back to pending. ActivityLog transaction_completed / transaction_failed only
        for completed / failed (pending/cancelled are not audited). Emits `transaction:updated` {updateType:"status
        changed to <status>"}.


        The Socket.IO emit goes to room `admin` on the DEFAULT namespace (`io.to('admin')`); admin dashboards connect to
        the `/admin` namespace and join its `admin` room, so no client currently receives this event. Other errors are a
        500 "Failed to update transaction status". Access: adminAuth (session role admin/superadmin and the account must
        still be active with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session is destroyed;
        no admin session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Transaction _id.
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionsStatusUpdateRequest'
      responses:
        '200':
          description: The updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsStatusUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Either the admin-session refusal from adminAuth ("Admin access required") or body type "fee_record" ("Fee
            records are read-only and cannot be updated from transactions").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/approve-topups:
    post:
      operationId: approvePendingTopups
      tags:
        - Transactions
      summary: Mark every pending top-up as completed (inline handler)
      description: >-
        Finds all Transactions with type xendit_topup or wallet_topup and status pending (fromUser/fromUserId populated
        name+email) and, one at a time, sets status=completed and completedAt=now via document save() (full schema
        validation). For each it then calls `User.findByIdAndUpdate(userId, {$inc: {"wallet.balance": amount}})` — but
        `wallet` is only a populate virtual on User, so Mongoose strict mode strips the $inc and the call only bumps the
        user's updatedAt: NO wallet (Wallet collection or otherwise) is credited. Not atomic and not isolated per item:
        a save error mid-loop (e.g. a legacy document failing validation) aborts with a 500, leaving the earlier top-ups
        already completed. On success writes one ActivityLog row (bulk_transaction_approval, targetType transaction,
        metadata {count}) and emits `transactions:bulk-approved` {count, transactions}; when nothing is pending it
        returns early with approved 0 and does neither. The Socket.IO emit goes to room `admin` on the DEFAULT namespace
        (`io.to('admin')`); admin dashboards connect to the `/admin` namespace and join its `admin` room, so no client
        currently receives this event. Not wrapped in asyncHandler: any failure is a 500 {success:false, error:"Failed
        to auto-approve top-ups", details:<message>}. Same job as POST /api/admin/approve-topups-now but older and
        without per-item error isolation. Access: adminAuth (session role admin/superadmin and the account must still be
        active with an admin role; a deactivated/demoted/deleted admin gets a 401 and the session is destroyed; no admin
        session is a 403 "Admin access required").
      security:
        - sessionCookie: []
      x-access: admin
      responses:
        '200':
          description: Approved (or nothing pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsBulkTopupApproval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/transactions/counts:
    get:
      operationId: getTransactionCounts
